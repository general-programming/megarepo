PACKAGE_NAME="nvme-noreset"
PACKAGE_VERSION="1.0"

MAKE[0]="make KDIR=${kernel_source_dir} modules"
CLEAN="make KDIR=${kernel_source_dir} clean"

# Only nvme-core is rebuilt. Stock nvme.ko / nvme-fabrics / nvme-tcp keep
# loading against it because no exported prototype changes, so no symbol CRC
# changes. ./check-crc.sh proves that; install.sh refuses to install if it
# ever stops being true.
BUILT_MODULE_NAME[0]="nvme-core"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/kernel/drivers/nvme/host"

# Never let this get pulled onto a kernel it was not vendored for: the source
# in src/ is a copy of one specific kernel's drivers/nvme/host and will not
# even compile against a different major version.
AUTOINSTALL="no"
REMAKE_INITRD="yes"
