set system host-name 'fmt2-vpn-spine-1'
set system domain-name 'generalprogramming.org'
set system login user supertech authentication plaintext-password 'SECRET-host-fmt2-vpn-spine-1-admin-password'
set service snmp community 'genprogllc' authorization 'ro'
set service snmp location 'General Programming Virtual Infrastructure'
set service snmp contact 'support@generalprogramming.org'
set system name-server '10.255.1.9'
set system name-server '1.1.1.1'

set interfaces loopback lo

set system syslog local facility all level info
set system syslog local facility local7 level debug
set system console device ttyS0 speed 115200
set system config-management commit-revisions 100

set system conntrack modules ftp
set system conntrack modules h323
set system conntrack modules nfs
set system conntrack modules pptp
set system conntrack modules sip
set system conntrack modules sqlnet
set system conntrack modules tftp
set interfaces ethernet eth0 address dhcp
set interfaces ethernet eth0 ipv6 address autoconf
set interfaces ethernet eth0 address 2a0d:1a43:8008:420::1/64
set interfaces ethernet eth0 description 'external uplink'
set interfaces ethernet eth1 address 10.255.1.21/24
set interfaces ethernet eth1 description 'management vlan'
set interfaces dummy dum0 address 10.255.2.1/32
set interfaces dummy dum0 description 'underlay loopback'

set service ssh disable-password-authentication
set system login user supertech authentication public-keys erin key AAAAC3NzaC1lZDI1NTE5AAAAIMVk9i7FG7dc9r4ixwAJT7uPLH3UuqbwIgeZ7Ytmnpvv
set system login user supertech authentication public-keys erin type ssh-ed25519

set system update-check url https://raw.githubusercontent.com/vyos/vyos-nightly-build/refs/heads/rolling/version.json
set service ssh port 22
set protocols bfd profile bgp echo-mode
set protocols bfd profile bgp interval echo-interval 50
set service https api rest
set service https api keys id vaultadmin key 'VAULT-vyos_api_password'

set firewall global-options all-ping enable
set firewall global-options broadcast-ping enable


set service ntp server time1.vyos.net
set service ntp server time2.vyos.net
set service ntp server time3.vyos.net
set service ntp allow-client address 10.0.0.0/8
set service ntp allow-client address 127.0.0.0/8
set service ntp allow-client address 169.254.0.0/16
set service ntp allow-client address 172.16.0.0/12
set service ntp allow-client address 192.168.0.0/16
set service ntp allow-client address ::1/128
set service ntp allow-client address fc00::/7
set service ntp allow-client address fe80::/10



