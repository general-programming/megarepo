hostname fmt2-con-sw-140752-1
enable password SECRET-host-fmt2-con-sw-140752-1-admin-password
username admin password SECRET-host-fmt2-con-sw-140752-1-admin-password privilege 15
!
ip ssh server
!
aaa new-model

tacacs-server key SECRET-tacacs-keys-fmt2-con-sw-140752-1
aaa authentication login default tacacs local
aaa authentication enable default tacacs enable
ip http authentication tacacs local
ip https authentication tacacs local

aaa authorization exec default tacacs local

aaa accounting exec default start-stop tacacs
aaa accounting commands default start-stop tacacs
!
vlan 10
    name office-lan
!
vlan 20
    name servers
!
vlan 99
    name native
!
interface GigabitEthernet1/0/1
    switchport mode access
    switchport access vlan 10
    description "workstation"
    no shutdown
!
interface GigabitEthernet1/0/2
    switchport mode trunk native vlan 99
    channel-group 1 mode active
    description "uplink"
    no shutdown
!
interface GigabitEthernet1/0/3
    switchport mode trunk 
    no shutdown
!
interface Port-Channel1
    description "port-channel"
    no shutdown
!
interface Vlan10
    vrf internal
    description "svi"
    ip address 10.65.68.2 255.255.255.0
    no shutdown
!
ip route default 10.65.67.1
!
snmp-server community genprogllc ro
snmp-server contact support@generalprogramming.org
