hostname fmt2-con-sw-140752-1
ip domain-name generalprogramming.org
enable password SECRET-host-fmt2-con-sw-140752-1-admin-password
user admin secret SECRET-host-fmt2-con-sw-140752-1-admin-password privilege 15

vlan 10
    name office-lan
!
vlan 20
    name servers
!
vlan 99
    name native
!
interface GigabitEthernet1/0/1
    switchport mode access
    switchport access vlan 10
    description "workstation"
    no shutdown
!
interface GigabitEthernet1/0/2
    switchport mode trunk native vlan 99
    channel-group 1 mode active
    description "uplink"
    no shutdown
!
interface GigabitEthernet1/0/3
    switchport mode trunk 
    no shutdown
!
interface Port-Channel1
    description "port-channel"
    no shutdown
!
interface Vlan10
    vrf internal
    description "svi"
    ip address 10.65.68.2 255.255.255.0
    no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.65.67.1
ip default-gateway 10.65.67.1
ntp server 0.pool.ntp.org
ntp server 1.pool.ntp.org
cdp run
lldp run
snmp-server community genprogllc ro
snmp-server contact support@generalprogramming.org
ip scp server enable
