apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=true
    argocd.argoproj.io/sync-wave: "-2"
  name: test
  namespace: argocd
spec:
  # no clusterResourceWhitelist: test apps may not create cluster-scoped resources.
  # App dirs under argocd/apps/test/ must be named test-* to match destinations.
  description: test project
  destinations:
  - namespace: 'test-*'
    server: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  sourceRepos:
  - git@github.com:general-programming/megarepo.git

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: test
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters: {}
          - git:
              repoURL: git@github.com:general-programming/megarepo.git
              revision: HEAD
              directories:
              - path: argocd/apps/test/*
  syncPolicy: {}
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: "test"
      source:
        repoURL: git@github.com:general-programming/megarepo.git
        targetRevision: HEAD
        path: '{{path}}/{{name}}'
      destination:
        server: '{{server}}'
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: true
        syncOptions:
          - allowEmpty=true
      ignoreDifferences:
      - group: argoproj.io
        jsonPointers:
        - /status
        kind: Application
