apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=true
    argocd.argoproj.io/sync-wave: "-2"
  name: erin-apps
  namespace: argocd
spec:
  # Namespace only (scraper-projects ships one); everything else here is namespaced
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  description: erin's shit
  destinations:
  - namespace: '*'
    server: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  sourceRepos:
  - git@github.com:general-programming/megarepo.git

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: erin-apps
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters: {}
          # Only generate apps for overlays that exist on this cluster.
          - git:
              repoURL: git@github.com:general-programming/megarepo.git
              revision: HEAD
              directories:
              - path: argocd/apps/erin-apps/*/{{name}}
  syncPolicy: {}
  template:
    metadata:
      name: '{{path[3]}}'
    spec:
      project: "erin-apps"
      source:
        repoURL: git@github.com:general-programming/megarepo.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: '{{server}}'
        namespace: '{{path[3]}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: true
        syncOptions:
          - allowEmpty=true
      ignoreDifferences:
      - group: argoproj.io
        jsonPointers:
        - /status
        kind: Application
