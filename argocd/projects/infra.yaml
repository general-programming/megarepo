apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=true
    argocd.argoproj.io/sync-wave: "-2"
  name: infra
  namespace: argocd
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  description: infra project
  destinations:
  - namespace: '*'
    server: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  sourceRepos:
  - git@github.com:general-programming/megarepo.git
  # helm-source Applications (cilium-helm, consul-helm, traefik-helm) pull charts directly
  - https://helm.cilium.io
  - https://helm.releases.hashicorp.com
  - https://traefik.github.io/charts

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: infra
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters: {}
          - git:
              repoURL: git@github.com:general-programming/megarepo.git
              revision: HEAD
              directories:
              - path: argocd/apps/infra/*
  syncPolicy: {}
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: "infra"
      source:
        repoURL: git@github.com:general-programming/megarepo.git
        targetRevision: HEAD
        path: '{{path}}/{{name}}'
      destination:
        server: '{{server}}'
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: true
        syncOptions:
          - allowEmpty=true
          - ServerSideApply=true
          # without this, sync still applies ignored fields and stomps controller-owned values
          - RespectIgnoreDifferences=true
      ignoreDifferences:
      - group: argoproj.io
        jsonPointers:
        - /status
        kind: Application
      - group: "apiextensions.k8s.io"
        kind: CustomResourceDefinition
        name: bgppeers.metallb.io
        jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
      - group: "apiextensions.k8s.io"
        kind: CustomResourceDefinition
        name: addresspools.metallb.io
        jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
      # for rook
      - group: "*"
        kind: "*"
        managedFieldsManagers:
        - rook
      # tailscale-operator rewrites egress ExternalName Services to its ts-* proxy FQDN
      - kind: Service
        name: svc-vmselect-sea1
        namespace: victoriametrics
        jsonPointers:
        - /spec/externalName
      # for vault
      - group: "admissionregistration.k8s.io"
        kind: MutatingWebhookConfiguration
        name: vault-helm-agent-injector-cfg
        jqPathExpressions:
          - .webhooks[].clientConfig.caBundle
