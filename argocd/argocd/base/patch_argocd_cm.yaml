apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations: |
    networking.k8s.io/Ingress:
      health.lua: |
        hs = {}
        hs.status = "Healthy"
        return hs
    # The VM operator defaults every alerting rule to `record: ""`, a key our
    # manifests never set, so all 11 VMRules sit permanently OutOfSync. Drop the
    # key only when it is empty -- a genuine recording rule has a non-empty
    # value and stays diffed.
    operator.victoriametrics.com/VMRule:
      ignoreDifferences: |
        jqPathExpressions:
          - '.spec.groups[]?.rules[]? | select(.record == "") | .record'
  kustomize.buildOptions: "--enable-helm"
