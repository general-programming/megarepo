apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
# pinned to the commit behind tag v0.4.20; tags are mutable, SHAs are not
- github.com/argoproj-labs/argocd-autopilot/manifests/ha?ref=a1d2d4c97c59d19127b1bfc1eca3149ca0984df9
- argocd-lb.yaml
patches:
  - path: rbac.yaml
    target:
      kind: ConfigMap
      name: argocd-rbac-cm
  - path: patch_ha.yaml
  - path: patch_dex_probes.yaml
  - path: patch_argocd_cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: patch_cm_dex.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
