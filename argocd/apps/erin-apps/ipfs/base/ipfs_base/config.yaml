---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ipfs-config
  labels:
    app.kubernetes.io/component: ipfs
    app.kubernetes.io/name: ipfs
data:
  IPFS_PROFILE: server
  # Emit structured logs so Loki can parse them with `| json` instead of
  # regex against kubo's tab-delimited default.
  GOLOG_LOG_FMT: json
