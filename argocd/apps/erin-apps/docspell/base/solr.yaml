apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: solr
  labels:
    app: solr
spec:
  replicas: 1
  serviceName: solr
  selector:
    matchLabels:
      app: solr
  template:
    metadata:
      labels:
        app: solr
    spec:
      containers:
        - name: solr
          image: solr:9
          ports:
            - containerPort: 8983
          command:
            - bash
            - -c
            - 'precreate-core docspell; exec solr -f -Dsolr.modules=analysis-extras'
          env:
            - name: SOLR_PORT
              value: "8983"
            # Keep logs (and the per-request jetty log) off the cephfs PVC; a
            # stalled write there blocks the request thread the probes hit.
            - name: SOLR_LOGS_DIR
              value: /var/log/solr
            - name: SOLR_REQUESTLOG_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /solr/admin/info/system
              port: 8983
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /solr/admin/info/system
              port: 8983
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /solr/admin/info/system
              port: 8983
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: solr-data
              mountPath: /var/solr
            - name: solr-logs
              mountPath: /var/log/solr
      volumes:
        - name: solr-logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: solr-data
      spec:
        storageClassName: cephfs
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: solr
spec:
  selector:
    app: solr
  ports:
  - name: solr
    port: 8983
    targetPort: 8983
