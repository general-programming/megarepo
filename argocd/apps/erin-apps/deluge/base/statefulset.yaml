
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: deluge
spec:
  selector:
    matchLabels:
      app: deluge
  serviceName: "deluge"
  replicas: 1
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app: deluge
    spec:
      terminationGracePeriodSeconds: 10
      restartPolicy: Always
      containers:
      - name: deluge
        image: lscr.io/linuxserver/deluge:latest
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "2"
            memory: "2Gi"
        ports:
        - containerPort: 8112
          name: http
        - containerPort: 30888
          name: torrent-tcp
        - containerPort: 30888
          protocol: UDP
          name: torrent-udp
        volumeMounts:
        - name: deluge-data
          mountPath: /downloads
        - name: deluge-config
          mountPath: /config
      dnsPolicy: Default
      volumes:
        # Static claim from pvc-data.yaml rather than a volumeClaimTemplate:
        # templates are immutable, so every resize would mean orphan-deleting
        # this StatefulSet. The old 512Gi ceph-rbd-xfs claim
        # (deluge-data-deluge-0) is left bound as the rollback copy.
        - name: deluge-data
          persistentVolumeClaim:
            claimName: deluge-data
  volumeClaimTemplates:
  - metadata:
      name: deluge-config
    spec:
      storageClassName: ceph-rbd-xfs
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
