apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mastodon-coolmathgames
resources:
  - "database.yaml"
  - "es-certificates.yaml"
helmCharts:
  - name: mastodon
    releaseName: mastodon
    repo: https://codeberg.org/api/packages/open-engineering/helm
    # Back on 13.x, the version still running. 14 swapped Redis for Valkey and
    # these values still configure redis (nil redis.sidekiq); 15.0.1 also ships
    # valkey.dataStorage, which its own subchart rejects. Upgrade = data-store move.
    version: 13.0.6
    valuesFile: mastodon-values.yaml
    namespace: mastodon-coolmathgames
images:
  - name: docker.io/bitnami/redis
    newName: docker.io/bitnamilegacy/redis
patches:
  - path: patch-chewy-upgrade-es-pass.yaml
    target:
      kind: Job
      name: mastodon-chewy-upgrade
  # A persistent exporter must participate in normal Argo updates and health.
  # Helm hook annotations otherwise leave it unchanged even when values change.
  # The chart's command omits --only-mapping, so each hourly run re-imported every
  # index (~100 min, overlapping). Sidekiq already indexes writes as they happen.
  - target:
      kind: CronJob
      name: mastodon-update-search-index-mappings
    patch: |-
      - op: add
        path: /spec/concurrencyPolicy
        value: Forbid
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/command/3
        value: --only-mapping
  - target:
      kind: Deployment
      name: mastodon-elasticsearch-metrics
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
