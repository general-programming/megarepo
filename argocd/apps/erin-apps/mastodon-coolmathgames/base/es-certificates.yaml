---
# Transport TLS certificates for Elasticsearch, issued by cert-manager.
#
# WHY NOT security.tls.autoGenerated: true -- the obvious answer, which is a trap
# here. That setting makes the chart mint certs with Helm's genSignedCert, which
# has no state to persist them between renders. Under `kustomize --enable-helm`
# there is no Helm release, so every render produces a DIFFERENT CA and leaf.
# Measured, not assumed: two consecutive renders of this kustomization produced
# different cert material. With ArgoCD auto-sync and selfHeal on a 3-minute
# reconcile, that would rewrite the transport CA of a 6-node cluster
# continuously -- masters and data nodes ending up on mismatched CAs mid-roll,
# which takes the cluster down rather than degrading it.
#
# cert-manager owns them instead: stable across renders, and ArgoCD only manages
# the Certificate objects, never the generated Secrets.
#
# letsencrypt-genprog cannot be used -- it is an ACME issuer and these are
# .svc.cluster.local names, which no public CA will sign. A private CA scoped to
# this one namespace is the right tool: its only purpose is letting ES nodes
# recognise each other.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: es-selfsigned
spec:
  selfSigned: {}
---
# The CA. Long-lived because rotating it means restarting every ES node at once.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: es-ca
spec:
  isCA: true
  commonName: mastodon-elasticsearch-ca
  secretName: mastodon-elasticsearch-ca
  duration: 87600h    # 10y
  renewBefore: 720h   # 30d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: es-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: es-ca
spec:
  ca:
    secretName: mastodon-elasticsearch-ca
---
# Leaf certs, one per node type, in the kubernetes.io/tls layout the chart mounts
# (ca.crt + tls.crt + tls.key, which is what security.tls.usePemCerts expects).
#
# Both certs carry the SANs of BOTH headless services. That is deliberate: with
# verificationMode left at `full`, a node validates the hostname it dialled, and
# masters and data nodes dial each other. A cert covering only its own service
# would fail peer verification in one direction and the cluster would not form.
#
# The wildcard covers per-pod DNS -- mastodon-elasticsearch-master-0.<hl-svc>...
# -- so scaling replicas needs no cert change.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mastodon-elasticsearch-master-crt
spec:
  secretName: mastodon-elasticsearch-master-crt
  duration: 8760h    # 1y
  renewBefore: 720h  # 30d
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: es-ca
    kind: Issuer
  commonName: mastodon-elasticsearch-master
  dnsNames:
    - mastodon-elasticsearch
    - mastodon-elasticsearch.mastodon-coolmathgames.svc.cluster.local
    - mastodon-elasticsearch-master-hl
    - mastodon-elasticsearch-master-hl.mastodon-coolmathgames.svc.cluster.local
    - "*.mastodon-elasticsearch-master-hl.mastodon-coolmathgames.svc.cluster.local"
    - mastodon-elasticsearch-data-hl
    - mastodon-elasticsearch-data-hl.mastodon-coolmathgames.svc.cluster.local
    - "*.mastodon-elasticsearch-data-hl.mastodon-coolmathgames.svc.cluster.local"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mastodon-elasticsearch-data-crt
spec:
  secretName: mastodon-elasticsearch-data-crt
  duration: 8760h    # 1y
  renewBefore: 720h  # 30d
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: es-ca
    kind: Issuer
  commonName: mastodon-elasticsearch-data
  dnsNames:
    - mastodon-elasticsearch
    - mastodon-elasticsearch.mastodon-coolmathgames.svc.cluster.local
    - mastodon-elasticsearch-data-hl
    - mastodon-elasticsearch-data-hl.mastodon-coolmathgames.svc.cluster.local
    - "*.mastodon-elasticsearch-data-hl.mastodon-coolmathgames.svc.cluster.local"
    - mastodon-elasticsearch-master-hl
    - mastodon-elasticsearch-master-hl.mastodon-coolmathgames.svc.cluster.local
    - "*.mastodon-elasticsearch-master-hl.mastodon-coolmathgames.svc.cluster.local"
