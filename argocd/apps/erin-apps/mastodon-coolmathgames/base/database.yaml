---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mastodon-db
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-standard-trixie
    major: 18
  instances: 2
  primaryUpdateStrategy: unsupervised
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: generalprogramming.org/no-database
                operator: DoesNotExist
  storage:
    # Ceph, NOT local-path. 32Gi is sized from measured usage: pgdata was 14G
    # against a 2Gi declared PVC -- 7x over -- because local-path is a hostPath
    # directory and enforces no quota. Ceph RBD does enforce it, so the old
    # figure would have under-provisioned and filled mid-basebackup.
    #
    # resizeInUseVolumes MUST be false while the old local-path PVC still
    # exists: CNPG otherwise tries to expand THAT PVC to 32Gi, local-path has
    # allowVolumeExpansion=false, and the error aborts the reconcile before the
    # replacement instance is ever created. Remove once no local-path PVC
    # remains in this cluster.
    storageClass: ceph-rbd-xfs
    size: 32Gi
    resizeInUseVolumes: false
  bootstrap:
    initdb:
      database: mastodon
      owner: mastodon
      import:
        type: microservice
        databases:
          - mastodon
  postgresql:
    parameters:
      max_connections: "256"
      shared_buffers: "1GB"
