image:
  repository: ghcr.io/theessem/mastodon
  tag: nightly.2026-08-15  # renovate: datasource=docker depName=ghcr.io/theessem/mastodon

mastodon:
  hooks:
    dbMigrate:
      enabled: true
    assetsPrecompile:
      enabled: false

  # streaming config
  streaming:
    image:
      repository: ghcr.io/theessem/mastodon-streaming
      tag: nightly.2026-08-15  # renovate: datasource=docker depName=ghcr.io/theessem/mastodon-streaming

    replicas: 3
    # Stateless — prefer spreading the 3 replicas across nodes, never block.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: streaming

  # very IMPORTANT
  local_domain: coolmathgam.es

  # add extra vars
  extraEnvVars:
    - name: EXTRA_DATA_HOSTS
      value: "https://blob.jortage.com"
    - name: EXPERIMENTAL_FEATURES
      value: wrapstodon
    # ES_PASS has to be injected here rather than through a chart value, because
    # the chart only wires it into the media-remove cronjob -- web, sidekiq and
    # the hourly search-index cronjob get their environment from `envFrom` on the
    # env ConfigMap and the main Secret, neither of which carries an ES
    # credential. Enabling ES security without this would leave search broken
    # everywhere except media-remove.
    #
    # `mastodon.extraEnvVars` is rendered with `toYaml` straight into `env:` on
    # deployment-web, deployment-sidekiq and cronjob-elastic-search-index, so a
    # valueFrom works and all three are covered by this one entry.
    # job-deploy-search is NOT covered -- it does not render extraEnvVars -- but
    # `mastodon.hooks.deploySearch.enabled` is false, so it does not render at
    # all. Turning that hook on later needs this revisited.
    - name: ES_PASS
      valueFrom:
        secretKeyRef:
          name: mastodon-elasticsearch
          key: password

  # add SECRET_KEY_BASE, OTP_SECRET, VAPID_PRIVATE_KEY, VAPID_PUBLIC_KEY to vault
  secrets:
    existingSecret: mastodon-secrets

  # storage config
  s3:
    enabled: true
    # add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY to vault
    existingSecret: mastodon-s3
    alias_host: pool.jortage.com/coolmathgames
    # this should not be secret
    secretKeys:
      # bucket: coolmathgames
      s3Bucket: "S3_BUCKET"
      # endpoint: https://pool-api.jortage.com
      s3Endpoint: "S3_ENDPOINT"
      # hostname: pool-api.jortage.com
      s3Hostname: "S3_HOSTNAME"
      # region: jort
      s3Region: "S3_REGION"

  # shamelessly copied from values
  sidekiq:
    workers:
      # "Make sure the scheduler queue only exists once and with a worker that has 1 replica."
      - name: scheduler
        concurrency: 25
        replicas: 1
        resources: {}
        affinity: {}
        topologySpreadConstraints: {}
        queues:
          - scheduler
        image:
          repository:
          tag:
        customDatabaseConfigYml:
          configMapRef:
            name:
            key:
      # everything else
      - name: all-queues
        concurrency: 25
        replicas: 3
        resources: {}
        affinity: {}
        # Stateless — prefer spreading the 3 replicas across nodes, never block.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: sidekiq-all-queues
        queues:
          - default,8
          - push,6
          - ingress,4
          - mailers,2
          - fasp,1
          - pull
        image:
          repository:
          tag:
        # allows you to mount a custom database.yml from a configmap
        # please note that we do not advise using a read-only replica for sidekiq workers
        customDatabaseConfigYml:
          configMapRef:
            name:
            key:

  smtp:
    server: smtp.sendgrid.net
    port: 587
    # login + password set in vault
    existingSecret: mastodon-smtp
    from_address: automated@coolmathgam.es

  web:
    replicas: 3
    # Stateless — prefer spreading the 3 replicas across nodes, never block.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: web

  metrics:
    statsd:
      exporter:
        enabled: true

ingress:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

  hosts:
    - host: coolmathgam.es
      paths:
        - path: "/"

  tls: null

  streaming:
    tls: null

redis:
  default:
    storageClass: ceph-rbd-xfs

  volumePermissions:
    enabled: true

  auth:
    password: "this_is_insecure_but_it_is_redis_so_who_cares"

  master:
    persistence:
      enabled: false

  replica:
    persistence:
      enabled: false
    replicaCount: 3

elasticsearch:
  default:
    storageClass: ceph-rbd-xfs

  preset: small_cluster

  # X-Pack security. FREE on this cluster -- the license is perpetual `basic`
  # and `GET /_xpack` already reports security as available:true, enabled:false,
  # while the genuinely paid features (graph, ml, watcher) report
  # available:false. Elastic moved core security into Basic in 6.8/7.1; it is
  # off here only because that is the bitnami chart's default.
  #
  # What this closes: ES was running with authentication disabled entirely, so
  # every client that could reach 9200 was an unauthenticated superuser over
  # 2.68M documents. The netpol from #535 cut *who* can reach it; this is the
  # other half.
  #
  # What is still free vs paid, because it constrains the follow-ups: native
  # realm users, RBAC, API keys and TLS are Basic. SSO (OIDC/SAML), LDAP,
  # field/document-level security and audit logging are not -- so ES logins
  # cannot go through authentik the way everything else here does, and cerebro
  # will hold a local ES credential.
  security:
    enabled: true
    # Key `elasticsearch-password`, templated from `password` -- see
    # sea1/secrets.yaml for why there are two names for one value.
    existingSecret: mastodon-elasticsearch
    tls:
      # Transport TLS is not optional once security is on: ES refuses to start
      # in production mode without it, so this is the cost of authentication
      # rather than a separate choice.
      #
      # NOT autoGenerated -- that is a trap under kustomize+helm. See the header
      # of es-certificates.yaml: it mints certs with Helm's genSignedCert, which
      # has no release state here, so every render yields a different CA and
      # ArgoCD's selfHeal would rotate the transport CA of a 6-node cluster
      # every reconcile. Verified by rendering twice and diffing.
      #
      # Providing existingSecrets makes the chart's `tlsSecretsProvided` true,
      # which turns its own cert generation off entirely. cert-manager owns them.
      usePemCerts: true
      master:
        existingSecret: mastodon-elasticsearch-master-crt
      data:
        existingSecret: mastodon-elasticsearch-data-crt
      # REST deliberately stays plain HTTP, which is what keeps this change to
      # one moving part. Turning it on would force every client -- mastodon,
      # cerebro, the hourly cronjob -- onto https with a CA they must trust, and
      # that is a second failure surface landing at the same moment as the first.
      #
      # The tradeoff, stated plainly: the password crosses the pod network in
      # cleartext. Reaching 9200 is already restricted to the mastodon namespace
      # and cerebro by the netpol, so the exposure is a compromised pod inside
      # that boundary -- which is the same actor the password was protecting
      # against. Worth following up with restEncryption once this is stable.
      restEncryption: false

  # Parent-chart values (NOT the bitnami subchart's). `user` becomes ES_USER in
  # the env ConfigMap; `existingSecret` is read only by the media-remove cronjob,
  # which expects the key `password`.
  #
  # This connects as `elastic`, the superuser, because that is the account the
  # chart bootstraps. A dedicated mastodon user scoped to its own indices would
  # be better and is free on Basic, but it needs provisioning against the
  # security API after the cluster is up -- a separate change, once this one has
  # proven stable.
  user: elastic
  existingSecret: mastodon-elasticsearch

  metrics:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/elasticsearch-exporter
      tag: 1.7.0-debian-12-r11
    # Same treatment for the exporter's own 9114. Nothing scrapes it today —
    # there is no ServiceMonitor or VMServiceScrape for it in the namespace — so
    # this allow is pre-emptive rather than load-bearing. If you add a scrape and
    # it comes back empty, this rule is the first thing to check.
    networkPolicy:
      enabled: true
      allowExternal: false
      allowExternalEgress: true
      extraIngress:
        - ports:
            - port: 9114
              protocol: TCP
          from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: victoriametrics

  master:
    replicaCount: 3
    heapSize: 1g
    # Master nodes form the cluster quorum — hard-spread them across nodes so
    # one node loss can't drop the master majority.
    podAntiAffinityPreset: hard
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 2Gi
    # The chart creates NetworkPolicies by default, but with allowExternal=true,
    # which renders `ingress: [{ports: [9200, 9300]}]` — a port filter with no
    # `from:` selector, i.e. any pod in any namespace. That is why ES was
    # reachable from busyboxtest. allowExternal=false is what adds the `from:`.
    #
    # This has to be fixed in the chart values rather than by adding a second,
    # tighter NetworkPolicy: policies are additive (union), so a restrictive
    # policy layered on top of the chart's open one changes nothing.
    #
    # allowExternal=false on its own permits `mastodon-elasticsearch-client:
    # "true"` pods plus the ES pods themselves — that is what keeps master<->data
    # transport on 9300 and the metrics exporter working. Everything else comes
    # from extraIngress. Anchored here and aliased by `data` below; the two must
    # stay identical or transport breaks asymmetrically.
    #
    # NOTE this narrows *reachability* only; authentication (xpack security,
    # enabled above) is the other half. Keep both -- neither alone makes ES
    # safe to expose.
    networkPolicy: &esNetworkPolicy
      enabled: true
      allowExternal: false
      # Egress deliberately left open. Locking it down is a separate change with
      # its own breakage surface (snapshot repos, plugin installs), and the
      # exposure being fixed here is inbound.
      allowExternalEgress: true
      extraIngress:
        # Mastodon's own pods on the REST port. Namespace-wide rather than a
        # label selector because the hourly `mastodon-update-search-index-
        # mappings` Jobs carry only batch/job-name labels — there is no app label
        # to match, and a selector that missed them would break search indexing
        # an hour later, not at deploy time.
        - ports:
            - port: 9200
              protocol: TCP
          from:
            - podSelector: {}
        # cerebro is the ES admin UI. Its image ships an empty host list, so
        # operators type the cluster URL at runtime — without this rule that
        # workflow silently breaks. It sits behind Cloudflare Access at the
        # edge, and since xpack security went on, connecting also requires ES
        # credentials. Drop this rule and use port-forward if you would rather
        # not keep it.
        - ports:
            - port: 9200
              protocol: TCP
          from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: cerebro

  data:
    replicaCount: 3
    heapSize: 2g
    # Hard-spread data nodes so a single node holds at most one shard replica.
    podAntiAffinityPreset: hard
    resources:
      requests:
        memory: 4Gi
      limits:
        memory: 4Gi
    networkPolicy: *esNetworkPolicy

  coordinating:
    replicaCount: 0

  ingest:
    enabled: false
    replicaCount: 0

postgresql:
  enabled: false

externalDatabase:
  enabled: true
  hostname: mastodon-db-rw
  port: "5432"
  database: mastodon
  user: mastodon
  existingSecret: mastodon-db-app
  secretKeys:
    password: "password"
