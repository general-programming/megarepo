---
# Password for the Elasticsearch `elastic` superuser.
#
# secret/app/mastodon-coolmathgames/elasticsearch must hold one key, `password`.
# Generate it the same way as the ClickHouse one -- Vault's own RNG, hex so the
# value needs no quoting thought anywhere it lands:
#
#   vault kv patch secret/app/mastodon-coolmathgames/elasticsearch \
#     password="$(vault write -field=random_bytes sys/tools/random/32 format=hex)"
#
# WRITE THIS BEFORE MERGING -- without it the ES pods fail to start on the
# missing secretKeyRef, and a 6-node cluster restarting into that is a bad time.
#
# TWO KEYS FROM ONE VAULT FIELD. The bitnami elasticsearch subchart reads
# `elasticsearch-password`; the mastodon parent chart reads `password` for the
# media-remove cronjob's ES_PASS. Rather than storing the value twice in Vault
# and letting the copies drift on rotation, the second key is templated from the
# first here.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mastodon-elasticsearch
spec:
  type: kv-v2
  mount: secret
  path: app/mastodon-coolmathgames/elasticsearch
  destination:
    name: mastodon-elasticsearch
    create: true
    transformation:
      templates:
        elasticsearch-password:
          text: '{{- get .Secrets "password" -}}'
  refreshAfter: 1m
