---
# secret/app/baserow is created and populated by terraform/auth/app_baserow.tf.
# Keys: DATABASE_PASSWORD, SECRET_KEY, BASEROW_JWT_SIGNING_KEY,
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_ENDPOINT_URL.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-baserow
spec:
  type: kv-v2
  mount: secret
  path: app/baserow
  destination:
    name: baserow-secrets
    create: true
    transformation:
      excludeRaw: true
  refreshAfter: 1m
---
# The same password, reshaped into the basic-auth secret CNPG bootstraps the
# `baserow` role from, so the role and DATABASE_PASSWORD cannot drift.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-baserow-db
spec:
  type: kv-v2
  mount: secret
  path: app/baserow
  destination:
    name: baserow-db-owner
    create: true
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        username:
          text: "baserow"
        password:
          text: '{{- get .Secrets "DATABASE_PASSWORD" -}}'
  refreshAfter: 1m
