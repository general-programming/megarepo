---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: baserow-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/target: "sea1-traefik-k8s.generalprogramming.org"
spec:
  rules:
    - host: base.owo.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: baserow-baserow-frontend
                port:
                  number: 80
    - host: api.base.owo.me
      http:
        paths:
          # Websockets, MCP and the assistant stream, so they go to asgi.
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: baserow-baserow-backend-asgi
                port:
                  number: 80
          - path: /mcp/
            pathType: Prefix
            backend:
              service:
                name: baserow-baserow-backend-asgi
                port:
                  number: 80
          - path: /assistant/
            pathType: Prefix
            backend:
              service:
                name: baserow-baserow-backend-asgi
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: baserow-baserow-backend-wsgi
                port:
                  number: 80
