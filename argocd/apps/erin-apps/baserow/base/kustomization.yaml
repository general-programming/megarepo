---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: baserow
resources:
  - database.yaml
helmCharts:
  - name: baserow
    releaseName: baserow
    namespace: baserow
    repo: https://baserow.github.io/baserow-chart
    version: 1.0.56
    valuesFile: values.yaml
patches:
  # The chart stamps a random `rollme` annotation on every render, which reads
  # as permanent drift to ArgoCD and restarts every pod on each self-heal.
  - target:
      kind: Deployment
    patch: |-
      - op: remove
        path: /spec/template/metadata/annotations/rollme
  # With `rollme` gone, nothing rolls the pods when the config changes -- and
  # every component reads its whole environment from those configmaps, so a
  # changed hostname would sit unapplied until something else restarted them.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: all
        annotations:
          reloader.stakater.com/auto: "true"
  # These are plain config, not hooks. Left annotated, ArgoCD would delete and
  # recreate them on every sync (BeforeHookCreation) under the pods using them.
  - target:
      kind: ConfigMap
      name: (backend|shared)-config
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
  - target:
      kind: ServiceAccount
      name: ^baserow$
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
  - target:
      kind: Secret
      name: backend-secret
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
      # With auth.existingSecret set, the chart renders this key from a cluster
      # `lookup` that falls back to a random value per render. Drop it; the
      # backends get REDIS_PASSWORD from baserow-secrets (Vault).
      - op: remove
        path: /data/REDIS_PASSWORD
