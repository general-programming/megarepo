---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: scraperdb
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-standard-trixie
    major: 18
  instances: 2
  primaryUpdateStrategy: unsupervised
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: generalprogramming.org/no-database
                operator: DoesNotExist
  storage:
    # Ceph, NOT local-path. Size stays 128Gi despite measured usage of only
    # 2.3G: CNPG's webhook rejects any decrease in spec.storage.size, so 64Gi
    # would fail to sync with "can't shrink existing storage". RBD is thin-
    # provisioned, so the oversized declaration costs nothing real.
    storageClass: ceph-rbd-xfs
    size: 128Gi
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: scraper
      owner: scraper
---
apiVersion: v1
# ClusterIP, not NodePort -- reach it via the tailscale proxy
# (svc-scraperdb-postgres) so tailnet ACLs apply. As a NodePort it also
# answered on every node IP, reachable from anywhere on the SEA1 LAN.
kind: Service
metadata:
  name: postgres-rw
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "svc-scraperdb-postgres"
spec:
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: scraperdb
    cnpg.io/instanceRole: primary
  sessionAffinity: None
  type: ClusterIP
