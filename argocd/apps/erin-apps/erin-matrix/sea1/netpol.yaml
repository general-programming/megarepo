---
# erin-matrix holds TWO CNPG clusters, and they have different clients. Split
# per cluster rather than one policy over cnpg.io/podRole=instance, so synapse
# cannot reach the auth database and mas cannot reach the chat database.
#
# WHO ACTUALLY USES WHAT, verified 2026-08-08 by resolving every client_addr in
# pg_stat_activity back to a pod:
#   - matrix-db      <- synapse (10.244.1.43), streaming_replica
#   - matrix-mas-db  <- mas     (10.244.1.8, user matrix_mas), streaming_replica
#   - cluster-wide scan: no pod spec outside this namespace references either
#   - no tailscale.com/expose on any Service here
#
# The instance-to-instance rules are scoped by cnpg.io/cluster as well, so a
# replica of one cluster cannot open 5432 on the other. They are unported on
# purpose: the instance-manager status port 8000 matters alongside 5432, and
# kubelet probes are local-node (Cilium allow-localhost=auto).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrix-db-allowed-clients
  namespace: erin-matrix
  labels:
    sea1.policy/tier: datastore
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: matrix-db
      cnpg.io/podRole: instance
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: matrix-db
              cnpg.io/podRole: instance
    - from:
        - podSelector:
            matchLabels:
              app: synapse
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: victoriametrics
      ports:
        - protocol: TCP
          port: 9187
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrix-mas-db-allowed-clients
  namespace: erin-matrix
  labels:
    sea1.policy/tier: datastore
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: matrix-mas-db
      cnpg.io/podRole: instance
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: matrix-mas-db
              cnpg.io/podRole: instance
    - from:
        - podSelector:
            matchLabels:
              app: mas
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: victoriametrics
      ports:
        - protocol: TCP
          port: 9187
