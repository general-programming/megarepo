apiVersion: apps/v1
kind: Deployment
metadata:
  name: librenms-redis
  annotations:
    # Not `auto`: this pod takes one key out of librenms-secrets by secretKeyRef,
    # and naming the secret is the form Reloader is known to honour here (#541).
    secret.reloader.stakater.com/reload: "librenms-secrets"
spec:
  selector:
    matchLabels:
      app: librenms-redis
  replicas: 1
  template:
    metadata:
      labels:
        app: librenms-redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
        # No command: the redis entrypoint prepends `redis-server` when the first
        # argument starts with a dash.
        args:
          - --requirepass
          - $(REDIS_PASSWORD)
        env:
          # secretKeyRef, not envFrom: envFrom would hand the redis pod LibreNMS's
          # SMTP credentials as well.
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: librenms-secrets
                key: REDIS_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: librenms-redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: librenms-redis
  selector:
    app: librenms-redis
  type: ClusterIP
