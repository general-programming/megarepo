---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-librenms
spec:
  replicas: 3
  # Galera needs quorum; keep the 3 replicas on distinct nodes so one node
  # loss never takes two members. antiAffinityEnabled expands to required
  # pod anti-affinity keyed on kubernetes.io/hostname.
  affinity:
    antiAffinityEnabled: true
  galera:
    enabled: true
  username: librenms
  passwordSecretKeyRef:
    name: db-password
    key: password
    generate: true
  rootPasswordSecretKeyRef:
    name: root-password
    key: password
    generate: true
  database: librenms
  storage:
    # Ceph, NOT local-path. Measured usage is 396M against 16Gi, so the size is
    # already generous; only the class needed to change.
    #
    # A StatefulSet's volumeClaimTemplates are IMMUTABLE, so this does not
    # migrate anything on its own -- mariadb-operator's StatefulSet must be
    # deleted with --cascade=orphan and the PVCs replaced one at a time, letting
    # Galera re-sync each member from its peers.
    size: 16Gi
    storageClassName: ceph-rbd-xfs
  updateStrategy:
    autoUpdateDataPlane: true
