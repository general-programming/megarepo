---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-librenms
spec:
  replicas: 3
  # Galera needs quorum; keep the 3 replicas on distinct nodes so one node
  # loss never takes two members. antiAffinityEnabled expands to required
  # pod anti-affinity keyed on kubernetes.io/hostname.
  affinity:
    antiAffinityEnabled: true
  galera:
    enabled: true
  username: librenms
  passwordSecretKeyRef:
    name: db-password
    key: password
    generate: true
  rootPasswordSecretKeyRef:
    name: root-password
    key: password
    generate: true
  database: librenms
  storage:
    # STAYS local-path, unlike every other sea1 database. Not an oversight:
    # mariadb-operator's validating webhook (vmariadb-v1alpha1.kb.io) treats
    # storageClassName as immutable on an existing MariaDB CR --
    #
    #   spec.storage.storageClassName: Invalid value: "ceph-rbd-xfs":
    #   'spec.storage.storageClassName' field is immutable
    #
    # so the change is rejected at the CR, upstream of the StatefulSet. Setting
    # it here does not migrate anything; it only wedges the ArgoCD app in a
    # failing sync retry loop. Deleting the STS with --cascade=orphan does not
    # help either: the operator just recreates it from the unchanged CR.
    #
    # Moving this needs a CR-level path (operator-sanctioned migration flow, or
    # recreate the MariaDB CR -- which tears down Galera and must not be done
    # without a verified dump first). Data is 396M, so a dump/restore into a
    # fresh ceph-backed CR is the realistic route when someone picks this up.
    size: 16Gi
    storageClassName: local-path
  updateStrategy:
    autoUpdateDataPlane: true
