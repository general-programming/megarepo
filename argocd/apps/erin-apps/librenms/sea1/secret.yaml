---
# secret/app/librenms-sea1 holds LibreNMS's env-shaped secrets (SMTP_SERVER,
# SMTP_USERNAME, SMTP_PASSWORD) and, as of the redis-auth change,
# `REDIS_PASSWORD`.
#
# WRITE `REDIS_PASSWORD` BEFORE MERGING. It is consumed twice:
#   1. librenms-redis sets it as --requirepass (base/redis.yaml)
#   2. librenms (init + main) and librenms-dispatcher authenticate with it,
#      picked up automatically through `envFrom: librenms-secrets`
# Without the key the VaultStaticSecret syncs a secret that lacks it and the
# librenms-redis pod fails to start on the missing secretKeyRef
# (CreateContainerConfigError).
#
#   vault kv patch secret/app/librenms-sea1 \
#     REDIS_PASSWORD="$(vault write -field=random_bytes \
#                         sys/tools/random/32 format=hex)"
#
# `kv patch`, NOT `kv put` -- put replaces the whole secret and would delete the
# SMTP credentials, silently killing alert delivery.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-librenms
spec:
  type: kv-v2
  mount: secret
  path: app/librenms-sea1
  destination:
    name: librenms-secrets
    create: true
  refreshAfter: 1m
