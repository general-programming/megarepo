---
# Flow collector VIP. externalTrafficPolicy: Local keeps the exporter's real
# source IP intact -- akvorado keys every flow by it, so one SNAT hop collapses
# the fabric into a single bogus exporter. It also keeps flow UDP off flannel's
# VXLAN (cf. the tx-checksum workaround in infrastructure/talos/sea1/).
#
# The VIP is pinned because device configs hardcode it, via the MetalLB
# annotation rather than the deprecated spec.loadBalancerIP. As of the MetalLB
# v0.16.1 upgrade either prefix works -- metallb.io/* is the preferred one and
# metallb.universe.tf/* is kept for backwards compatibility (it now logs a
# deprecation event, and a future release may drop it).
apiVersion: v1
kind: Service
metadata:
  name: akvorado-flows
  labels:
    # Opts this Service into the sea1-lan pool. Cilium's serviceSelector is
    # how MetalLB's autoAssign: false is expressed -- without the label no
    # VIP is handed out.
    generalprogramming.org/lb-pool: sea1-lan
  annotations:
    # Pinned: device configs hardcode this address.
    lbipam.cilium.io/ips: "10.3.3.1"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: akvorado-inlet
  ports:
    - name: netflow
      port: 2055
      targetPort: 2055
      protocol: UDP
    - name: ipfix
      port: 4739
      targetPort: 4739
      protocol: UDP
    - name: sflow
      port: 6343
      targetPort: 6343
      protocol: UDP
