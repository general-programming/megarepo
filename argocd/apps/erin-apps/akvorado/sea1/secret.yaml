---
# secret/app/akvorado must hold two keys.
#
# `snmp-credentials.yaml` -- the YAML fragment !include'd into
# outlet.metadata.providers[0].credentials:
#
#   ::/0:
#     communities: <global_meta.snmp_public from projects/barf/network.yml>
#
# A fragment rather than a bare string because credentials are keyed by exporter
# subnet, and env-var overrides cannot express a map key like `::/0`.
#
# `clickhouse-password` -- the password for the ClickHouse `default` user. A bare
# string, NOT a YAML fragment: it is consumed twice, and both consumers want the
# raw value.
#   1. the operator writes it into users.xml
#      (ClickHouseCluster.spec.settings.defaultUserPassword, base/clickhouse.yaml)
#   2. akvorado authenticates with it via
#      AKVORADO_CFG_ORCHESTRATOR_CLICKHOUSEDB_PASSWORD (base/orchestrator.yaml)
#
# WRITE THIS KEY BEFORE MERGING. Without it the VaultStaticSecret syncs a secret
# with no `clickhouse-password`, the orchestrator pod fails to start on the
# missing secretKeyRef (CreateContainerConfigError), and the operator cannot
# render the user config.
#
#   vault kv patch secret/app/akvorado \
#     clickhouse-password="$(vault write -field=random_bytes \
#                             sys/tools/random/32 format=hex)"
#
# `kv patch`, NOT `kv put` -- put replaces the whole secret and would delete
# snmp-credentials.yaml, which silently breaks SNMP metadata resolution on the
# outlet (flows with unresolved interfaces are dropped, see base/config.yaml).
#
# format=hex rather than base64 so the value cannot contain +/= and needs no
# quoting thought in the users.xml the operator renders or in the env var
# akvorado reads.
#
# Vault generates the value, so nobody invents or handles a password -- but it
# is still a write we perform. There is no k8s->Vault primitive available here:
# every Vault Secrets Operator CRD (VaultStaticSecret, VaultDynamicSecret,
# VaultPKISecret, HCPVaultSecretsApp, SecretTransformation, CSISecrets) reads
# Vault->k8s only. The resource that pushes a k8s Secret into Vault is External
# Secrets Operator's PushSecret, and ESO is not installed -- running two secrets
# operators for one key is not a good trade. The ClickHouse operator does not
# help either: it self-generates management-password/interserver-password/
# keeper-identity in the akvorado-clickhouse secret it owns, but
# defaultUserPassword is a reference-only field.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-akvorado
spec:
  type: kv-v2
  mount: secret
  path: app/akvorado
  destination:
    name: akvorado-secrets
    create: true
  refreshAfter: 1m
