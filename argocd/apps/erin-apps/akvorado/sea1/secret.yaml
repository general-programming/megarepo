---
# secret/app/akvorado needs snmp-credentials.yaml, clickhouse-password and
# valkey-password written BEFORE merging (pods CreateContainerConfigError
# otherwise). Key semantics and the vault commands: docs/akvorado.md.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-akvorado
spec:
  type: kv-v2
  mount: secret
  path: app/akvorado
  destination:
    name: akvorado-secrets
    create: true
  refreshAfter: 1m
