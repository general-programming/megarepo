---
# secret/app/akvorado must hold one key, `snmp-credentials.yaml`, whose value is
# the YAML fragment !include'd into outlet.metadata.providers[0].credentials:
#
#   ::/0:
#     communities: <global_meta.snmp_public from projects/barf/network.yml>
#
# A fragment rather than a bare string because credentials are keyed by exporter
# subnet, and env-var overrides cannot express a map key like `::/0`.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-akvorado
spec:
  type: kv-v2
  mount: secret
  path: app/akvorado
  destination:
    name: akvorado-secrets
    create: true
  refreshAfter: 1m
