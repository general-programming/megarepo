---
# Console query cache. Ephemeral -- a cold cache just means slower first loads.
apiVersion: v1
kind: Service
metadata:
  name: akvorado-valkey
spec:
  selector:
    app: akvorado-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akvorado-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: akvorado-valkey
  template:
    metadata:
      labels:
        app: akvorado-valkey
      annotations:
        # On the pod template, matching the orchestrator and console -- that is
        # where Reloader reads it in this namespace (#541).
        secret.reloader.stakater.com/reload: "akvorado-secrets"
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.0
          args:
            - --save
            - ""
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
            - --requirepass
            - $(REDISCLI_AUTH)
          env:
            # Named REDISCLI_AUTH rather than something obvious because valkey-cli
            # reads that variable: one env var both sets the server password and
            # lets the readiness probe below authenticate. Without it the probe
            # gets NOAUTH and the Deployment never becomes ready.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: akvorado-secrets
                  key: valkey-password
          ports:
            - containerPort: 6379
              name: valkey
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 384Mi
