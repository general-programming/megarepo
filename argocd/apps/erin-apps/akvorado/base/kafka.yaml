---
# Single-broker KRaft. A 2h buffer between inlet and outlet, not a system of
# record -- hence no Strimzi.
apiVersion: v1
kind: Service
metadata:
  name: akvorado-kafka
spec:
  clusterIP: None
  # KRaft needs to resolve its own controller-quorum hostname before the
  # readiness probe can pass; without this the pod never gets DNS and never
  # becomes ready.
  publishNotReadyAddresses: true
  selector:
    app: akvorado-kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: akvorado-kafka
spec:
  serviceName: akvorado-kafka
  replicas: 1
  selector:
    matchLabels:
      app: akvorado-kafka
  template:
    metadata:
      labels:
        app: akvorado-kafka
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: controller,broker
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@akvorado-kafka-0.akvorado-kafka:9093
            - name: KAFKA_LISTENERS
              value: CLIENT://:9092,CONTROLLER://:9093
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CLIENT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_ADVERTISED_LISTENERS
              value: CLIENT://akvorado-kafka-0.akvorado-kafka:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: CLIENT
            # Single broker: internal topics must accept RF=1.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
              value: "1"
            - name: KAFKA_DELETE_TOPIC_ENABLE
              value: "true"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          ports:
            - containerPort: 9092
              name: client
            - containerPort: 9093
              name: controller
          readinessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-topics.sh
                - --list
                - --bootstrap-server
                - localhost:9092
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd-xfs
        resources:
          requests:
            storage: 32Gi
