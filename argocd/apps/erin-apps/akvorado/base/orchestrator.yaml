---
apiVersion: v1
kind: Service
metadata:
  name: akvorado-orchestrator
spec:
  selector:
    app: akvorado-orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akvorado-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: akvorado-orchestrator
  template:
    metadata:
      labels:
        app: akvorado-orchestrator
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: orchestrator
          image: quay.io/akvorado/akvorado:2.4.1
          args:
            - orchestrator
            - /etc/akvorado/akvorado.yaml
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/akvorado
              readOnly: true
      volumes:
        # Projected so akvorado.yaml and the Vault-backed snmp-credentials.yaml
        # share a directory: `!include` resolves relative to the config file.
        - name: config
          projected:
            sources:
              - configMap:
                  name: akvorado-config
              - secret:
                  name: akvorado-secrets
                  items:
                    - key: snmp-credentials.yaml
                      path: snmp-credentials.yaml
