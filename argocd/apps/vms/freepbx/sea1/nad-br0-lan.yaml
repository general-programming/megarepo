# NetworkAttachmentDefinitions are namespaced, so each VM namespace carries its
# own rather than reaching cross-namespace into virt/. Six lines is cheaper
# than the coupling.
#
# No IPAM: the guest addresses itself. This one has to -- it holds a public
# 199.255.18.165/32 next to 10.3.2.19/23 and defaults over IPv6.
#
# mtu 9000 raises the ceiling to match br0; the bridge plugin builds the pod
# interface at 1500 otherwise and KubeVirt sizes the tap from it. The guest
# keeps whatever MTU it configures, so this changes nothing for a 1500 guest --
# it just stops the tap from silently capping one that wants jumbo. Takes
# effect on VMI restart.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: br0-lan
  namespace: freepbx
spec:
  config: '{"cniVersion":"0.3.1","name":"br0-lan","type":"bridge","bridge":"br0","mtu":9000,"ipam":{}}'
