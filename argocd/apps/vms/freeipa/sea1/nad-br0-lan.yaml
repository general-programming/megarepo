# NetworkAttachmentDefinitions are namespaced, so each VM namespace carries its
# own rather than reaching cross-namespace into virt/. Six lines is cheaper
# than the coupling.
#
# No IPAM: the guest addresses itself.
#
# mtu 9000 raises the ceiling to match br0; the bridge plugin builds the pod
# interface at 1500 otherwise and KubeVirt sizes the tap from it. The guest
# keeps whatever MTU it configures, so this changes nothing for a 1500 guest --
# it just stops the tap from silently capping one that wants jumbo. Applies
# whenever a launcher pod is created, including a migration target.

# Keep the target quiet until KubeVirt configures it; early MAC announcements
# redirect LAN traffic before handover (kubevirt/kubevirt#17195).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: br0-lan
  namespace: freeipa
spec:
  config: '{"cniVersion":"0.3.1","name":"br0-lan","type":"bridge","bridge":"br0","mtu":9000,"disableContainerInterface":true,"ipam":{}}'
