apiVersion: v1
kind: Namespace
metadata:
  name: bsky-pds
  labels:
    # The pds Deployment sets no securityContext at all, so it cannot satisfy
    # restricted (runAsNonRoot, seccompProfile, drop ALL,
    # allowPrivilegeEscalation=false all unset). Namespace is empty on both
    # clusters, so this level comes from reading the manifest, not a live pod.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
