---
apiVersion: v1
kind: Namespace
metadata:
  name: workpod
  labels:
    kubernetes.io/metadata.name: workpod
    # Exempts the debug shell from the clusterwide node-API deny CCNP so
    # kubelet/talosctl debugging keeps working. Drop to make workpod a plain pod.
    generalprogramming.org/allow-node-api: "true"
    # baseline: the shell runs as root by design; restricted would refuse it.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
