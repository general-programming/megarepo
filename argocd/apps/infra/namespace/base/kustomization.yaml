apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - argocd.yaml
  - workpod.yaml
  - ceph.yaml
  - loki.yaml
  - promtail.yaml
  - traefik.yaml
  - consul.yaml
  - vault.yaml
  - external-dns.yaml
  - reloader.yaml
  - tailscale.yaml
  - tempo.yaml
  - kube-state-metrics.yaml
  - monitoring.yaml
  - local-path-storage.yaml
  - cnpg-system.yaml
  - mariadb-operator.yaml
  - clickhouse-operator.yaml
  - shared-db.yaml
  - nix-cache-builder.yaml
  - cilium-secrets.yaml

  # scylla-operator and victoriametrics are absent on purpose -- their own apps
  # declare those Namespaces, and a second declaration here cannot win. Their
  # PSA labels are patched in those apps instead. See the README.

  # pre-existing kubernetes namespaces, adopted for their PSA labels only.
  # Prune=false so removing them from git never deletes the namespace.
  - kube-builtins.yaml

  # apps
  - akvorado.yaml
  - attic.yaml
  - authentik.yaml
  - baserow.yaml
  - grafana.yaml
  - librenms.yaml
  - docspell.yaml
  - cerebro.yaml
  - coder.yaml
  - coder-workspaces.yaml
  - deluge.yaml
  - netbox.yaml

  # users
  - erin/
