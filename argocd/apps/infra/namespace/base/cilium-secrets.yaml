apiVersion: v1
kind: Namespace
metadata:
  name: cilium-secrets
  annotations:
    # Retain TLS secrets when transferring ownership from the Cilium chart.
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    kubernetes.io/metadata.name: cilium-secrets
    # Secret store for Cilium TLS material. Holds no pods on either cluster and
    # is not meant to -- restricted so an accidental workload here is blocked.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
