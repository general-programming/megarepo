alloy:
  envFrom:
    - configMapRef:
        name: alloy-env-local
  configMap:
    content: |-
      logging {
        level = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
          action = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label = "app"
          action = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          target_label = "component"
          action = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container"
          action = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
          action = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label = "node_name"
          action = "replace"
        }

        // Terminated pods linger (CronJob history, failed and evicted pods) and
        // their log stream replays the whole file then EOFs. The tailer treats
        // that as a failure and retries, replaying the same lines forever --
        // every one of them older than the 1h cutoff below, so every pass is
        // discarded. That loop, not a real backlog, is what produces `too old`
        // drops in steady state.
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex = "Succeeded|Failed"
          action = "drop"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.process.receiver]

        // Shard targets across instances; otherwise every pod tails the whole
        // cluster and ships a duplicate copy.
        clustering {
          enabled = true
        }
      }

      loki.process "process" {
        forward_to = [loki.write.loki.receiver]

        // Caps replay of old container logs when an instance starts with no
        // position state. Must stay within Loki's per-stream out-of-order
        // window (max_chunk_age/2, so 1h at the default 2h) or the replayed
        // entries come back as 400s. This does NOT limit WAL backfill: entries
        // are filtered here on read, and anything already queued was fresh
        // when it went in.
        stage.drop {
          older_than          = "1h"
          drop_counter_reason = "too old"
        }

        stage.drop {
          source              = "namespace"
          expression          = "(argocd)"
          drop_counter_reason = "excluded_namespaces"
        }

        stage.structured_metadata {
          values = {
            pod = "",
            filename = "",
            container = "",
            container_runtime = "",
            instance = "",
          }
        }

        stage.static_labels {
          values = {
            cluster = sys.env("REGION"),
          }
        }

        stage.label_drop {
          values = [ "job" ]
        }
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.fmt2.generalprogramming.org/loki/api/v1/push"

          // sea1 reaches this cross-site; ride out transient link loss.
          max_backoff_period  = "10m"
          max_backoff_retries = 20
        }

        // Durable queue; without it unsent data dies with the pod.
        wal {
          enabled         = true
          max_segment_age = "96h"
          drain_timeout   = "60s"
        }
      }

  # Required for the clustering block above to take effect.
  clustering:
    enabled: true

  # WAL location. Chart default (/tmp/alloy) is ephemeral and wiped on restart.
  storagePath: /var/lib/alloy

  mounts:
    varlog: true
    dockercontainers: true
    extra:
      - name: alloy-wal
        mountPath: /var/lib/alloy
        # Private WAL dir per instance on the shared RWX volume.
        subPathExpr: $(K8S_NODE_NAME)

  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 1
      memory: 1Gi

controller:
  # Picked up by the "all-scrape" VMPodScrape; without these there are no
  # alloy_* metrics to alert on.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "12345"

  volumes:
    extra:
      - name: alloy-wal
        persistentVolumeClaim:
          claimName: alloy-wal
