alloy:
  envFrom:
    - configMapRef:
        name: alloy-env-local
  configMap:
    content: |-
      logging {
        level = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
          action = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label = "app"
          action = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          target_label = "component"
          action = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container"
          action = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
          action = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label = "node_name"
          action = "replace"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.process.receiver]

        // discovery.kubernetes hands every pod in the cluster to every Alloy
        // instance, so without this each of the N DaemonSet pods tailed all
        // ~349 sea1 pods and shipped a full duplicate copy of the cluster's
        // logs. Loki deduplicated them on ingest, so it was invisible in
        // stored volume while still costing Nx the push traffic (the source of
        // the 429s) and Nx the on-disk queue. Clustering shards targets across
        // instances instead.
        clustering {
          enabled = true
        }
      }

      loki.process "process" {
        forward_to = [loki.write.loki.receiver]

        // Guards against replaying a pod's entire log history after an Alloy
        // restart. Must stay below Loki's reject_old_samples_max_age (168h),
        // otherwise we ship data the server will reject anyway. Was "1h", which
        // silently discarded everything buffered during the sea1 -> fmt2 outage
        // on 2026-07-14..07-17 instead of backfilling it.
        stage.drop {
          older_than          = "96h"
          drop_counter_reason = "too old"
        }

        stage.drop {
          source              = "namespace"
          expression          = "(argocd)"
          drop_counter_reason = "excluded_namespaces"
        }

        stage.structured_metadata {
          values = {
            pod = "",
            filename = "",
            container = "",
            container_runtime = "",
            instance = "",
          }
        }

        stage.static_labels {
          values = {
            cluster = sys.env("REGION"),
          }
        }

        stage.label_drop {
          values = [ "job" ]
        }
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.fmt2.generalprogramming.org/loki/api/v1/push"

          // sea1 reaches this endpoint cross-site, so transient link loss is
          // expected. Retry for longer before giving up on a batch.
          max_backoff_period  = "10m"
          max_backoff_retries = 20
        }

        // Durable on-disk queue. Without this, anything not yet accepted by
        // Loki lives only in memory and dies with the pod. max_segment_age
        // bounds how far back we can replay, and is matched to the 96h
        // stage.drop cutoff above.
        wal {
          enabled         = true
          max_segment_age = "96h"
          drain_timeout   = "60s"
        }
      }

  # Distributes log collection across instances rather than every pod tailing
  # every target. Required for the clustering block in loki.source.kubernetes
  # above to take effect.
  clustering:
    enabled: true

  # The WAL lives under storagePath. The chart default (/tmp/alloy) is the
  # container's ephemeral layer, which is wiped on every container restart --
  # useless as a crash buffer. Backed by CephFS so the queue survives pod
  # restarts and rescheduling anywhere in the cluster.
  storagePath: /var/lib/alloy

  mounts:
    varlog: true
    dockercontainers: true
    extra:
      - name: alloy-wal
        mountPath: /var/lib/alloy
        # One RWX volume shared by the DaemonSet, but each instance gets its
        # own directory -- a shared WAL directory would corrupt.
        subPathExpr: $(K8S_NODE_NAME)

  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 1
      memory: 1Gi

controller:
  # Scraped by the annotation-driven VMPodScrape ("all-scrape"). Without these
  # the Alloy metrics referenced by the logging-pipeline alerts do not exist.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "12345"

  volumes:
    extra:
      - name: alloy-wal
        persistentVolumeClaim:
          claimName: alloy-wal
