---
# Backing store for Alloy's loki.write WAL.
#
# RWX because the DaemonSet shares one volume, split by subPathExpr; ceph-rbd
# can't do RWX. Sized for a 96h buffer at sea1's ~10 GB/day peak.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alloy-wal
  namespace: loki
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: wal
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: cephfs
  resources:
    requests:
      storage: 48Gi
