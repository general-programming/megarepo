experimental-features = nix-command flakes
accept-flake-config = true

# Mirrors nix/machines/base.nix + nix/modules/{nix-cache,nvidia}.nix, so the
# builder pulls from exactly the caches the fleet pulls from.
substituters = https://cache.nixos.org https://attic.owo.me/general-programming https://nix-community.cachix.org https://cache.nixos-cuda.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= general-programming:wrpHyA9Gfx0BSA3vlxeESq+VSP+wvr5zSAgC3rXLN+8= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
connect-timeout = 5
fallback = true

# Nix reads the host's CPU count, not the cgroup's. Pin it to the pod's CPU
# limit (6 x 8 = 48) so the build cannot starve etcd on this control-plane node.
max-jobs = 6
cores = 8

# The pod is privileged precisely so this can stay on.
sandbox = true
