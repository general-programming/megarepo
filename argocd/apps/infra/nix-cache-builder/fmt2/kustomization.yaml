# Intentionally empty: the builder is sea1-only. fmt2's nodes are 12 cores /
# 31 GiB, which is not enough to build the fleet's closures.
#
# The ApplicationSet is a matrix of clusters x app directories, so every app
# directory gets an Application on every cluster. Without this overlay the fmt2
# Application resolves to a path that does not exist and sits permanently in
# Unknown/ComparisonError. allowEmpty is set on the ApplicationSet, so an empty
# overlay syncs cleanly with zero resources.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
