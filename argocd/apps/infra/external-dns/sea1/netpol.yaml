---
# Port of the fmt2 external-dns policy. Egress only, same reasoning: inbound is
# probes and scraping, which a flow sample cannot enumerate safely.
#
# Observed egress, stage-1 sample: coredns:53, the apiserver, world:443 for the
# Cloudflare API. The egressDeny is what makes world:443 mean the internet and
# not the house.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-dns-egress
  namespace: external-dns
  labels:
    sea1.policy/tier: infra
spec:
  endpointSelector:
    matchLabels:
      app: external-dns
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  egressDeny:
    - toCIDRSet:
        - cidrGroupRef: sea1-rfc1918
        - cidrGroupRef: sea1-loadbalancers
        - cidrGroupRef: link-local-metadata
        - cidrGroupRef: bogons
