apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: vmagent
  namespace: victoriametrics
spec:
  selectAllByDefault: true
  replicaCount: 1
  inlineRelabelConfig:
    - target_label: "dc"
      replacement: "sea1"
    - target_label: "cluster"
      replacement: "sea1-k8s"
  extraArgs:
    enableTCP6: "true"
  serviceSpec:
    spec:
      type: ClusterIP
    metadata:
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: "svc-vmagent-sea1"
  # The operator's 1GiB default per URL lasts ~2h of a sea1->fmt2 outage at
  # ~150KB/s; 8GiB buys most of a day. The queue is an emptyDir on 1.7TB nodes.
  remoteWriteSettings:
    maxDiskUsagePerURL: "8GiB"
  remoteWrite:
    - url: "http://vminsert-sea1-victoriametrics.victoriametrics.svc.cluster.local:8480/insert/0/prometheus/api/v1/write"
    - url: "http://vminsert.fmt2.generalprogramming.org:8480/insert/0/prometheus/api/v1/write"
