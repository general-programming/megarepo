# Consul SD token for vmagent (ACL phase 3,
# infrastructure/consul/acl/README.md).
#
# sea1 consul runs ACLs in permissive mode, so this token is not load-bearing
# yet -- that is the point. The permissive window is the only chance to confirm
# vmagent presents its own token instead of coasting on default_policy = allow.
# When phase 4 flips the default to deny, an unauthenticated consul SD returns
# an empty target list with no error and every node_exporter series silently
# stops.
#
# Policy is `metrics-discovery`: agent/node/service read, no KV and no writes.
# Prometheus-style consul SD calls /v1/agent/self to learn the datacenter, so
# agent:read is required on top of the catalog reads.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-consul-sd
  namespace: victoriametrics
spec:
  type: kv-v2
  mount: secret
  path: app/consul-sea1/metrics-discovery
  destination:
    name: consul-sd-token
    create: true
  refreshAfter: 60s
