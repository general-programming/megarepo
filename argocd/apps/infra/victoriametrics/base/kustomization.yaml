apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: victoriametrics
resources:
  - github.com/VictoriaMetrics/operator/config/base-with-webhook?ref=v0.74.1
  # Only the annotation-driven catch-alls live here; workload-specific scrapes
  # sit in their workload's app folder (vmagent has selectAllByDefault, so the
  # operator picks up VM* scrape objects from any namespace).
  - agent_scrape_pod.yaml
  - agent_scrape_service.yaml
  - alert_rules/
images:
- name: manager
  newName: victoriametrics/operator
  newTag: v0.74.1
patches:
  # vmagent scrapes kubelet :10250 (monitoring/base/scrape_kubelet.yaml); this label exempts
  # the namespace from the deny-egress-node-api CCNP in apps/infra/cilium/base.
  # Upstream names the Namespace "vm"; the namespace transformer renames it later.
  - target:
      version: v1
      kind: Namespace
      name: vm
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: vm
        labels:
          generalprogramming.org/allow-node-api: "true"
  # Patch the Certificate to use correct DNS names for victoriametrics namespace
  - target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: vm-serving-cert
    patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - vm-webhook-service.victoriametrics.svc
          - vm-webhook-service.victoriametrics.svc.cluster.local
  # Patch vm-metrics-certs with same DNS names
  - target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: vm-metrics-certs
    patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - vm-webhook-service.victoriametrics.svc
          - vm-webhook-service.victoriametrics.svc.cluster.local
  # Patch the ValidatingWebhookConfiguration so cert-manager's CA injector
  # populates the caBundle fields from the vm-serving-cert Certificate.
  # Uses an explicit target+JSON patch instead of strategic merge patch to
  # avoid namespace-matching issues with cluster-scoped resources.
  - target:
      group: admissionregistration.k8s.io
      version: v1
      kind: ValidatingWebhookConfiguration
      name: vm-validating-webhook-configuration
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/inject-ca-from: victoriametrics/vm-serving-cert
