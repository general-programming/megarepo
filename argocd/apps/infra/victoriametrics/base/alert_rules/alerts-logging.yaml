---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: logging-alerts
  namespace: victoriametrics
spec:
  groups:
    # Alloy -> Loki pipeline. sea1 ships cross-site to fmt2, so this path
    # breaks silently; it went unnoticed for 4 days in July 2026.
    - name: alloy
      interval: 30s
      rules:
        - alert: AlloyDown
          expr: up{namespace="loki", pod=~"alloy-.*"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Alloy is down on {{ $labels.pod }}"
            description: "Unscrapeable for 10m; logs from this node are not reaching Loki."

        - alert: AlloyAbsent
          expr: absent(alloy_build_info)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "No Alloy instances are reporting metrics in this cluster"
            description: "All instances stopped reporting for 15m; the cluster is shipping no logs."

        # Alloy can be up and scrapeable while delivering nothing.
        - alert: AlloyNotShippingLogs
          expr: sum by (pod) (rate(loki_write_sent_entries_total[15m])) == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Alloy on {{ $labels.pod }} has shipped no log entries for 30m"
            description: "Zero entries delivered for 30m. Sustained zero means the write path is broken, not idle."

        # A restart legitimately discards a burst of old container logs, so only
        # alert when drops persist well past that.
        - alert: AlloyDroppingTooOldLines
          expr: increase(loki_process_dropped_lines_total{reason="too old"}[30m]) > 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "Alloy on {{ $labels.pod }} is discarding logs as too old"
            description: "Dropped {{ $value | humanize }} lines past the older_than cutoff; the backlog has outgrown the buffer window."

        - alert: AlloyDroppingEntries
          expr: sum by (pod, reason) (increase(loki_write_dropped_entries_total[15m])) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Alloy on {{ $labels.pod }} is dropping entries ({{ $labels.reason }})"
            description: "Dropped {{ $value | humanize }} entries in 15m, reason \"{{ $labels.reason }}\". Gone for good."

        # A ratio, not `> 0`. The sea1 -> fmt2 link drops a steady ~1% of
        # pushes, which Alloy just retries, so any absolute threshold fires
        # forever. Aggregating away status_code is what makes the denominator
        # the pod's whole push volume.
        - alert: AlloyWriteErrors
          expr: |
            100 * (
              sum by (pod) (rate(loki_write_request_duration_seconds_count{status_code!~"2.."}[10m]))
              /
              sum by (pod) (rate(loki_write_request_duration_seconds_count[10m]))
            ) > 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Alloy on {{ $labels.pod }} is failing to push to Loki"
            description: "{{ $value | humanize }}% of pushes are non-2xx over 10m. Status -1 means the connection failed outright, i.e. the cross-site link dropped."

        # Sustained retries mean the WAL is draining slower than it fills.
        - alert: AlloyBacklogGrowing
          expr: sum by (pod) (rate(loki_write_batch_retries_total[10m])) > 0.1
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: "Alloy on {{ $labels.pod }} is retrying pushes persistently"
            description: "Retrying batches at {{ $value | humanize }}/s for 20m; the queue will start dropping once segments age out."

        - alert: AlloyRateLimitedByLoki
          expr: rate(loki_write_request_duration_seconds_count{status_code="429"}[10m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Loki is rate limiting Alloy on {{ $labels.pod }}"
            description: "Loki returning 429. Raise limits_config.ingestion_rate_mb (currently 10MB/s) or ship less."

        - alert: AlloyComponentUnhealthy
          expr: alloy_component_controller_running_components{health_type!="healthy"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Alloy on {{ $labels.pod }} has unhealthy components"
            description: "{{ $value }} components in state \"{{ $labels.health_type }}\"."

