---
# Egress only; ingress is the apiserver calling the webhook, probes and
# scraping.
#
# The selector app.kubernetes.io/instance=mariadb-operator-helm covers all three
# deployments: operator, cert-controller, webhook. Observed egress, stage-1
# sample: the apiserver, coredns, and 3306 to the managed mariadb pods
# (health checks and replication management).
#
# If a Galera cluster is ever deployed, the operator additionally needs 5555 to
# the agent -- extend the last rule then.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mariadb-operator-egress
  namespace: mariadb-operator
  labels:
    sea1.policy/tier: infra
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: mariadb-operator-helm
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # One rule, pinned to 6443: Talos serves the apiserver on the nodes, so the
    # kube-apiserver label rides the node identity and an unported
    # kube-apiserver allow would open every port on the control-plane IPs
    # (kubelet, etcd, apid).
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mariadb
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
