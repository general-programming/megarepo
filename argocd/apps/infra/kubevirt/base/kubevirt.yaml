apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
  annotations:
    # The CRD ships in the same kustomization; without a later wave the first
    # sync tries to apply this before the CRD is established and errors out.
    argocd.argoproj.io/sync-wave: "1"
spec:
  certificateRotateStrategy: {}
  configuration:
    # Backing store for persistent vTPM / EFI NVRAM state. Required by
    # VMPersistentState below -- without it KubeVirt falls back to the default
    # StorageClass, which here is ceph-rbd-xfs (Block, RWO). Backend storage
    # must be Filesystem mode, and RWX or a guest with a persistent vTPM cannot
    # live-migrate. cephfs is the only class that satisfies both.
    vmStateStorageClass: cephfs
    developerConfiguration:
      featureGates:
        # Persists vTPM and EFI NVRAM across restarts in a per-VM backend PVC.
        #
        # Needed because dma-colo-erin-00 has a LUKS root sealed to the TPM.
        # A non-persistent vTPM is regenerated every boot, so ANY TPM
        # enrolment would break on the next start -- the guest would need its
        # passphrase typed at the console forever. Note this switches the
        # emulated device from tpm-tis to tpm-crb for VMs that opt in.
        #
        # The Proxmox vTPM state is NOT transferable: the sealed blob is bound
        # to that TPM's SRK *and* to PCR 7, which measures SecureBoot state
        # plus PK/KEK/db/dbx. dbx ships with the firmware build and Proxmox's
        # EDK II differs from KubeVirt's, so PCR 7 cannot be reproduced. The
        # supported path is re-enrolling against the new vTPM after migration.
        - VMPersistentState
      # Nested virt is live: the workers run `cpu: host` on hypervisors with
      # kvm_amd nested=Y, and /dev/kvm is present on the Talos nodes. Leaving
      # useEmulation unset keeps QEMU on hardware virt -- if it ever silently
      # flips to TCG emulation, VMs still boot but run ~20x slower.
      useEmulation: false
  workloads:
    # VMs can only run where virt-handler runs, so keeping it off nodes
    # labelled no-virt is what actually makes them unschedulable there --
    # sea1-k8s-103-0 sits in the wobscale rack with no br0, so a LAN-attached
    # guest there would have no route onto the sea1 LAN at all.
    #
    # This is a hard exclusion by necessity: nodePlacement governs a
    # DaemonSet, where preferredDuringScheduling would be a no-op. The
    # positive counterpart -- preferring the bridged nodes -- is a soft
    # affinity and has to live on each VM instead.
    nodePlacement:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: generalprogramming.org/no-virt
                    operator: DoesNotExist
  # imagePullPolicy/imageTag intentionally unset: virt-operator then pins every
  # component to its own version, so bumping the vendored operator manifest is
  # the single source of truth for the KubeVirt version.
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
