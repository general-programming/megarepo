# L2 attachment onto the sea1 LAN (10.3.2.0/23 + 2602:fa6d:10:ffff::/116) via
# the br0 bridge that sea1-k8s-{0,1,2} carry.
#
# ipam is deliberately empty: the guest does its own addressing. That is the
# entire point -- sea1-core serves DHCP and DNS, which is broadcast traffic no
# Service can front, so its VM has to be a real L2 citizen of the LAN rather
# than sit behind a managed CNI subnet.
#
# Verified end to end on 2026-08-02: a cirros guest on this attachment pulled
# a lease from the LAN's kea (10.3.3.134/23), took the v4 default via
# 10.3.2.1, and picked up the IPv6 default from RA.
# Every VM in this namespace should carry the placement preference below.
# KubeVirt has no global lever for it -- spec.workloads.nodePlacement on the
# KubeVirt CR governs virt-handler, and is a hard gate rather than a
# preference -- so it goes on each VM:
#
#   spec:
#     affinity:
#       nodeAffinity:
#         preferredDuringSchedulingIgnoredDuringExecution:
#           - weight: 100
#             preference:
#               matchExpressions:
#                 - key: generalprogramming.org/lan-bridge
#                   operator: In
#                   values: ["true"]
#
# Soft on purpose: a VM with no LAN attachment can still run on the wobscale
# node if the main cluster is full. Anything using br0-lan is already
# confined there in practice, since Multus only runs on the labelled nodes.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: br0-lan
  namespace: virt
spec:
  config: '{"cniVersion":"0.3.1","name":"br0-lan","type":"bridge","bridge":"br0","ipam":{}}'
