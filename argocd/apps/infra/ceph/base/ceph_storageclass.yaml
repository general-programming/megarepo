---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-rbd
provisioner: ceph.rbd.csi.ceph.com
parameters:
  clusterID: ceph
  pool: k8s-rbd
  imageFormat: '2'
  imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: ceph
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Delete
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-rbd-xfs
  annotations:
    storageclass.kubernetes.io/is-default-class: true
provisioner: ceph.rbd.csi.ceph.com
parameters:
  clusterID: ceph
  pool: k8s-rbd
  imageFormat: '2'
  imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: ceph
  csi.storage.k8s.io/fstype: xfs
reclaimPolicy: Delete
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cephfs
provisioner: ceph.cephfs.csi.ceph.com
parameters:
  clusterID: ceph
  fsName: k8s-cephfs
  pool: k8s-cephfs-data
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: ceph
# Without this, an MDS-blocklisted client wedges permanently: every operation
# returns EACCES and the only recovery is a force-unmount on the node. That is
# what took out ipfs, sentry, synapse and the alloy WAL on 2026-07-27.
# recover_session=clean makes the kernel client reconnect and drop its stale
# state instead. In-flight writes on a reconnected mount can see EIO, which is
# a far better failure mode than a mount that never comes back.
mountOptions:
  - recover_session=clean
reclaimPolicy: Delete
allowVolumeExpansion: true
---
# Same pool as ceph-rbd, but the volume outlives its claim. For KubeVirt guest
# disks: with Delete, anything that removes the PVC -- an ArgoCD prune, a
# mistaken kubectl, an app moved between projects -- destroys the RBD image and
# the guest with it. Retain leaves the PV Released and the image intact, so the
# worst case is a manual reattach instead of data loss.
#
# Pairs with prune: false on the vms AppProject; both layers are deliberate.
#
# imageFeatures is deliberately just layering, unlike the other classes here.
# KubeVirt live migration needs ReadWriteMany, which means the image is mapped
# on the source and target nodes at once, and object-map/fast-diff/journaling
# all depend on exclusive-lock -- which serialises access and stalls I/O when
# two clients hold the image. Only one QEMU writes at a time during a
# migration handover, so dropping the lock is safe here and required for RWX.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-rbd-retain
  annotations:
    # StorageClass parameters are immutable, so editing imageFeatures fails a
    # normal apply. Replace=true on its own is not enough either -- that is
    # `kubectl replace`, which hits the same immutability error. Force=true is
    # what makes ArgoCD delete and recreate. Safe here: existing PVs reference
    # the class by name but do not need it to exist, and only new provisioning
    # reads it.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
provisioner: ceph.rbd.csi.ceph.com
parameters:
  clusterID: ceph
  pool: k8s-rbd
  imageFormat: '2'
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: ceph
reclaimPolicy: Retain
allowVolumeExpansion: true
