apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# sea1's ceph is converged Rook: the operator owns live state that git does not
# describe. Pruning here is not "remove an unused Deployment" -- a pruned
# CephBlockPool deletes the pool, and a pruned CephCluster tears down the
# cluster. Same reasoning as the vms project, higher stakes.
#
# Dropping a resource from git now leaves it running and needs a deliberate
# `kubectl delete`, which is the right amount of friction for storage.
#
# selfHeal is deliberately LEFT ON: git should still win for CephCluster spec.
# The operator-owned object that selfHeal was fighting -- rook-ceph-mon-endpoints
# -- is no longer in git at all.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
resources:
  - ../base
  - ceph_secret.yaml
patches:
  - path: patch_storageclass.yaml
  - path: patch_cephcluster.yaml
