---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: ceph-external
  # namespace is required for the patch to match -- unlike the cluster-scoped
  # StorageClass patch, a namespaced target needs it to resolve.
  namespace: ceph
spec:
  external:
    # THE CUTOVER. Rook stops being a passive consumer of this cluster and
    # starts running daemons in it. Everything above/below is what makes that
    # safe; see .claude/skills/ceph-cephadm-brake for the brakes.
    enable: false
  mgr:
    # Two Rook mgrs alongside cephadm's three. mgrs are active/standby, so extra
    # ones are harmless standbys -- no quorum maths, unlike the mons.
    count: 2
  storage:
    # OSDs are adopted per-host during the metal migration, not here.
    useAllNodes: false
    useAllDevices: false
  mon:
    # mon.d proved the join works (quorum sea1-hv-0,sea1-hv-1,sea1-hv-2,d).
    # Going to 3 Rook mons -> 6 total during coexistence. Six is even, which is
    # fine transiently but must not be lingered in; the cephadm mons are drained
    # one at a time afterwards, `ceph mon remove` FIRST and only then dropping
    # the name from externalMonIDs (reversing that order un-shields a live mon).
    count: 3
    allowMultiplePerNode: false
    # The cephadm-managed mons of THIS cluster. Rook's health checker removes
    # any mon in quorum that is not its own (health.go:250); externalMonIDs is
    # what shields them, by stripping them out of the quorum status before that
    # check runs (reconcileExternalMons, health.go:222).
    #
    # Inert while external.enable is true -- checkHealth returns early on the
    # external branch (health.go:181-199) and never reaches the removal loop --
    # but it MUST already be set before that flag ever flips, because there is
    # no value of mon.count that avoids the removal condition once a Rook mon
    # coexists with these.
    externalMonIDs:
      - sea1-hv-0
      - sea1-hv-1
      # sea1-hv-2 drained 2026-08-03 (ceph orch apply mon --placement=...).
      # Names are removed here only AFTER the mon is gone from the monmap --
      # doing it the other way round un-shields a mon that still exists and
      # re-arms the removal at health.go:250.
  cephVersion:
    # All 35 daemons on sea1 are 20.2.1 tentacle. The 19.2.3 squid visible on
    # the hypervisors is Proxmox's host CLI package, not the cluster.
    image: quay.io/ceph/ceph:v20.2.1
  healthCheck:
    daemonHealth:
      mon:
        # Unlike `disabled`, `timeout` IS read (health.go:70-79). Zero disables
        # mon failover outright (health.go:286-289), so Rook cannot decide a
        # cephadm mon is dead and replace it. Does NOT stop the removal at
        # health.go:250 -- only externalMonIDs does that.
        timeout: 0s
  network:
    # Ceph here is IPv6-only (ms_bind_ipv4 false, public_network
    # 2602:fa6d:10:ffff::/116) and pod IPs are outside that range, so mons must
    # be on the host network to be reachable by the OSDs and the other mons.
    provider: host
    ipFamily: IPv6
    dualStack: false
  placement:
    # Hard gate for every Rook daemon. lan-bridge=true is exactly the three
    # mainline LAN workers (sea1-k8s-0/1/2 on ::110-112), which are the only
    # nodes inside ceph's public_network. sea1-k8s-103-0 is on an entirely
    # different prefix (2620:fc:c000::/…) at the wobscale rack, so a mon placed
    # there could never reach quorum; the control planes are in-range but are
    # not intended daemon hosts.
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: generalprogramming.org/lan-bridge
                  operator: In
                  values:
                    - "true"
    mon:
      # Belt and braces alongside mon.allowMultiplePerNode=false: losing one
      # node must never cost more than one mon.
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - rook-ceph-mon
            topologyKey: kubernetes.io/hostname
