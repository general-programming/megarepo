---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: ceph-external
  # namespace is required for the patch to match -- unlike the cluster-scoped
  # StorageClass patch, a namespaced target needs it to resolve.
  namespace: ceph
spec:
  external:
    # THE CUTOVER. Rook stops being a passive consumer of this cluster and
    # starts running daemons in it. Everything above/below is what makes that
    # safe; see .claude/skills/ceph-cephadm-brake for the brakes.
    enable: false
  mgr:
    # Two Rook mgrs alongside cephadm's three. mgrs are active/standby, so extra
    # ones are harmless standbys -- no quorum maths, unlike the mons.
    count: 2
  storage:
    # OSDs are adopted per-host during the metal migration, one host at a time.
    useAllNodes: false
    useAllDevices: false
    nodes:
      # sea1-hv-2 -> metal Talos, 2026-08-03. The 7 Intel SSDPE2KX020T8 already
      # carry cephadm-created encrypted OSDs; Rook ADOPTS them via
      # `ceph-volume lvm activate`. Nothing is created and no data moves --
      # ceph-volume reports them "available": false ("LVM detected"), so the
      # provisioning path cannot claim them even by accident.
      - name: sea1-k8s-2
        # nvme7n1 is the 7.68T HGST data disk, NOT an OSD. Bounded to 0-6 so a
        # rename or a re-enumeration can never hand it to Rook. Widening this
        # to ^nvme[0-9]+n1$ would let Rook build an OSD on it.
        deviceFilter: "^nvme[0-6]n1$"
        config:
          # Selects the lockbox branch (and sets hostIPC, which cryptsetup
          # needs). Does NOT re-encrypt: the passphrase is fetched from the
          # cluster's config-key store using the cephx identity in the LV tag.
          encryptedDevice: "true"
          # The existing 21 OSDs are class `ssd`. Left to itself Rook would
          # register these as `nvme`, and any class-restricted CRUSH rule would
          # then place zero PGs here -- silently, with the migration looking fine.
          deviceClass: ssd
      # RESOLVED 2026-08-06. The CRUSH host buckets are now named sea1-k8s-N,
      # matching the nodes, and osd_crush_update_on_start is back to `true`
      # where it is a genuine no-op.
      #
      # Getting here was not free. Flipping the setting to true while the
      # buckets were still named sea1-hv-N made the next OSD restart
      # re-register hv-0's seven OSDs under a NEW auto-created `sea1-k8s-0`
      # bucket -- and a new bucket id recomputes placement, so 29.7% of
      # objects went misplaced and began backfilling, one pg hitting
      # backfill_toofull. Recovered by moving the OSDs back into bucket -7 and
      # deleting the stray bucket.
      #
      # The correct tool is `ceph osd crush rename-bucket sea1-hv-N
      # sea1-k8s-N`: it keeps the bucket id, so placement is untouched --
      # verified one bucket at a time, misplaced went 0.854% -> 0.838% with no
      # jump. Rename FIRST, enable auto-update SECOND. Never the other way.
      #
      # sea1-hv-0 -> metal Talos, 2026-08-06. The LAST host; with this the
      # cluster runs no Proxmox at all. Same in-place adoption of seven
      # encrypted Intel SSDPE2KX020T8 already in CRUSH host sea1-hv-0.
      - name: sea1-k8s-0
        # This host's nvme7n1 is the 7.68T HGST SN200, live and healthy.
        deviceFilter: "^nvme[0-6]n1$"
        config:
          encryptedDevice: "true"
          deviceClass: ssd
      # sea1-hv-1 -> metal Talos, 2026-08-05. Same adoption, same seven Intel
      # SSDPE2KX020T8 (OSDs 1,4,6,10,12,15,18 in CRUSH host sea1-hv-1). The
      # bucket keeps its old name because osd_crush_update_on_start=false --
      # verified false again immediately before this was applied. That setting
      # is what decouples node naming from CRUSH and must stay false until all
      # three hosts are converted.
      - name: sea1-k8s-1
        # Same bound, and it matters more here: this host's nvme7n1 is the
        # 7.68T HGST SN200, which is live and healthy. Rook must never see it.
        deviceFilter: "^nvme[0-6]n1$"
        config:
          # Selects the lockbox branch (and sets hostIPC, which cryptsetup
          # needs). Does NOT re-encrypt: the passphrase is fetched from the
          # cluster's config-key store using the cephx identity in the LV tag.
          encryptedDevice: "true"
          # The existing 21 OSDs are class `ssd`. Left to itself Rook would
          # register these as `nvme`, and any class-restricted CRUSH rule would
          # then place zero PGs here -- silently, with the migration looking fine.
          deviceClass: ssd
  mon:
    # mon.d proved the join works (quorum sea1-hv-0,sea1-hv-1,sea1-hv-2,d).
    # Going to 3 Rook mons -> 6 total during coexistence. Six is even, which is
    # fine transiently but must not be lingered in; the cephadm mons are drained
    # one at a time afterwards, `ceph mon remove` FIRST and only then dropping
    # the name from externalMonIDs (reversing that order un-shields a live mon).
    count: 3
    allowMultiplePerNode: false
    # The cephadm-managed mons of THIS cluster. Rook's health checker removes
    # any mon in quorum that is not its own (health.go:250); externalMonIDs is
    # what shields them, by stripping them out of the quorum status before that
    # check runs (reconcileExternalMons, health.go:222).
    #
    # Inert while external.enable is true -- checkHealth returns early on the
    # external branch (health.go:181-199) and never reaches the removal loop --
    # but it MUST already be set before that flag ever flips, because there is
    # no value of mon.count that avoids the removal condition once a Rook mon
    # coexists with these.
    # All three cephadm mons drained 2026-08-03; quorum is now d,e,f, entirely
    # Rook-managed on the Talos workers. Kept (empty) as documentation of what
    # this field is for: any future coexistence must repopulate it BEFORE a
    # foreign mon exists. Names are only ever removed from here AFTER the mon
    # is gone from the monmap -- the reverse order un-shields a live mon.
    externalMonIDs: []
  cephVersion:
    # All 35 daemons on sea1 are 20.2.1 tentacle. The 19.2.3 squid visible on
    # the hypervisors is Proxmox's host CLI package, not the cluster.
    image: quay.io/ceph/ceph:v20.2.1
  healthCheck:
    daemonHealth:
      mon:
        # Re-enabled 2026-08-06 with the default 10m, now that every mon is
        # Rook's. `timeout: 0s` disabled mon failover outright
        # (health.go:286-289) and existed only so Rook could not decide a
        # CEPHADM mon was dead and replace it during coexistence. cephadm is
        # gone -- `ceph orch host ls` reports 0 hosts -- so that guard now just
        # means a genuinely dead mon is never replaced, which is the opposite
        # of what we want on a three-mon cluster.
        #
        # Note `timeout` IS read even though `disabled` is not (health.go:70-79),
        # and it never governed the removal at health.go:250 -- only
        # externalMonIDs did that, and it is empty.
        timeout: 10m
  network:
    # Ceph here is IPv6-only (ms_bind_ipv4 false, public_network
    # 2602:fa6d:10:ffff::/116) and pod IPs are outside that range, so mons must
    # be on the host network to be reachable by the OSDs and the other mons.
    provider: host
    ipFamily: IPv6
    dualStack: false
  placement:
    # Hard gate for every Rook daemon. lan-bridge=true is exactly the three
    # mainline LAN workers (sea1-k8s-0/1/2 on ::110-112), which are the only
    # nodes inside ceph's public_network. sea1-k8s-103-0 is on an entirely
    # different prefix (2620:fc:c000::/…) at the wobscale rack, so a mon placed
    # there could never reach quorum; the control planes are in-range but are
    # not intended daemon hosts.
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: generalprogramming.org/lan-bridge
                  operator: In
                  values:
                    - "true"
    mon:
      # Belt and braces alongside mon.allowMultiplePerNode=false: losing one
      # node must never cost more than one mon.
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - rook-ceph-mon
            topologyKey: kubernetes.io/hostname
