---
# Plain L2 pool: SEA1 has no router-side BGP session for MetalLB, unlike FMT2.
# 10.3.3.0/28 is free by inspection -- sea1-core's Kea pool starts at
# 10.3.3.128 and every static lives down in 10.3.2.x.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: sea1-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.3.3.0/28
  # First pool in SEA1, and several Services here are type=LoadBalancer only
  # because they were written for FMT2 (znc, loki, tempo). Requiring an explicit
  # request keeps them pending as they are today.
  autoAssign: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: sea1-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - sea1-pool
  # Nodes off the 10.3.2.0/23 site LAN must never ARP for a 10.3.3.x address.
  # Label is set in infrastructure/talos/sea1/talconfig.yaml.
  nodeSelectors:
    - matchExpressions:
        - key: generalprogramming.org/no-lan-vip
          operator: DoesNotExist
