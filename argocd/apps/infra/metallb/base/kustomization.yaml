apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream/metallb-frr-k8s.yaml
  - metrics-rbac.yaml
patches:
  # Upstream annotates controller and speaker with prometheus.io/scrape, but
  # since v0.16 the annotated port 9120 speaks HTTPS. The all-scrape catch-all
  # in the victoriametrics app is http-only (its prometheus.io/scheme relabel
  # is a no-op), so every one of these targets fails with "client sent an HTTP
  # request to an HTTPS server" -- a 400 to vmagent and a TLS handshake error
  # logged by every speaker every 30s. Opt out here and let the dedicated
  # VMPodScrape in victoriametrics/base/agent_scrape_metallb.yaml do it
  # properly over TLS.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: controller
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1scrape
        value: "false"
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: speaker
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1scrape
        value: "false"
