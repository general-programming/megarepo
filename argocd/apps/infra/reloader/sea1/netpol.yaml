---
# Port of the fmt2 reloader policy. Egress only; ingress is probes and scraping,
# which the flow sample cannot enumerate safely.
#
# Observed egress, stage-1 sample: the apiserver and nothing else. On sea1 the
# collector recorded that flow with host identity, not kube-apiserver -- Talos
# runs the apiserver on the node itself and the ipcache can resolve its address
# either way -- so both entities are allowed, pinned to 6443.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: reloader-egress
  namespace: reloader
  labels:
    sea1.policy/tier: infra
spec:
  endpointSelector:
    matchLabels:
      app: reloader-reloader
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # One rule, pinned to 6443: Talos serves the apiserver on the nodes, so the
    # kube-apiserver label rides the node identity and an unported
    # kube-apiserver allow would open every port on the control-plane IPs
    # (kubelet, etcd, apid).
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
