environment:
  MEILI_NO_ANALYTICS: true
  MEILI_ENV: production
  # Renamed from MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE; without it the engine
  # refuses to start when the on-disk DB was written by an older version.
  MEILI_UPGRADE_DB: "true"

auth:
  existingMasterKeySecret: meilisearch-master-key

# Chart default is 60x1s, which is not enough headroom for an on-startup DB
# upgrade after a chart bump. 5s x 120 = 10 minutes.
startupProbe:
  periodSeconds: 5
  InitialDelaySeconds: 1
  failureThreshold: 120
  timeoutSeconds: 5
  path: "/health"
  httpHeaders: []

# Ceph, NOT local-path. local-path at sea1 lands on an HGST SN200, which
# latches into a state with no proven way to read the data back off it
# (docs/sn200-runbook.md). This was the last single-copy volume on one:
# one replica, no backup, one firmware fault from permanent loss.
#
# Cheap to move because the index held 104 KB -- it had already been
# reinitialised once during the hv-2 conversion. Meilisearch is a derived
# index, so the real protection is that it can be rebuilt from source; Ceph
# just stops a drive fault from silently emptying it again.
#
# A StatefulSet's volumeClaimTemplates are IMMUTABLE, so changing this does
# not migrate anything -- the StatefulSet and its PVC must be deleted so the
# chart recreates them on the new class.
persistence:
  enabled: true
  storageClass: ceph-rbd-xfs
  size: 32Gi

service:
  type: ClusterIP
  port: 7700
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "svc-meilisearch-sea1"
