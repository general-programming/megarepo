---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-db
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-standard-trixie
    major: 18
  instances: 2
  primaryUpdateStrategy: unsupervised
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: generalprogramming.org/no-database
                operator: DoesNotExist
  storage:
    storageClass: local-path
    size: 128Gi
  bootstrap:
    initdb:
      database: shared
      owner: shared
---
# ClusterIP, not NodePort. Reach it from outside via the tailscale proxy
# (svc-shared-postgres), which applies tailnet ACLs. A NodePort additionally
# answered on every node IP, so anything on the SEA1 LAN could open a postgres
# session with only the DB password in the way -- verified reachable from a
# laptop over tailscale with no cluster credentials.
#
# The -hostport suffix is now a misnomer, kept because apps resolve this name.
apiVersion: v1
kind: Service
metadata:
  name: postgres-rw-hostport
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "svc-shared-postgres"
spec:
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: shared-db
    cnpg.io/instanceRole: primary
  sessionAffinity: None
  type: ClusterIP
