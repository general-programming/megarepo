---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-timescaledb
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: timescale
    major: 18
  instances: 2
  primaryUpdateStrategy: unsupervised
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: generalprogramming.org/no-database
                operator: DoesNotExist
  # Ceph, NOT local-path. Both local-path nodes (sea1-k8s-0/1) are backed by
  # HGST SN200s, which latch into an unrecoverable "Post Crash Startup" with no
  # proven way to read data back off them (docs/sn200-runbook.md). This cluster
  # was running a SINGLE instance on one of them with no backup, i.e. one
  # firmware fault away from permanent loss of the whole dataset.
  #
  # 640Gi is sized from measured usage, not from the old PVC: pgdata/base was
  # 477G against a 256Gi local-path PVC, because local-path is a hostPath
  # directory and enforces no quota. Ceph RBD does enforce it, so the previous
  # figure would have under-provisioned by ~1.9x. ceph-rbd-xfs allows online
  # expansion if that stops being enough.
  #
  # Changing storageClass affects NEW PVCs only -- CNPG recreates instances onto
  # it one at a time, it does not migrate anything in place.
  storage:
    storageClass: ceph-rbd-xfs
    size: 640Gi
  bootstrap:
    initdb:
      database: shared
      owner: shared
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS timescaledb;
  postgresUID: 1000
  postgresGID: 1000
  postgresql:
    parameters:
      shared_buffers: "32192MB"
      effective_cache_size: "96578MB"
      maintenance_work_mem: "2047MB"
      work_mem: "13735kB"
      timescaledb.max_background_workers: "16"
      max_worker_processes: "43"
      max_parallel_workers_per_gather: "12"
      max_parallel_workers: "24"
      wal_buffers: "16MB"
      min_wal_size: "512MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      checkpoint_completion_target: "0.9"
      max_locks_per_transaction: "1024"
      autovacuum_max_workers: "10"
      autovacuum_naptime: "10"
      default_toast_compression: "lz4"
      jit: "off"
      effective_io_concurrency: "256"
    shared_preload_libraries:
      - timescaledb
---
apiVersion: v1
kind: Service
metadata:
  name: timescale-rw-hostport
spec:
  ports:
    - name: postgres
      port: 5432
      nodePort: 32346
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: shared-timescaledb
    cnpg.io/instanceRole: primary
  sessionAffinity: None
  type: NodePort
