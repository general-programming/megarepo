# The direct-ingress VIP, dual-stack. v6 (::e00) is natively routed and
# reachable from the internet on its own; v4 (10.3.3.2) is LAN-only and reached
# through the vpn-leaf DNATs on 199.255.18.162/.163 (projects/barf/network.yml).
# Talos already admits 443 from everywhere (public-web-ingress).
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-public
  labels:
    generalprogramming.org/lb-pool: sea1-lan
  annotations:
    lbipam.cilium.io/ips: "10.3.3.2,2602:fa6d:10:ffff::e00"
spec:
  type: LoadBalancer
  # Local keeps the real client source address; traefik is a DaemonSet, so the
  # announcing node always has a local endpoint.
  externalTrafficPolicy: Local
  ipFamilyPolicy: RequireDualStack
  ipFamilies: [IPv4, IPv6]
  selector:
    app.kubernetes.io/instance: traefik-helm-traefik
    app.kubernetes.io/name: traefik
  ports:
    - name: publicsecure
      port: 443
      targetPort: publicsecure
