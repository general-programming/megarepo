apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-helm
  namespace: argocd
spec:
  source:
    helm:
      valuesObject:
        service:
          type: ClusterIP
        ports:
          # asDefault declared so any future non-default entrypoint is opt-in:
          # with defaults present, a router with no entryPoints binds only to
          # them. The direct web ingress is NOT an entrypoint here -- it is its
          # own hostNetwork instance (traefik-direct.yaml); cilium mangles
          # replies to non-cluster clients on every translated path
          # (docs/bpf-masquerade-sea1.md), so it cannot live behind a Service.
          web:
            asDefault: true
          websecure:
            asDefault: true
---
