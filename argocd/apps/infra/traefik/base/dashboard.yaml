---
# Dashboard basicAuth users, sourced from Vault instead of committed. Rotated
# 2026-08-09 to fresh bcrypt hashes (the old nepeat entry was apr1/MD5).
# secret/app/traefik/dashboard-auth holds the htpasswd `users` key.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: traefik-dashboard-auth
  namespace: traefik
spec:
  type: kv-v2
  mount: secret
  path: app/traefik/dashboard-auth
  destination:
    name: traefik-dashboard-auth
    create: true
  refreshAfter: 1m
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-basicauth
  namespace: traefik

spec:
  basicAuth:
    secret: traefik-dashboard-auth
