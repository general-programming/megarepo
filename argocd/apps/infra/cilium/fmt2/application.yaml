---
# Cilium replaces the Talos-default flannel CNI on fmt2.
#
# Rebuilding fmt2 from scratch needs Cilium installed by hand (helm or a Talos
# inlineManifest) BEFORE ArgoCD starts -- ArgoCD cannot install its own CNI.
#
# Migration plan: docs/fmt2-cilium-landing-plan.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: infra
  source:
    chart: cilium
    repoURL: https://helm.cilium.io
    # 1.20.0 supports k8s 1.33-1.36; this cluster is 1.36.2.
    targetRevision: 1.20.0
    helm:
      valuesObject:
        # Reuse the podCIDRs kube-controller-manager allocates, as flannel did,
        # so pod addressing survives the migration and rollback stays cheap.
        ipam:
          mode: kubernetes
        k8s:
          requireIPv4PodCIDR: true

        # Single-stack. fmt2 nodes have no routable IPv6 -- ens18 carries only
        # 10.65.67.x/24 and a link-local fe80::. Dual-stack is blocked on node
        # addressing, not on Cilium; see docs/fmt2-talos-k8s-update.md phase D.
        ipv4:
          enabled: true
        ipv6:
          enabled: false

        # No encapsulation: all 8 nodes share one L2 (10.65.67.0/24) and reach
        # each other on-link via ens18. Adding a node off that L2 breaks native
        # routing -- revert to routingMode: tunnel if that happens.
        routingMode: native
        autoDirectNodeRoutes: true
        ipv4NativeRoutingCIDR: 10.244.0.0/16

        # Pin the MTU to what pods already have under flannel (9000 fabric minus
        # VXLAN's 50). Native routing would auto-detect 9000, which is the egress
        # black-hole sea1 still has open (341c652f) -- this keeps the CNI swap
        # MTU-neutral and leaves jumbo-vs-1500 as its own project.
        MTU: 8950

        # ens18 is the only up ether device on all 8 nodes and carries the node
        # IP. Every node also has bond0/dummy0/teql0 down, which is ambiguous
        # enough that kubeProxyReplacement refuses to start without this.
        #
        # directRoutingDevice lives under nodePort -- the chart only reads
        # .Values.nodePort.directRoutingDevice. A top-level directRoutingDevice
        # is silently ignored (verified against the 1.20.0 chart; sea1's values
        # have that bug and are only saved by their CiliumNodeConfig).
        devices: "ens18"
        nodePort:
          directRoutingDevice: "ens18"

        # iptables, NOT bpf.masquerade -- sea1 tried that and it broke port 53
        # (aeff6eb0, reverted in 7e420b62); Talos hostDNS is the prime suspect
        # and the root cause is still open there.
        enableIPv4Masquerade: true

        # k8sServiceHost/Port are localhost:7445, i.e. Talos KubePrism, NOT a
        # control-plane address: with kube-proxy gone the agent cannot resolve
        # the kubernetes Service to reach the API server, so it needs a
        # node-local endpoint. KubePrism was enabled cluster-wide in the Talos
        # update and verified healthy on all 8 nodes.
        #
        # kube-proxy is still deployed at this point. Cilium takes over service
        # handling first, and only then is kube-proxy removed, so services are
        # never left unhandled by both.
        kubeProxyReplacement: true
        k8sServiceHost: localhost
        k8sServicePort: 7445

        # Phase 3, step 1: the 11 policies flannel never enforced are now
        # ENFORCED. Audit ran first and returned zero verdicts across all eight
        # nodes over two independent windows totalling ~17 minutes of continuous
        # watching, with argocd at 0 unhealthy apps and 0 pod restarts.
        #
        # `default` and not `always` deliberately -- this step is only about the
        # existing rules. Under `default` just the 13 pods those policies select
        # are evaluated, all in argocd; the other ~230 are untouched. Going to
        # `always` is a separate, much larger step once policies exist for them.
        #
        # Measured blast radius before flipping: argocd 13 pods, and every flow
        # observed for them is already permitted. monitoring/node-exporter selects
        # 8 pods but they are all hostNetwork, where CNP does not apply. Both
        # victoriametrics policies select 0 pods -- their labels match nothing.
        policyEnforcementMode: default
        policyAuditMode: true

        # MANDATORY even though fmt2 has no Multus today: the chart default
        # moves foreign CNI configs aside, and flannel's conflist must be
        # removed deliberately per node during the roll, not silently.
        cni:
          exclusive: false

        # Talos cannot let Cilium mount cgroups itself.
        cgroup:
          autoMount:
            enabled: false
          hostRoot: /sys/fs/cgroup

        # Per the SideroLabs guide, matching sea1. SYS_MODULE is useless on
        # Talos; PERFMON/BPF would replace SYS_ADMIN rather than supplement it.
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_RESOURCE

        # MetalLB stays on fmt2, unlike sea1. It runs BGP via frr-k8s against
        # two leaves plus an external ASN, the VIP pool is off-L2, and
        # 79.110.170.65 is shared by traefik and znc-external -- none of which
        # ports to Cilium LB IPAM as a side effect of a CNI swap.
        # Do NOT add l2announcements here.

        # Metrics on :9962 (agent) and :9963 (operator). Scraped by VMPodScrape,
        # not the chart's serviceMonitor -- this cluster runs the
        # VictoriaMetrics operator, not prometheus-operator.
        prometheus:
          enabled: true
        operator:
          prometheus:
            enabled: true

        hubble:
          # 8x the 4095 default (~32 MB/agent). The Hubble ring buffer -- not the
          # BPF perf ring or the observer queue, both of which are clean -- drops
          # events under burst: SEA1 lost 249k of 282M, 0.088%. Low overall, but a
          # single lost event can erase a rare (src->dst:port) tuple from the flow
          # graph entirely, and those are exactly the ones policy authoring misses.
          eventBufferCapacity: 32767
          # cronJob, not the chart default of helm. With method=helm the certs
          # are minted at render time, so whenever ArgoCD's render cache misses
          # it produces fresh ones and the three secrets sit permanently
          # OutOfSync -- which is what fmt2 was doing, and why selfHeal could not
          # be turned on without rotating Hubble's mTLS on every reconcile.
          # cronJob generates them in-cluster instead, so renders are stable.
          tls:
            auto:
              enabled: true
              method: cronJob
          relay:
            enabled: true
          # Flow-derived metrics on :9965. httpV2 carries the label context the
          # upstream Grafana dashboards expect; without it their panels are empty.
          metrics:
            enableOpenMetrics: true
            enabled:
              - dns
              - drop
              - tcp
              - flow
              - port-distribution
              - icmp
              - "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction"
          ui:
            enabled: true
            # Hubble UI has NO authentication of its own. Anyone who reaches it
            # sees every flow in the cluster. Tailnet ACLs are the only control.
            service:
              annotations:
                tailscale.com/expose: "true"
                tailscale.com/hostname: "hubble-fmt2"

  # Automated sync restored now that all 8 nodes are on Cilium (landing plan
  # step 1.5). It was manual for the cutover so selfHeal could not reconcile
  # against a cluster that was half flannel and half Cilium.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - allowEmpty=true
      - ServerSideApply=true
