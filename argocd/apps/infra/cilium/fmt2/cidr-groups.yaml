---
# Named lists of *external* CIDRs for CiliumNetworkPolicy to reference, so an
# address list is written once instead of copied into every policy.
#
# Landing these alone is a NO-OP: a CIDRGroup is inert until a policy references
# one, and nothing here does yet. That is why they go first -- the addresses get
# reviewed on their own terms, before any policy depends on them being right.
#
# Cluster-scoped (NAMESPACED=false), so no namespace, and visible to policies in
# every namespace. Only CiliumNetworkPolicy / CiliumClusterwideNetworkPolicy can
# reference them -- native networking.k8s.io/v1 NetworkPolicy has no equivalent,
# which is the main argument for writing fmt2's new policies as CNP.
#
# What these do NOT match, which is the subtle part: Cilium is identity-based, so
# a CIDR only matches peers carrying a CIDR identity. Pods (10.244.0.0/16) have
# their own identities, ClusterIPs (10.96.0.0/12) are DNAT'd before policy is
# evaluated, and the nodes carry host/remote-node identity. For in-cluster peers
# use toEndpoints; for nodes use toEntities: [host, remote-node].
---
# The node LAN. All eight nodes carry their node IP on ens18 in this /24, which
# is also what makes native routing legal. No IPv6: fmt2's nodes have only
# link-local v6, which is why dual-stack is still blocked.
apiVersion: cilium.io/v2
kind: CiliumCIDRGroup
metadata:
  name: fmt2-nodes
  labels:
    fmt2.cidr/class: infra
spec:
  externalCIDRs:
    - 10.65.67.0/24
---
# MetalLB's pools. fmt2-pool is the internal /23 announced to both leaves;
# 79.110.170.65 is the single external VIP shared by traefik and znc-external,
# announced only to the external BGP peer.
apiVersion: cilium.io/v2
kind: CiliumCIDRGroup
metadata:
  name: fmt2-loadbalancers
  labels:
    fmt2.cidr/class: infra
spec:
  externalCIDRs:
    - 10.3.4.0/23
    - 79.110.170.65/32
---
# The external Ceph cluster: mons and OSDs on the three hypervisors. Referenced
# by the base deny-egress-storage-plane CCNP; on this cluster the CIDR arm is
# the one that enforces, because these hosts are not k8s nodes.
apiVersion: cilium.io/v2
kind: CiliumCIDRGroup
metadata:
  name: ceph-hosts
  labels:
    fmt2.cidr/class: infra
spec:
  externalCIDRs:
    - 10.65.67.100/32
    - 10.65.67.101/32
    - 10.65.67.102/32
