---
# Cilium agent: :9962 general agent/datapath/policy metrics, :9965 Hubble
# flow-derived metrics. Both live on the same DaemonSet pod.
#
# VM-native VMPodScrape rather than the chart's prometheus.serviceMonitor,
# which emits a prometheus-operator ServiceMonitor -- these clusters run the
# VictoriaMetrics operator. Same reasoning as cnpg-system's scrape-cnpg.yaml.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cilium-agent
  namespace: kube-system
spec:
  podMetricsEndpoints:
    - port: prometheus
      path: /metrics
    - port: hubble-metrics
      path: /metrics
  selector:
    matchLabels:
      k8s-app: cilium
---
# Operator metrics: identity allocation, ipam, garbage collection, k8s client.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cilium-operator
  namespace: kube-system
spec:
  podMetricsEndpoints:
    - port: prometheus
      path: /metrics
  selector:
    matchLabels:
      io.cilium/app: operator
