---
# Cluster-wide egress deny of node control-plane ports: kubelet, etcd, Talos apid.
# CIDR selectors never match node IPs here (policy-cidr-match-mode unset), so this
# uses toEntities [host, remote-node] instead of the *-nodes CIDRGroups.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-egress-node-api
spec:
  description: "Deny pod egress to kubelet 10250, etcd 2379-2380, Talos apid 50000-50001 on nodes."
  endpointSelector:
    matchExpressions:
      # Opt-out contract: namespaces labeled allow-node-api=true keep node-API access.
      - key: k8s:io.cilium.k8s.namespace.labels.generalprogramming.org/allow-node-api
        operator: NotIn
        values: ["true"]
      # kube-system is exempt by name (metrics-server scrapes kubelet); the namespace
      # is not GitOps-managed, so labeling it here is not an option.
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values: ["kube-system"]
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
            - port: "2379"
              endPort: 2380
              protocol: TCP
            - port: "50000"
              endPort: 50001
              protocol: TCP
