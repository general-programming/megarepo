---
# Named external-CIDR lists for CNP/CCNP toCIDRSet references. Inert until a
# policy references them. Semantics, reference syntax, and the identity caveats
# (CIDR selectors never match pods, ClusterIPs, or nodes): see
# docs/netpol-phase3-sea1-fmt2.md, "CiliumCIDRGroups".
---
# The SEA1 LAN segments the nodes sit on. The LAN is 10.3.2.0/23 (see
# akvorado's `sea1-lan` network definition and the lb-ipam comment); this covers
# the .2 half, where every static host lives, plus the v6 prefix.
#
# Node addressing, verified against the live nodes:
#   sea1-k8s-0  10.3.2.10  2602:fa6d:10:ffff::110
#   sea1-k8s-1  10.3.2.11  2602:fa6d:10:ffff::111
#   sea1-k8s-2  10.3.2.12  2602:fa6d:10:ffff::112
# 10.3.2.6 also appears in flow data as an external Consul agent, so the subnet
# is not exclusively Kubernetes.
#
# CAVEAT: with policy-cidr-match-mode unset (the current state), CIDR selectors
# do NOT match the node IPs -- v4 or v6. They carry remote-node identity instead.
# This group therefore covers 10.3.2.6, the gateway, and any other non-node host
# in these prefixes, but NOT the six node addresses above. To reach the nodes in
# a policy, use `toEntities: [host, remote-node]`.
#
# The v6 prefix also contains 2602:fa6d:10:ffff::e00/120, kept reserved in
# sea1-loadbalancers below even though its LB pool is retired -- see there.
apiVersion: cilium.io/v2
kind: CiliumCIDRGroup
metadata:
  name: sea1-nodes
  labels:
    sea1.cidr/class: private
    sea1.cidr/role: infrastructure
spec:
  externalCIDRs:
    - 10.3.2.0/24
    - 2602:fa6d:10:ffff::/64
---
# The Cilium LoadBalancer VIP pools. Pods reaching a service through its VIP
# instead of its ClusterIP is a common way to accidentally route around policy,
# which is what this group is for.
#
# sea1-lan (10.3.3.0/28) is the exact block from apps/infra/cilium/sea1/
# lb-ipam.yaml. 2602:fa6d:10:ffff::e00/120 was the retired sea1-external-v6
# pool (traefik is ClusterIP behind cloudflared); it stays denied so a future
# pool in this range is covered from day one.
#
# KEEP IN SYNC WITH lb-ipam.yaml. Adding a pool block there without adding it
# here silently widens what can be reached via a VIP.
#
# Deliberately NOT 10.3.3.0/24: the rest of that /24 is sea1-core's Kea DHCP
# pool (starts at 10.3.3.128), which is ordinary LAN clients, not VIPs. Those are
# already covered by rfc1918, so nothing is left unmatched -- but calling
# them "loadbalancers" would make any policy referencing this group mean
# something other than it says.
apiVersion: cilium.io/v2
kind: CiliumCIDRGroup
metadata:
  name: sea1-loadbalancers
  labels:
    sea1.cidr/class: private
    sea1.cidr/role: infrastructure
spec:
  externalCIDRs:
    - 10.3.3.0/28
    - 2602:fa6d:10:ffff::e00/120
---
# sea1's Ceph is converged Rook on the k8s nodes, so these addresses carry
# host/remote-node identity and CIDR selectors do NOT match them today -- the
# entity arm of deny-egress-storage-plane is what enforces here. This group is
# belt-and-braces: it becomes load-bearing only if a Ceph host is ever not a
# k8s node (an external mon, a standalone OSD box).
apiVersion: cilium.io/v2
kind: CiliumCIDRGroup
metadata:
  name: ceph-hosts
  labels:
    sea1.cidr/class: private
    sea1.cidr/role: infrastructure
spec:
  externalCIDRs:
    - 10.3.2.0/24
    - 2602:fa6d:10:ffff::110/128
    - 2602:fa6d:10:ffff::111/128
    - 2602:fa6d:10:ffff::112/128
