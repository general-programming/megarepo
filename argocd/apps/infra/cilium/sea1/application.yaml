---
# Cilium replaces the Talos-default flannel CNI on sea1.
#
# Rebuilding sea1 from scratch needs Cilium installed by hand (helm or a Talos
# inlineManifest) BEFORE ArgoCD starts -- ArgoCD cannot install its own CNI.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: infra
  source:
    chart: cilium
    repoURL: https://helm.cilium.io
    # 1.20.0 supports k8s 1.33-1.36; this cluster is 1.36.2.
    targetRevision: 1.20.0
    helm:
      valuesObject:
        # Reuse the podCIDRs kube-controller-manager allocates, as flannel did,
        # so pod addressing survives the migration and rollback stays cheap.
        ipam:
          mode: kubernetes
        k8s:
          requireIPv4PodCIDR: true
          requireIPv6PodCIDR: true

        ipv4:
          enabled: true
        ipv6:
          enabled: true

        # No encapsulation: every node shares one L2 per family
        # (10.3.2.0/23, 2602:fa6d:10:ffff::/116). Adding a node off that L2
        # breaks native routing -- revert to routingMode: tunnel if that happens.
        routingMode: native
        autoDirectNodeRoutes: true
        ipv4NativeRoutingCIDR: 10.244.0.0/16
        ipv6NativeRoutingCIDR: fd40:10:244::/56

        # Pin the device carrying the node IP. Auto-detection is ambiguous here:
        # every node also has bond0/dummy0/teql0, and k8s-2 four more NICs.
        # This is the control-plane value; nodeconfig-lan-bridge.yaml overrides
        # it to br0 on the bridged workers.
        devices: "ens18"
        directRoutingDevice: "ens18"

        # Pods are on ULA fd40:10:244::/56, so v6 egress still needs masquerade.
        #
        # iptables, NOT bpf.masquerade -- TRIED AND REVERTED 2026-08-06 (aeff6eb0,
        # reverted in 7e420b62). It would fix a real bug: the iptables path SNATs
        # hostPort *replies* to a fresh source port for LAN peers that are not
        # cluster nodes, which silently kills every consul RPC from sea1-core.
        #
        # What actually happened on the k8s-0 canary: port 53 broke, and only
        # port 53. From a pod on that node, TCP to 1.1.1.1:443 was fine while
        # BOTH udp/53 and tcp/53 to 1.1.1.1 and 8.8.8.8 timed out -- so this is
        # not "UDP egress is broken", it is something intercepting :53. Prime
        # suspect is Talos hostDNS: `enabled: true` still redirects :53 to
        # 169.254.116.108 even with forwardKubeDNSToHost false, and that redirect
        # does not survive the switch to BPF host routing.
        #
        # Both documented prerequisites were already in place and verified when
        # this failed, so they are NOT the missing piece:
        #   - coredns forwards to explicit upstreams, not /etc/resolv.conf
        #     (be3e9133, kept -- it is correct regardless)
        #   - machine.features.hostDNS.forwardKubeDNSToHost: false
        #
        # Next thing to try is hostDNS.enabled: false outright, on one node,
        # with a pod on that node testing dig @1.1.1.1 before anything else.
        # Note bpf.masquerade also flips host routing Legacy -> BPF and makes
        # IPv6 masquerade (upstream BETA) load-bearing for all pod v6 egress.
        enableIPv4Masquerade: true
        enableIPv6Masquerade: true

        # Replaces kube-proxy. k8sServiceHost/Port are KubePrism, not a
        # control-plane address: without kube-proxy the agent cannot resolve the
        # kubernetes Service to reach the API server. Requires the pinned
        # devices above -- KPR refuses to start if it cannot pick one.
        kubeProxyReplacement: true
        k8sServiceHost: localhost
        k8sServicePort: 7445

        # Enforced. Pods selected by a NetworkPolicy get default-deny in the
        # directions it declares; unselected pods are unrestricted. 27 pods are
        # selected, 13 of them ArgoCD's.
        #
        # Enforcement was enabled only after a 40-minute audit-mode window
        # (policyAuditMode=true) across all five nodes returned zero legitimate
        # AUDIT verdicts -- the only hit was a deliberate probe on a disallowed
        # port, which confirmed the mechanism fires.
        #
        # Revert with policyEnforcementMode: never.
        policyEnforcementMode: default
        policyAuditMode: false

        # MANDATORY. The default strips foreign CNI configs including
        # 00-multus.conf, which would drop the LAN interface from every KubeVirt
        # guest. Consequence: flannel's stale conflist is not cleaned up for us.
        # Cilium also ships no CNI reference plugins -- the `bridge` binary the
        # NADs need comes from Talos in /opt/cni/bin.
        cni:
          exclusive: false

        # Talos cannot let Cilium mount cgroups itself.
        cgroup:
          autoMount:
            enabled: false
          hostRoot: /sys/fs/cgroup

        # Per the SideroLabs guide. Not the chart defaults: SYS_MODULE is
        # useless on Talos, and PERFMON/BPF replace SYS_ADMIN rather than
        # supplementing it.
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_RESOURCE

        # Replaces MetalLB in sea1: Cilium does LB IPAM and ARP/NDP itself.
        # Requires kubeProxyReplacement, which is why this could not be done
        # before Phase C. Pools and announcement policy live in lb-ipam.yaml.
        #
        # The rate limit is raised deliberately -- L2 announcements churn
        # coordination leases, and the 5/10 default throttles the agent.
        l2announcements:
          enabled: true
        k8sClientRateLimit:
          qps: 20
          burst: 40

        # Metrics on :9962 (agent) and :9963 (operator). Scraped by
        # VMPodScrape, not the chart's serviceMonitor -- this cluster runs the
        # VictoriaMetrics operator, not prometheus-operator.
        prometheus:
          enabled: true
        operator:
          prometheus:
            enabled: true

        hubble:
          relay:
            enabled: true
          # Flow-derived metrics on :9965. httpV2 carries the label context the
          # upstream Grafana dashboards expect; without it their panels are empty.
          metrics:
            enableOpenMetrics: true
            enabled:
              - dns
              - drop
              - tcp
              - flow
              - port-distribution
              - icmp
              - "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction"
          ui:
            enabled: true
            # Reachable at hubble-sea1 on the tailnet. Stays ClusterIP -- the
            # operator proxies those (cf. shared-db/meilisearch).
            #
            # Hubble UI has NO authentication of its own. Anyone who can reach
            # it sees every flow in the cluster: pod names, namespaces, IPs,
            # ports. Tailnet ACLs are the only control, so scope it there.
            service:
              annotations:
                tailscale.com/expose: "true"
                tailscale.com/hostname: "hubble-sea1"

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - allowEmpty=true
      - ServerSideApply=true
