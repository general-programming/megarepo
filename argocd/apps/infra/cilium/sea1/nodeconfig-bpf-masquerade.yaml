apiVersion: cilium.io/v2
kind: CiliumNodeConfig
metadata:
  name: bpf-masquerade-canary
  namespace: kube-system
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: sea1-k8s-2
  defaults:
    enable-bpf-masquerade: "true"
    # Talos hostDNS pod forwarding is disabled before enabling BPF routing.
    enable-host-legacy-routing: "false"
