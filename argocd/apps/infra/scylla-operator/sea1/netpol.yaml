---
# Egress only; ingress is the apiserver calling the webhook, probes and
# scraping.
#
# No ScyllaClusters exist on either cluster, so today the operator's egress is
# exactly the apiserver and DNS -- the stage-1 sample shows nothing else. When a
# ScyllaCluster is deployed, the operator will need the scylla-manager-agent API
# (10001) on the member pods; extend this policy in the same change that deploys
# it, or the cluster will wedge mid-bootstrap.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: scylla-operator-egress
  namespace: scylla-operator
  labels:
    sea1.policy/tier: infra
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - scylla-operator
          - webhook-server
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # One rule, pinned to 6443: Talos serves the apiserver on the nodes, so the
    # kube-apiserver label rides the node identity and an unported
    # kube-apiserver allow would open every port on the control-plane IPs
    # (kubelet, etcd, apid).
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
