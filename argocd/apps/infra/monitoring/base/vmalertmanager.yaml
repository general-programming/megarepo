---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicaCount: 2
  # /alertmanager holds the notification log and silences. It defaulted to an
  # emptyDir, so every roll dropped active silences and re-notified for alerts
  # already sent. Both files are tiny; 1Gi is the practical minimum.
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: ceph-rbd
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  # Keep the 2 alertmanager replicas on distinct nodes so one node loss can't
  # take out alerting entirely.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: vmalertmanager
  # Discover all VMAlertmanagerConfig resources in this namespace.
  # Empty selector matches all labels.
  # nil configNamespaceSelector = only look in this namespace (monitoring).
  configSelector: {}
  # By default the operator staples `namespace = "monitoring"` onto every route
  # it generates from a VMAlertmanagerConfig, scoping that config to alerts
  # originating in its own namespace. Our configs are cluster-wide receivers,
  # not per-tenant ones, so that matcher meant only alerts labelled
  # namespace=monitoring ever reached Discord or IRM -- everything from argocd,
  # loki, victoriametrics, kubevirt and so on fell through to blackhole with no
  # error anywhere. Routing is filtered by the routes themselves instead.
  disableNamespaceMatcher: true
  # Public routing config lives here in the repo.
  # Private receiver config (webhook URLs) lives in VMAlertmanagerConfig,
  # which references secrets synced from Vault.
  configRawYaml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: blackhole
      group_by: ['alertname', 'cluster', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
    receivers:
      - name: blackhole
