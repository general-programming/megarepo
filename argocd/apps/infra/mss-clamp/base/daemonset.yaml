---
# sea1-k8s-103-0 sits behind a ~1500-MTU path while flannel's v6 VXLAN runs
# jumbo (8930); IPv6 cannot fragment in transit, so TCP segments larger than
# ~1430B toward/from that node's pod subnet blackhole. Clamp TCP MSS on the
# v6 VXLAN egress of every node:
#   - dest fd40:10:244:2::/64  -> clamps SYNs heading to 103-0 pods
#   - src  fd40:10:244:2::/64  -> matches only on 103-0 itself, clamping its
#     outbound SYN/SYN-ACKs
# Inner MTU 1430 - 40 (v6) - 20 (TCP) = MSS 1370.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mss-clamp
spec:
  selector:
    matchLabels:
      app: mss-clamp
  template:
    metadata:
      labels:
        app: mss-clamp
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: clamp
          image: nicolaka/netshoot:latest
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          command:
            - /bin/sh
            - -c
            - |
              set -u
              SUBNET="fd40:10:244:2::/64"
              MSS=1370
              apply() {
                dir="$1"; match="$2"
                ip6tables -t mangle -C POSTROUTING -o flannel-v6.1 "$dir" "$match" \
                  -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss "$MSS" 2>/dev/null || \
                ip6tables -t mangle -A POSTROUTING -o flannel-v6.1 "$dir" "$match" \
                  -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss "$MSS"
              }
              while true; do
                apply -d "$SUBNET"
                apply -s "$SUBNET"
                sleep 60
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
