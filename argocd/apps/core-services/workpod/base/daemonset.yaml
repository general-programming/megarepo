---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: workpod
  namespace: workpod
spec:
  selector:
    matchLabels:
      name: workpod
  template:
    metadata:
      labels:
        name: workpod
    spec:
      tolerations:
        # these tolerations are to have the daemonset runnable on control plane nodes
        # remove them if your control plane nodes should not run pods
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      # Debug shell only; it never needs the kube API.
      automountServiceAccountToken: false
      containers:
      - name: workpod
        image: ubuntu:24.04
        # Just spin & wait forever
        command: [ "/bin/bash", "-c", "--" ]
        args: [ "while true; do sleep 30; done;" ]
        # Still root (it's a debug shell), but no ambient caps or escalation.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
