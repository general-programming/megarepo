---
# coder-workspaces pods run whatever code a developer types into them -- an
# interactive shell with cluster-network reach. This keeps them useful
# (internet, DNS, the coder control plane) while removing lateral reach into
# SEA1.
#
# Deliberately more permissive than the deluge policy: workspaces legitimately
# need to pull from package registries and talk to the coder server. What they
# do not need is the LAN, the node subnet, or the apiserver -- workspaces get a
# projected SA token and kube-root-ca.crt mounted by default, and without the
# entity deny they can talk to the API as that SA.
#
# bogons is deliberately absent from the deny: it contains 100.64.0.0/10, which
# is Tailscale's range, and workspaces plausibly reach tailnet services.
#
# Lives in the coder app because the workspace namespace is coder's; the CNP
# carries its own namespace and the core-services project allows it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: workspace-no-lateral-egress
  namespace: coder-workspaces
  labels:
    sea1.policy/tier: untrusted
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: coder-workspace
  egressDeny:
    - toCIDRSet:
        - cidrGroupRef: sea1-rfc1918
        - cidrGroupRef: sea1-loadbalancers
        - cidrGroupRef: link-local-metadata
    - toEntities:
        - host
        - remote-node
        - kube-apiserver
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Workspace agent phones home to the coder server. This is an endpoint
    # selector, not a CIDR -- in-cluster peers are never matched by CIDR.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: coder
    - toEntities:
        - world
