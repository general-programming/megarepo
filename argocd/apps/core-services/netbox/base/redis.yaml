---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  storageClassName: ceph-rbd-xfs
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-redis
  annotations:
    # Not `auto`: this pod takes one key out of netbox-secrets by secretKeyRef,
    # and naming the secret is the form Reloader is known to honour here (#541).
    secret.reloader.stakater.com/reload: "netbox-secrets"
spec:
  selector:
    matchLabels:
      app: netbox-redis
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: netbox-redis
    spec:
      containers:
      - name: valkey
        image: valkey/valkey:9.0-alpine
        command:
          - valkey-server
          - --appendonly
          - "yes"
          - --requirepass
          - $(REDIS_PASSWORD)
        env:
          # secretKeyRef, not envFrom: envFrom would hand the redis pod NetBox's
          # SECRET_KEY and superuser API token as well.
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: netbox-secrets
                key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: netbox-redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: netbox-redis
  selector:
    app: netbox-redis
  type: ClusterIP
