---
# secret/app/netbox/config holds NetBox's own env-shaped secrets (SECRET_KEY,
# SUPERUSER_API_TOKEN, API_TOKEN_PEPPER, NAPALM_PASSWORD, AUTH_LDAP_BIND_PASSWORD)
# and, as of the redis-auth change, `REDIS_PASSWORD`.
#
# WRITE `REDIS_PASSWORD` BEFORE MERGING. It is consumed twice:
#   1. netbox-redis sets it as --requirepass (base/redis.yaml)
#   2. netbox and netbox-worker authenticate with it, picked up automatically
#      through `envFrom: netbox-secrets` (base/deployment.yaml)
# Without the key the VaultStaticSecret syncs a secret that lacks it and the
# netbox-redis pod fails to start on the missing secretKeyRef
# (CreateContainerConfigError), taking NetBox's queue and cache with it.
#
#   vault kv patch secret/app/netbox/config \
#     REDIS_PASSWORD="$(vault write -field=random_bytes \
#                         sys/tools/random/32 format=hex)"
#
# `kv patch`, NOT `kv put` -- put replaces the whole secret and would delete
# SECRET_KEY, which invalidates every session and stored secret in NetBox.
#
# format=hex so the value cannot contain +/= and needs no quoting thought in the
# valkey-server argv or the env var.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-netbox
spec:
  type: kv-v2
  mount: secret
  path: app/netbox/config
  destination:
    name: netbox-secrets
    create: true
  refreshAfter: 1m
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-netbox-oidc
spec:
  type: kv-v2
  mount: secret
  path: app/netbox/oidc
  destination:
    name: netbox-oidc
    create: true
  refreshAfter: 1m
