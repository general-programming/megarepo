# Seed both Vault paths before the first sync; see ../README.md.
# Key names are fixed by the chart. secretKey must be exactly 16 chars and
# CSRF_KEY exactly 32, or core fails at runtime.
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-harbor
spec:
  type: kv-v2
  mount: secret
  path: app/harbor/config
  destination:
    name: harbor-secrets
    create: true
  refreshAfter: 1m
---
# Registry token signing keypair (tls.key / tls.crt), generated once. Nothing
# renews it; an expired cert breaks docker login with no obvious symptom.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-harbor-token
spec:
  type: kv-v2
  mount: secret
  path: app/harbor/token
  destination:
    name: harbor-token
    create: true
  refreshAfter: 1m
---
# Written by terraform/auth/authentik/app-harbor, not by hand. `tofu apply` must
# run before the first sync or core boots in db_auth mode.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-harbor-oidc
spec:
  type: kv-v2
  mount: secret
  path: app/harbor/oidc
  destination:
    name: harbor-oidc
    create: true
  refreshAfter: 1m
