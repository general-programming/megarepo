# Proxied is mandatory, not a preference: sea1-traefik-k8s is itself a proxied
# record fronting a cloudflared tunnel, so an unproxied CNAME to it resolves to
# an unroutable ULA. Cost: CF's 100MB body cap fails pushes of layers above it.
# Portal, OIDC callback and the registry API all hang off this one host.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/target: "sea1-traefik-k8s.generalprogramming.org"
spec:
  rules:
    - host: hub.generalprogramming.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harbor
                port:
                  number: 80
