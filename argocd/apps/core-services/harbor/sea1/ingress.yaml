# The cloudflared fallback path. DNS ownership lives on ingress-public.yaml
# (the direct path); re-pointing hub at sea1-traefik-k8s + proxied is the
# manual rollback if the direct path is ever down.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: hub.generalprogramming.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harbor
                port:
                  number: 80
