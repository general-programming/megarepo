---
name: go

on:
  push:
    branches: [main]
    paths:
      - "go/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go.yaml"
  pull_request:
    paths:
      - "go/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go.yaml"

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l go/)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./go/...

      - name: go vet
        run: go vet ./go/...

      # Includes the render snapshots under go/pkg/barf/render/testdata; a
      # drifted config render fails here. Regenerate with -update.
      - name: go test
        run: go test ./go/...
