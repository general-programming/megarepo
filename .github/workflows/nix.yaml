---
# Evaluation only. Building the fleet's closures and pushing them to Attic
# happens in-cluster; see argocd/apps/infra/nix-cache-builder.
name: nix

on:
  push:
    branches: [main]
    paths:
      - "nix/**"
      # nix/pkgs/barf.nix builds these; a Go change can break the fleet.
      - "go/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/nix.yaml"
  pull_request:
    paths:
      - "nix/**"
      - "go/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/nix.yaml"

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Evaluate all nixosConfigurations
        run: nix flake check ./nix
