patches:
  - # Raise kubelet max pods from the Talos default of 110. 200 leaves room to
    # absorb a whole node's workload during a drain, and for the bare-metal
    # nodes which have far more RAM than the VMs. Flannel gives each node a
    # /24, so ~250 is the hard ceiling.
    |-
    machine:
      kubelet:
        extraConfig:
          maxPods: 200
  - # IPv6 support
    |-
    cluster:
      network:
        podSubnets:
          - 10.244.0.0/16
          - fd40:10:244::/56
        serviceSubnets:
          - 10.96.0.0/12
          - d40:10:96::/108
