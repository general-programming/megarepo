patches:
  - # Raise kubelet max pods per node from the Talos default of 110 to 135 (+25)
    |-
    machine:
      kubelet:
        extraConfig:
          maxPods: 135
  - # Encrypt system disk with TPM
    |-
    machine:
      systemDiskEncryption:
        ephemeral:
          provider: luks2
          keys:
            - slot: 0
              tpm: {}
        state:
          provider: luks2
          keys:
            - slot: 0
              tpm: {}
  - # IPv6 support
    |-
    cluster:
      network:
        podSubnets:
          - 10.244.0.0/16
          - fd40:10:244::/56
        serviceSubnets:
          - 10.96.0.0/12
          - d40:10:96::/108
  - # Disable NIC tx checksum offload — works around the flannel VXLAN bad-UDP-checksum
    # bug (virtio_net + kernel offload corrupts inner checksums on encapsulated traffic,
    # silently dropping cross-node UDP/DNS). All nodes use ens18 (virtio_net).
    # ref: flannel-io/flannel#1279, siderolabs/talos#8873
    |-
    apiVersion: v1alpha1
    kind: EthernetConfig
    name: ens18
    features:
      tx-checksum-ip-generic: false
