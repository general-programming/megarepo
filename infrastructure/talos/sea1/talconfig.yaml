patches:
  - # DO NOT REMOVE. Cilium is the CNI (argocd/apps/infra/cilium/sea1);
    # dropping this reinstalls flannel under a running Cilium cluster.
    # Cilium also replaces kube-proxy, reaching the API via KubePrism.
    |-
    cluster:
      network:
        cni:
          name: none
      proxy:
        disabled: true
  - # Raise kubelet max pods from the Talos default of 110. 200 absorbs a whole
    # node's workload during a drain. Each node gets one /24, so ~250 is the ceiling.
    |-
    machine:
      kubelet:
        extraConfig:
          maxPods: 200
  - # IPv6 support
    |-
    cluster:
      network:
        podSubnets:
          - 10.244.0.0/16
          - fd40:10:244::/56
        serviceSubnets:
          - 10.96.0.0/12
          - d40:10:96::/108
