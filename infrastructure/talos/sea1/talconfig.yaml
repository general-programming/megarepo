clusterName: sea1
# Metal nodes are control-plane AND worker; without this they come up
# tainted NoSchedule and nothing lands on them.
allowSchedulingOnControlPlanes: true
endpoint: https://kube.sea1.generalprogramming.org:6443
talosVersion: v1.13.7
kubernetesVersion: v1.36.2
additionalMachineCertSans:
  - kube.sea1.generalprogramming.org
nodes:
  # Split per-node for static IPs; DHCPv6 leases churn (Talos remints its DUID each boot).
  # Do NOT re-add ignoreHostname: with DHCP off there is no other hostname source and Talos
  # invents one, which re-registers the node in k8s and leaves a duplicate behind.
  - &k8s-cp
    hostname: sea1-k8s-cp-0
    # allowSchedulingOnControlPlanes is set cluster-wide for the metal nodes,
    # which are control-plane AND worker. These three VM control planes are
    # 8 GiB / 4 vCPU and exist only to hold etcd, so re-assert the taint the
    # flag would otherwise remove. Metal nodes deliberately carry no taint.
    nodeTaints:
      node-role.kubernetes.io/control-plane: ":NoSchedule"
    # VM-ONLY. These moved out of the cluster-level patches when metal
    # nodes were introduced: metal has no TPM available to Talos, and
    # `ens18` does not exist there. Cluster-wide they would collide with
    # the metal nodes' nodeID LUKS keys on slot 0 (talhelper hard-errors:
    # partition "STATE": encryption key slot 0 is already in use).
    patches:
    - &vm-tpm-luks # Encrypt system disk with TPM
      |-
      machine:
        systemDiskEncryption:
          ephemeral:
            provider: luks2
            keys:
              - slot: 0
                tpm: {}
          state:
            provider: luks2
            keys:
              - slot: 0
                tpm: {}
    - &vm-ens18-checksum # Disable NIC tx checksum offload — works around the flannel VXLAN bad-UDP-checksum
      # bug (virtio_net + kernel offload corrupts inner checksums on encapsulated traffic,
      # silently dropping cross-node UDP/DNS). All nodes use ens18 (virtio_net).
      # ref: flannel-io/flannel#1279, siderolabs/talos#8873
      |-
      apiVersion: v1alpha1
      kind: EthernetConfig
      name: ens18
      features:
        tx-checksum-ip-generic: false
    ipAddress: "10.3.2.16"
    installDisk: /dev/sda
    controlPlane: true
    # Public resolvers, deliberately: sea1-core must not be on the boot path,
    # or a cold start deadlocks once it becomes a guest of this cluster. Every
    # name a node resolves while booting is public -- the API endpoint
    # kube.sea1.generalprogramming.org, time.cloudflare.com, discovery.talos.dev
    # and the registries -- and etcd peers by IP, so nothing here needs the
    # internal zones.
    #
    # Internal names still work for pods: CoreDNS routes generalprogramming.org,
    # the NetBox reverse zones and .consul straight to sea1-core
    # (argocd/apps/infra/coredns/sea1). Nothing in this cluster bypasses
    # CoreDNS -- every hostNetwork pod is ClusterFirstWithHostNet or
    # ClusterFirst.
    #
    # Do NOT append sea1-core as an extra entry here. Talos hostDNS forwards
    # with a random upstream policy, and NXDOMAIN is a valid answer that never
    # triggers failover, so mixing an internal-authoritative resolver with a
    # public one makes internal lookups succeed only some of the time.
    nameservers: &k8s-cp-dns
      - 1.1.1.1
      - 1.0.0.1
      - 2606:4700:4700::1111
      - 2606:4700:4700::1001
    networkInterfaces:
      - deviceSelector:
          driver: virtio_net
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.16/23"
          - "2602:fa6d:10:ffff::116/116"   # /116 is the on-link prefix the RA advertises
        routes: &k8s-cp-routes
          - network: "0.0.0.0/0"
            gateway: "10.3.2.1"
          # Standby, not primary. These were never bridged, so accept_ra was
          # never reconciled away and they still hold an RA-learned default --
          # working by inheritance, which is exactly the state the workers were
          # in right up until it silently stopped.
          #
          # The metric matters. At the default 1024 this collides with the RA
          # route and the kernel rejects it EEXIST, which leaves
          # network.RouteSpecController crash-looping on retry -- verified on
          # cp-0. At 2048 it installs alongside as a lower-priority backup: RA
          # keeps winning while it works, and this takes over if it ever stops.
          # The workers do not need the offset, having no RA route to collide
          # with.
          - network: "::/0"
            gateway: "2602:fa6d:10:ffff::1"
            metric: 2048
  - <<: *k8s-cp
    hostname: sea1-k8s-cp-1
    ipAddress: "10.3.2.17"
    nameservers: *k8s-cp-dns
    networkInterfaces:
      - deviceSelector:
          driver: virtio_net
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.17/23"
          - "2602:fa6d:10:ffff::117/116"
        routes: *k8s-cp-routes
  - <<: *k8s-cp
    hostname: sea1-k8s-cp-2
    ipAddress: "10.3.2.18"
    nameservers: *k8s-cp-dns
    networkInterfaces:
      - deviceSelector:
          driver: virtio_net
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.18/23"
          - "2602:fa6d:10:ffff::118/116"
        routes: *k8s-cp-routes
  # nvme passthrough, single nic for v4/v6.
  #
  # These three are bridged: KubeVirt VMs need a LAN-attached secondary
  # network, because sea1-core serves DHCP and DNS and that is broadcast
  # traffic no Service can front. With one NIC per node, the node's own
  # addresses have to move off the NIC and onto br0, and the NIC becomes a
  # bridge port. The wobscale one-off below is deliberately left alone: it
  # sits on a different subnet in a different rack, so a LAN bridge there
  # would attach VMs to the wrong L2 entirely.
  - &k8s-worker-nvme
    hostname: sea1-k8s-0
    patches:
      - *vm-tpm-luks
      - *vm-ens18-checksum
    ipAddress: "10.3.2.10"
    installDisk: /dev/sda
    controlPlane: false
    # Inherited by sea1-k8s-1 and -2 through the merge key. Marks the nodes
    # that actually have br0, so Multus and LAN-attached VMs can select them.
    nodeLabels: &k8s-worker-nvme-labels
      generalprogramming.org/lan-bridge: "true"
    nodeAnnotations:
      # Rook's getNodeInfoFromNode takes the FIRST NodeInternalIP, which is the
      # IPv4 one on these dual-stack nodes. Ceph's public_network is
      # 2602:fa6d:10:ffff::/116, so a mon launched on 10.3.2.x binds an address
      # no other mon can reach and hangs in probing. This annotation overrides
      # the choice.
      network.rook.io/mon-ip: "2602:fa6d:10:ffff::110"
    # Same reasoning as the control planes above: public only, no sea1-core.
    nameservers: &k8s-worker-nvme-dns
      - 1.1.1.1
      - 1.0.0.1
      - 2606:4700:4700::1111
      - 2606:4700:4700::1001
    networkInterfaces:
      # MTU stays on the port too: a bridge cannot exceed its members, so
      # leaving this at the 1500 default would silently cap br0.
      - deviceSelector:
          driver: virtio_net
        dhcp: false
        mtu: 9000
      - interface: br0
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.10/23"
          - "2602:fa6d:10:ffff::110/116"
        routes: &k8s-worker-nvme-routes
          - network: "0.0.0.0/0"
            gateway: "10.3.2.1"
          # The v6 default is declared rather than learned. It used to arrive
          # by RA, which worked only because br0 inherited
          # net.ipv6.conf.default.accept_ra=2 at link-creation time; a later
          # config apply had Talos reconcile the bridge to accept_ra=0 and the
          # learned route aged out, leaving all three workers with no IPv6
          # egress at all (ping6 to any global address: network unreachable).
          # The control planes were unaffected because they are not bridged.
          #
          # Gateway is the router's assigned global address, not its
          # link-local. Both answer on the same MAC (e4:dc:5f:f0:03:a0) and
          # both are flagged router, but ::1 is administratively chosen and so
          # survives a NIC swap or hardware replacement, whereas the link-local
          # is EUI-64 derived from that one MAC and would not. It is also what
          # the rest of the LAN already uses -- sea1-vpn guests and the
          # KubeVirt-hosted freepbx all point at ::1.
          - network: "::/0"
            gateway: "2602:fa6d:10:ffff::1"
        bridge: &k8s-worker-nvme-bridge
          stp:
            enabled: false
          # ethSel0 is the alias talhelper generates for the deviceSelector
          # above. Naming the alias rather than ens18 keeps this portable to
          # bare metal, where the NIC will not be called ens18.
          # NB: bridgePort.master is silently dropped by talhelper v3.1.15 --
          # it generates a memberless bridge. Membership has to be declared
          # from this side.
          interfaces:
            - ethSel0
    userVolumes: &k8s-worker-nvme-volumes
      - name: data
        provisioning:
          # The size guard is load-bearing on bare metal: these hosts carry
          # seven 2TB SSDPE2KX020T8 NVMe reserved for Rook OSDs alongside the
          # 7.68TB HUSMR7676BDP3Y1. A bare transport=="nvme" match would let
          # Talos format an OSD disk.
          diskSelector:
            match: disk.transport == "nvme" && disk.size > 5000000000000u
          minSize: 500GiB
        filesystem:
          type: xfs
  - <<: *k8s-worker-nvme
    hostname: sea1-k8s-1
    ipAddress: "10.3.2.11"
    nodeLabels: *k8s-worker-nvme-labels
    nodeAnnotations:
      # Rook's getNodeInfoFromNode takes the FIRST NodeInternalIP, which is the
      # IPv4 one on these dual-stack nodes. Ceph's public_network is
      # 2602:fa6d:10:ffff::/116, so a mon launched on 10.3.2.x binds an address
      # no other mon can reach and hangs in probing. This annotation overrides
      # the choice.
      network.rook.io/mon-ip: "2602:fa6d:10:ffff::111"
    nameservers: *k8s-worker-nvme-dns
    networkInterfaces:
      - deviceSelector:
          driver: virtio_net
        dhcp: false
        mtu: 9000
      - interface: br0
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.11/23"
          - "2602:fa6d:10:ffff::111/116"
        routes: *k8s-worker-nvme-routes
        bridge: *k8s-worker-nvme-bridge
    userVolumes: *k8s-worker-nvme-volumes
  # ── METAL (hv-2 converted 2026-08-03). Replaced the VM entry of the same
  # ── name; identity reuse keeps labels, affinities, NADs and ceph intact.
  - hostname: sea1-k8s-2
    ipAddress: "10.3.2.12"
    controlPlane: true

    # Both SATA SSDs share a model, so pin by serial or the choice is arbitrary.
    # This value is PER HOST -- hv-0 and hv-1 have different serials.
    installDiskSelector:
      serial: "A0063F20"

    # Secure Boot is off in firmware on these R640s and enrolling the Sidero key
    # needs a console we do not have, so this must be the NON-secureboot image.
    #
    # `machineSpec: {secureboot: false}` at node level DOES NOT WORK -- verified:
    # talhelper still emitted metal-installer-secureboot because the controlPlane
    # block's `secureboot: true` wins (false is indistinguishable from unset).
    # Pinning the image URL explicitly is the only reliable override. talhelper
    # appends `:v1.13.7` from talosVersion.
    talosImageURL: factory.talos.dev/metal-installer/7e1f6386358eb4d68cf5a947ce712411b656380140d20539357e4a9a627b76a5

    schematic:
      # factory.talos.dev schematic 7e1f6386358eb4d68cf5a947ce712411b656380140d20539357e4a9a627b76a5
      customization:
        extraKernelArgs:
          # There is no console at sea1 today. These make iDRAC Serial-over-LAN
          # give real boot output the moment OOB access exists, and cost nothing
          # if it never does. tty0 first keeps VGA primary.
          - console=tty0
          - console=ttyS0,115200n8
        systemExtensions:
          officialExtensions:
            - siderolabs/intel-ucode        # Xeon Gold 6140 -- Intel, not AMD
            - siderolabs/lldpd              # which switch port am I on
            - siderolabs/util-linux-tools   # lsblk/blkid/wipefs: ceph-volume
                                            # nsenters to HOST binaries in the
                                            # OSD-prepare pod and Talos lacks these
            - siderolabs/nvme-cli           # 8 NVMe per host
            - siderolabs/mellanox-mstflint  # CX4 Lx firmware
          # NOT included: qemu-guest-agent (meaningless on metal), mellanox-ofed
          # (mlx5_core is in-kernel), iscsi-tools, mei.

    nodeLabels:
      generalprogramming.org/lan-bridge: "true"

    nodeAnnotations:
      # Rook takes the FIRST NodeInternalIP, which is IPv4 here, while ceph's
      # public_network is 2602:fa6d:10:ffff::/116. Without this a mon binds an
      # address no other mon can reach and hangs in probing.
      network.rook.io/mon-ip: "2602:fa6d:10:ffff::112"

    # Public resolvers only, deliberately excluding sea1-core: nothing in a node's
    # boot path may depend on a service that runs on the cluster.
    nameservers:
      - 1.1.1.1
      - 1.0.0.1

    networkInterfaces:
      # LACP bond to the provider's MLAG pair (s1-a13-102 / s2-a13-102).
      # Members are named literally because they were read off the running host;
      # a driver: mlx5_core deviceSelector would also match exactly these two,
      # but talhelper's handling of a multi-match selector feeding a bond is
      # unverified -- see the REVIEW note at the bottom.
      - interface: bond0
        dhcp: false
        mtu: 9000
        bond:
          interfaces:
            - eno1np0
            - eno2np1
          mode: 802.3ad
          xmitHashPolicy: layer3+4
          lacpRate: slow
          miimon: 100

      # br0 carries the node address and is what Multus/KubeVirt attach LAN
      # guests to. MTU 9000 must appear on the members, the bond and the bridge --
      # a bridge cannot exceed its members.
      - interface: br0
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.12/23"
          - "2602:fa6d:10:ffff::112/116"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.3.2.1"
          # Declared, not learned. RA was only ever working by inherited
          # accept_ra and a later apply reconciled it away, costing all three
          # workers their IPv6 egress. Gateway is the router's administratively
          # chosen global address, not its EUI-64 link-local.
          - network: "::/0"
            gateway: "2602:fa6d:10:ffff::1"
        bridge:
          stp:
            enabled: false
          # NB: bridgePort.master is silently dropped by talhelper v3.1.15 --
          # membership must be declared from this side.
          interfaces:
            - bond0

    userVolumes:
      - name: data
        provisioning:
          # The size guard is what keeps Talos off the seven 2TB OSD drives.
          # Only the 7.68TB HGST qualifies. disk.size is a uint -- the literal
          # needs the u suffix or talhelper rejects the CEL.
          diskSelector:
            match: disk.transport == "nvme" && disk.size > 5000000000000u
          minSize: 500GiB
        filesystem:
          type: xfs

    patches:
      - # TPM-sealed LUKS. hv-2's TPM 2.0 was present but disabled in firmware;
        # enabled via Redfish 2026-08-03 and verified live (/dev/tpm0, iDRAC
        # TrustedModules State=Enabled, fw 1.3.1.0).
        #
        # CONSTRAINT: Talos defaults to pcrs: [7], and PCR 7 measures the Secure
        # Boot state. This seals against SecureBoot=Disabled. Turning Secure Boot
        # ON later changes PCR 7 and the disk STOPS UNSEALING -- the node will not
        # boot. Secure Boot must stay off for the life of this install; revisit
        # only at a reinstall, which re-seals anyway.
        |-
        machine:
          systemDiskEncryption:
            ephemeral:
              provider: luks2
              keys:
                - slot: 0
                  tpm: {}
            state:
              provider: luks2
              keys:
                - slot: 0
                  tpm: {}
      - # Combined CP+worker on a 754 GiB / 72-core box that also runs a 384 GiB
        # KubeVirt guest. Reserve enough that etcd is never starved.
        |-
        machine:
          kubelet:
            extraConfig:
              systemReserved:
                cpu: 2000m
                memory: 4Gi
              kubeReserved:
                cpu: 2000m
                memory: 8Gi
  - hostname: sea1-k8s-103-0
    patches:
      - *vm-tpm-luks
      - *vm-ens18-checksum
    ipAddress: "10.3.6.3"
    installDisk: /dev/sda
    controlPlane: false
    # Keep CloudNativePG databases off this one-off wobscale-rack node.
    nodeLabels:
      generalprogramming.org/no-database: "true"
      generalprogramming.org/no-lan-vip: "true"
      # And KubeVirt guests: this node has no br0, so a LAN-attached VM here
      # would have no way onto the sea1 LAN. The KubeVirt CR keeps
      # virt-handler off any node carrying this, which is what actually makes
      # VMs unschedulable here rather than merely deprefered.
      generalprogramming.org/no-virt: "true"
    nameservers:
      - 10.3.0.3
      - 10.65.67.5
    networkInterfaces:
      - interface: enp6s18
        addresses:
          - "10.3.6.3/27"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.3.6.1"
        dhcp: true
        dhcpOptions:
          ipv4: false
          ipv6: true
    userVolumes:
      - name: data
        provisioning:
          diskSelector:
            match: disk.transport != ''
          minSize: 500GiB
