      op: append
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/qemu-guest-agent
  patches:
    - # Audit policy. Talos ships `rules: [{level: Metadata}]` -- log
      # everything, both stages -- which measured 7.3 GB/day across these three
      # control planes, on the ephemeral partition, with the busiest node
      # holding only six hours before rotation. Measured composition over
      # 14000 events (see docs/k8s-security-review-2026-08.md):
      #
      #   RequestReceived duplicate of every request   47.8%
      #   leases (leader election churn)               38.9% of what remains
      #   argocd app-controller -> applications        10.9%
      #   system:nodes + apiserver read-only           15.5%
      #
      # Dropping those leaves ~17% of the original volume, ~1.2 GB/day, and
      # what survives is the part with security value: secret access, RBAC,
      # exec, and every write by anything that is not a known reconcile loop.
      #
      # Rule order matters -- first match wins. The keep rules come first so a
      # later blanket `None` cannot swallow them: system:nodes does watch
      # secrets, and that must stay logged even though its other reads do not.
      |-
      cluster:
        apiServer:
          auditPolicy:
            apiVersion: audit.k8s.io/v1
            kind: Policy
            # ResponseComplete carries everything these two do, plus the status
            # code. Logging them triples the event count for no added signal.
            omitStages:
              - RequestReceived
              - ResponseStarted
            rules:
              # -- keep: security-relevant, regardless of who does it --
              - level: Metadata
                resources:
                  - group: ""
                    resources: ["secrets", "serviceaccounts/token"]
                  - group: "rbac.authorization.k8s.io"
                  - group: "authentication.k8s.io"
                  - group: "certificates.k8s.io"
              - level: Metadata
                resources:
                  - group: ""
                    resources: ["pods/exec", "pods/attach", "pods/portforward"]
              # -- drop: high-volume, no security value --
              # Leader election. Every controller renews every few seconds.
              - level: None
                resources:
                  - group: "coordination.k8s.io"
                    resources: ["leases"]
              # ArgoCD writes reconcile state into the Application object
              # itself, not a /status subresource, so this cannot be filtered
              # by subresource. Scoped to that one SA: an Application changed
              # by anyone else is still logged.
              - level: None
                users: ["system:serviceaccount:argocd:argocd-application-controller"]
                verbs: ["update", "patch"]
                resources:
                  - group: "argoproj.io"
                    resources: ["applications"]
              # Kubelet and apiserver-internal reads. Their writes still log.
              - level: None
                userGroups: ["system:nodes"]
                verbs: ["get", "list", "watch"]
              - level: None
                users: ["system:apiserver"]
                verbs: ["get", "list", "watch"]
              # -- everything else --
              - level: Metadata
patches:
  - # DO NOT REMOVE. Cilium is the CNI (argocd/apps/infra/cilium/sea1);
    # dropping this reinstalls flannel under a running Cilium cluster.
    # Cilium also replaces kube-proxy, reaching the API via KubePrism.
    |-
    cluster:
      network:
        cni:
          name: none
      proxy:
        disabled: true
  - # Raise kubelet max pods from the Talos default of 110. 200 absorbs a whole
    # node's workload during a drain. Each node gets one /24, so ~250 is the ceiling.
    |-
    machine:
      kubelet:
        extraConfig:
          maxPods: 200
  - # IPv6 support
    |-
    cluster:
      network:
        podSubnets:
          - 10.244.0.0/16
          - fd40:10:244::/56
        serviceSubnets:
          - 10.96.0.0/12
          - d40:10:96::/108

  # Ingress firewall:
  # These nodes carry globally routable GUAs (2602:fa6d:10:ffff::110/111/112)
  # and nothing filters upstream, so every host service was reachable from the
  # public internet -- including ceph-mgr :9283, ceph-exporter :9926, cilium
  # :9962 and consul :8500, all of which answer unauthenticated. Rook runs ceph
  # as hostNetwork, so the ceph daemons bind those GUAs directly.
  #
  # Policy: anything internal (RFC1918, CGNAT/tailnet, ULA, the sea1 GUA /116,
  # fmt2) may reach every host service. The public internet gets only the web
  # ingress path. The default action lives in its own patch at the end so it can
  # be flipped independently of the rules.
  #
  # NOTE: `ingress: block` makes Talos add an unconditional
  #   meta l4proto ipv6-icmp limit rate 5/second accept
  # The 5 is hardcoded in the nftables chain controller and no config field
  # feeds it (siderolabs/talos#11546 is open, nothing shipped). The rule is an
  # `accept` with a limit, so over-budget packets do NOT drop there -- they fall
  # through to the rules below, which is what the icmpv6-ndp-pmtud rule exploits.
  - |-
    apiVersion: v1alpha1
    kind: NetworkRuleConfig
    name: control-plane-apis
    portSelector:
      ports:
        - 6443          # kube-apiserver
        - 50000         # apid -- the talosctl path; losing it loses the cluster
        - 50001         # trustd, node-to-node cert issuance
        - 2379-2380     # etcd peer + client
        - 10250         # kubelet; POD is required or the cadvisor scrape breaks
      protocol: tcp
    ingress:
      - subnet: 10.0.0.0/8
      - subnet: 172.16.0.0/12
      - subnet: 192.168.0.0/16
      - subnet: 100.64.0.0/10
      - subnet: fd00::/8
      - subnet: 2602:fa6d:10:ffff::/116
      - subnet: 2a0d:1a43::/32
  - |-
    apiVersion: v1alpha1
    kind: NetworkRuleConfig
    name: cluster-services-tcp
    portSelector:
      ports:
        - 4240          # cilium health
        - 4244          # hubble peer
        - 9100          # node-exporter via kube-rbac-proxy
        - 9962-9965     # cilium agent/operator/envoy metrics (unauthenticated)
        - 30798         # cilium
        - 3300          # ceph-mon v2
        - 6789          # ceph-mon v1
        - 6800-6900     # ceph osd/mds/mgr; ports shift as daemons restart
        - 9283          # ceph-mgr metrics (unauthenticated)
        - 9926          # ceph-exporter metrics (unauthenticated)
        - 8300-8302     # consul server RPC + serf LAN/WAN
        - 8500          # consul HTTP API (unauthenticated until ACLs land)
        - 8502          # consul gRPC
        - 8600          # consul DNS
      protocol: tcp
    ingress:
      - subnet: 10.0.0.0/8
      - subnet: 172.16.0.0/12
      - subnet: 192.168.0.0/16
      - subnet: 100.64.0.0/10
      - subnet: fd00::/8
      - subnet: 2602:fa6d:10:ffff::/116
      - subnet: 2a0d:1a43::/32
  - |-
    apiVersion: v1alpha1
    kind: NetworkRuleConfig
    name: cluster-services-udp
    portSelector:
      ports:
        - 8301-8302     # consul serf gossip
        - 8600          # consul DNS
        - 2055          # akvorado netflow
        - 4739          # akvorado ipfix
        - 6343          # akvorado sflow
      protocol: udp
    ingress:
      - subnet: 10.0.0.0/8
      - subnet: 172.16.0.0/12
      - subnet: 192.168.0.0/16
      - subnet: 100.64.0.0/10
      - subnet: fd00::/8
      - subnet: 2602:fa6d:10:ffff::/116
      - subnet: 2a0d:1a43::/32
  - # The only deliberately public listener. Traffic for the traefik LB VIP
    # (2602:fa6d:10:ffff::e00) arrives on a node before Cilium translates it, so
    # 80/443 must be open here or every public site behind traefik goes dark.
    # The NodePort range goes with it -- Cilium may or may not hand these to
    # nftables at all (see the hostPort/NodePort caveat in docs/), and a rule
    # that is never consulted is harmless while a missing one is an outage.
    |-
    apiVersion: v1alpha1
    kind: NetworkRuleConfig
    name: public-web-ingress
    portSelector:
      ports:
        - 80
        - 443
        - 30000-32767
      protocol: tcp
    ingress:
      - subnet: 0.0.0.0/0
      - subnet: ::/0
  - |-
    apiVersion: v1alpha1
    kind: NetworkRuleConfig
    name: public-web-ingress-udp
    portSelector:
      ports:
        - 30000-32767
      protocol: udp
    ingress:
      - subnet: 0.0.0.0/0
      - subnet: ::/0
  - # Lifts the generated 5/second ICMPv6 cap for internal sources. Talos'
    # limit rule sits ahead of these, but it only *accepts* within budget, so
    # anything over 5/s falls through to here and is accepted unconditionally.
    #
    # `ports` is mandatory even for icmpv6, and the controller compiles it to a
    # destination-port match at transport offset 2 -- for ICMPv6 those bytes are
    # the checksum, so 1-65535 matches every packet except a checksum of exactly
    # 0x0000 (never produced in practice). Undocumented but stable; re-verify on
    # Talos upgrades with `talosctl get nftableschains`.
    #
    # Scoped to link-local + internal on purpose. NDP is the load that matters
    # (the gateway floods unsolicited NAs to ff02::1 from fe80::e6dc:5fff:fef0:3a0
    # at ~2/s baseline, peaking at the full 5/s budget), and PMTUD Packet-Too-Big
    # for a node-originated flow is already conntrack RELATED and accepted higher
    # up. Leaving ::/0 out keeps public ICMPv6 floods rate-limited.
    |-
    apiVersion: v1alpha1
    kind: NetworkRuleConfig
    name: icmpv6-ndp-pmtud
    portSelector:
      ports:
        - 1-65535
      protocol: icmpv6
    ingress:
      - subnet: fe80::/10
      - subnet: fd00::/8
      - subnet: 2602:fa6d:10:ffff::/116
      - subnet: 2a0d:1a43::/32
  - # Enforcement. Keep this LAST -- with it absent the rules above are inert,
    # which is the safe way to stage a change to them.
    #
    # Talos generates more than what is written above: it always accepts
    # established/related, drops invalid, permits lo/siderolink/kubespan, and
    # auto-allows the pod and service subnets for native-routing CNIs. Node
    # egress and pod->node traffic therefore need no rules of their own.
    #
    # Verified on the ingress chain at priority -140, ahead of the DNAT hook at
    # -110, so Cilium's BPF does not bypass it. Bridged KubeVirt guests are
    # unaffected -- their traffic never enters the host input chain.
    |-
    apiVersion: v1alpha1
    kind: NetworkDefaultActionConfig
    ingress: block
