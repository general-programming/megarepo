clusterName: sea1
endpoint: https://kube.sea1.generalprogramming.org:6443
talosVersion: v1.13.7
kubernetesVersion: v1.36.2
additionalMachineCertSans:
  - kube.sea1.generalprogramming.org
nodes:
  # Split per-node for static IPs; DHCPv6 leases churn (Talos remints its DUID each boot).
  # Do NOT re-add ignoreHostname: with DHCP off there is no other hostname source and Talos
  # invents one, which re-registers the node in k8s and leaves a duplicate behind.
  - &k8s-cp
    hostname: sea1-k8s-cp-0
    ipAddress: "10.3.2.16"
    installDisk: /dev/sda
    controlPlane: true
    # Public resolvers, deliberately: sea1-core must not be on the boot path,
    # or a cold start deadlocks once it becomes a guest of this cluster. Every
    # name a node resolves while booting is public -- the API endpoint
    # kube.sea1.generalprogramming.org, time.cloudflare.com, discovery.talos.dev
    # and the registries -- and etcd peers by IP, so nothing here needs the
    # internal zones.
    #
    # Internal names still work for pods: CoreDNS routes generalprogramming.org,
    # the NetBox reverse zones and .consul straight to sea1-core
    # (argocd/apps/infra/coredns/sea1). Nothing in this cluster bypasses
    # CoreDNS -- every hostNetwork pod is ClusterFirstWithHostNet or
    # ClusterFirst.
    #
    # Do NOT append sea1-core as an extra entry here. Talos hostDNS forwards
    # with a random upstream policy, and NXDOMAIN is a valid answer that never
    # triggers failover, so mixing an internal-authoritative resolver with a
    # public one makes internal lookups succeed only some of the time.
    nameservers: &k8s-cp-dns
      - 1.1.1.1
      - 1.0.0.1
      - 2606:4700:4700::1111
      - 2606:4700:4700::1001
    networkInterfaces:
      - deviceSelector:
          driver: virtio_net
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.16/23"
          - "2602:fa6d:10:ffff::116/116"   # /116 is the on-link prefix the RA advertises
        routes: &k8s-cp-routes
          - network: "0.0.0.0/0"
            gateway: "10.3.2.1"
  - <<: *k8s-cp
    hostname: sea1-k8s-cp-1
    ipAddress: "10.3.2.17"
    nameservers: *k8s-cp-dns
    networkInterfaces:
      - deviceSelector:
          driver: virtio_net
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.17/23"
          - "2602:fa6d:10:ffff::117/116"
        routes: *k8s-cp-routes
  - <<: *k8s-cp
    hostname: sea1-k8s-cp-2
    ipAddress: "10.3.2.18"
    nameservers: *k8s-cp-dns
    networkInterfaces:
      - deviceSelector:
          driver: virtio_net
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.18/23"
          - "2602:fa6d:10:ffff::118/116"
        routes: *k8s-cp-routes
  # nvme passthrough, single nic for v4/v6.
  #
  # These three are bridged: KubeVirt VMs need a LAN-attached secondary
  # network, because sea1-core serves DHCP and DNS and that is broadcast
  # traffic no Service can front. With one NIC per node, the node's own
  # addresses have to move off the NIC and onto br0, and the NIC becomes a
  # bridge port. The wobscale one-off below is deliberately left alone: it
  # sits on a different subnet in a different rack, so a LAN bridge there
  # would attach VMs to the wrong L2 entirely.
  - &k8s-worker-nvme
    hostname: sea1-k8s-0
    ipAddress: "10.3.2.10"
    installDisk: /dev/sda
    controlPlane: false
    # Inherited by sea1-k8s-1 and -2 through the merge key. Marks the nodes
    # that actually have br0, so Multus and LAN-attached VMs can select them.
    nodeLabels: &k8s-worker-nvme-labels
      generalprogramming.org/lan-bridge: "true"
    # Same reasoning as the control planes above: public only, no sea1-core.
    nameservers: &k8s-worker-nvme-dns
      - 1.1.1.1
      - 1.0.0.1
      - 2606:4700:4700::1111
      - 2606:4700:4700::1001
    networkInterfaces:
      # MTU stays on the port too: a bridge cannot exceed its members, so
      # leaving this at the 1500 default would silently cap br0.
      - deviceSelector:
          driver: virtio_net
        dhcp: false
        mtu: 9000
      - interface: br0
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.10/23"
          - "2602:fa6d:10:ffff::110/116"
        routes: &k8s-worker-nvme-routes
          - network: "0.0.0.0/0"
            gateway: "10.3.2.1"
          # The v6 default is declared rather than learned. It used to arrive
          # by RA, which worked only because br0 inherited
          # net.ipv6.conf.default.accept_ra=2 at link-creation time; a later
          # config apply had Talos reconcile the bridge to accept_ra=0 and the
          # learned route aged out, leaving all three workers with no IPv6
          # egress at all (ping6 to any global address: network unreachable).
          # The control planes were unaffected because they are not bridged.
          #
          # Link-local gateway is the router's EUI-64 from MAC e4:dc:5f:f0:03:a0,
          # scoped to br0 by living under this interface. It is hardcoded in the
          # same way 10.3.2.1 is, and breaks in the same way if that router is
          # replaced.
          - network: "::/0"
            gateway: "fe80::e6dc:5fff:fef0:3a0"
        bridge: &k8s-worker-nvme-bridge
          stp:
            enabled: false
          # ethSel0 is the alias talhelper generates for the deviceSelector
          # above. Naming the alias rather than ens18 keeps this portable to
          # bare metal, where the NIC will not be called ens18.
          # NB: bridgePort.master is silently dropped by talhelper v3.1.15 --
          # it generates a memberless bridge. Membership has to be declared
          # from this side.
          interfaces:
            - ethSel0
    userVolumes: &k8s-worker-nvme-volumes
      - name: data
        provisioning:
          diskSelector:
            match: disk.transport == "nvme"
          minSize: 50GiB
        filesystem:
          type: xfs
  - <<: *k8s-worker-nvme
    hostname: sea1-k8s-1
    ipAddress: "10.3.2.11"
    nodeLabels: *k8s-worker-nvme-labels
    nameservers: *k8s-worker-nvme-dns
    networkInterfaces:
      - deviceSelector:
          driver: virtio_net
        dhcp: false
        mtu: 9000
      - interface: br0
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.11/23"
          - "2602:fa6d:10:ffff::111/116"
        routes: *k8s-worker-nvme-routes
        bridge: *k8s-worker-nvme-bridge
    userVolumes: *k8s-worker-nvme-volumes
  - <<: *k8s-worker-nvme
    hostname: sea1-k8s-2
    ipAddress: "10.3.2.12"
    nodeLabels: *k8s-worker-nvme-labels
    nameservers: *k8s-worker-nvme-dns
    networkInterfaces:
      - deviceSelector:
          driver: virtio_net
        dhcp: false
        mtu: 9000
      - interface: br0
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.12/23"
          - "2602:fa6d:10:ffff::112/116"
        routes: *k8s-worker-nvme-routes
        bridge: *k8s-worker-nvme-bridge
    userVolumes: *k8s-worker-nvme-volumes
  # wobscale rack, literally a oneoff. zfs disk, dual nic for v4/v6
  - hostname: sea1-k8s-103-0
    ipAddress: "10.3.6.3"
    installDisk: /dev/sda
    controlPlane: false
    # Keep CloudNativePG databases off this one-off wobscale-rack node.
    nodeLabels:
      generalprogramming.org/no-database: "true"
      generalprogramming.org/no-lan-vip: "true"
      # And KubeVirt guests: this node has no br0, so a LAN-attached VM here
      # would have no way onto the sea1 LAN. The KubeVirt CR keeps
      # virt-handler off any node carrying this, which is what actually makes
      # VMs unschedulable here rather than merely deprefered.
      generalprogramming.org/no-virt: "true"
    nameservers:
      - 10.3.0.3
      - 10.65.67.5
    networkInterfaces:
      - interface: enp6s18
        addresses:
          - "10.3.6.3/27"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.3.6.1"
        dhcp: true
        dhcpOptions:
          ipv4: false
          ipv6: true
    userVolumes:
      - name: data
        provisioning:
          diskSelector:
            match: disk.transport != ''
          minSize: 500GiB
