clusterName: sea1
# Metal nodes are control-plane AND worker; without this they come up
# tainted NoSchedule and nothing lands on them.
allowSchedulingOnControlPlanes: true
endpoint: https://kube.sea1.generalprogramming.org:6443
talosVersion: v1.13.7
kubernetesVersion: v1.36.2
additionalMachineCertSans:
  - kube.sea1.generalprogramming.org
nodes:
  # Split per-node for static IPs; DHCPv6 leases churn (Talos remints its DUID each boot).
  # Do NOT re-add ignoreHostname: with DHCP off there is no other hostname source and Talos
  # invents one, which re-registers the node in k8s and leaves a duplicate behind.
  # METAL (hv-0 converted 2026-08-06). The LAST Proxmox host. Replaced the
  # sea1-k8s-0 VM entry AND absorbed sea1-k8s-cp-0's control-plane role, so
  # every node in this cluster is now bare metal and no VM control planes
  # remain. The vm-tpm-luks patch went with them: it was VM-only.
  - hostname: sea1-k8s-0
    ipAddress: "10.3.2.10"
    controlPlane: true

    # Pin by WWID, not serial -- behind megaraid_sas Talos reports an EMPTY
    # serial for both SATA SSDs. Verified on hv-0 2026-08-06: sda is
    # A0070D8D, sdb is A0062F31, and both are halves of the live rpool mirror.
    installDiskSelector:
      wwid: "naa.5001173100a5f280"

    # Secure Boot is off in firmware (mokutil: SecureBoot disabled), so this
    # must be the NON-secureboot image. Node-level machineSpec.secureboot is
    # silently ignored; pinning the URL is the only reliable override.
    talosImageURL: factory.talos.dev/metal-installer/7e1f6386358eb4d68cf5a947ce712411b656380140d20539357e4a9a627b76a5

    schematic:
      customization:
        extraKernelArgs:
          - console=tty0
          - console=ttyS0,115200n8
        systemExtensions:
          officialExtensions:
            - siderolabs/intel-ucode
            - siderolabs/lldpd
            - siderolabs/util-linux-tools
            - siderolabs/nvme-cli
            - siderolabs/mellanox-mstflint

    nodeLabels:
      generalprogramming.org/lan-bridge: "true"

    nodeAnnotations:
      network.rook.io/mon-ip: "2602:fa6d:10:ffff::110"

    nameservers:
      - 1.1.1.1
      - 1.0.0.1

    networkInterfaces:
      # Read off the running host: eno1np0 98:03:9b:6a:7f:b2 / eno2np1 ...:b3.
      - interface: bond0
        dhcp: false
        mtu: 9000
        bond:
          interfaces:
            - eno1np0
            - eno2np1
          mode: 802.3ad
          xmitHashPolicy: layer3+4
          lacpRate: slow
          miimon: 100

      - interface: br0
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.10/23"
          - "2602:fa6d:10:ffff::110/116"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.3.2.1"
            # See sea1-core: 10.3.2.1 drops oversized DF packets without
            # returning frag-needed, so jumbo egress black-holes.
            mtu: 1500
          - network: "::/0"
            gateway: "2602:fa6d:10:ffff::1"
        bridge:
          stp:
            enabled: false
          interfaces:
            - bond0

    # Enabled as the deliberate SECOND apply, after the node was Ready and its
    # OSDs adopted.
    #
    # READ THIS BEFORE CHANGING diskSelector -- IT IS NOT WHAT PICKS THE DISK.
    # Talos matches a userVolume by its LOCATOR (partition_label == "u-data")
    # first; diskSelector only chooses where to PROVISION when no partition
    # already carries the label. nvme7n1p1 on the SN200 still has it from when
    # that drive was passed through to the sea1-k8s-0 VM, so Talos adopts it
    # in place -- which is exactly what we want here, because two local-path
    # PVs pinned to this node live on it: shared-timescaledb-7 (the timescale
    # PRIMARY) and storage-mariadb-librenms-0. Without it they sit Pending.
    #
    # The selector names sdb on purpose, as the safe fallback: if that u-data
    # partition ever disappears, Talos provisions a fresh volume on a SATA SSD
    # rather than repartitioning the SN200, which is what latched hv-2. The
    # discard-refusal udev rule below is verified applying here
    # (discard_max_bytes = 0) and is what makes living on this drive tolerable.
    userVolumes:
      - name: data
        provisioning:
          diskSelector:
            match: disk.wwid == "naa.5001173100a2d12c"
          minSize: 500GiB
        filesystem:
          type: xfs

    patches:
      - # lldpd is an extension SERVICE; with no ExtensionServiceConfig it
        # blocks startAllServices and Talos never leaves stage=booting.
        |-
        apiVersion: v1alpha1
        kind: ExtensionServiceConfig
        name: lldpd
        configFiles:
          - content: |-
              configure lldp portidsubtype ifname
              configure system description "Talos metal node"
            mountPath: /usr/local/etc/lldpd/lldpd.conf
      - # nodeID LUKS, NOT tpm -- hv-0 has a working TPM (/dev/tpm0) but Talos
        # seals to PCR 11, which systemd-stub only measures under Secure Boot.
        |-
        machine:
          systemDiskEncryption:
            ephemeral:
              provider: luks2
              keys:
                - slot: 0
                  nodeID: {}
            state:
              provider: luks2
              keys:
                - slot: 0
                  nodeID: {}
      - |-
        machine:
          kubelet:
            extraConfig:
              systemReserved:
                cpu: 2000m
                memory: 4Gi
              kubeReserved:
                cpu: 2000m
                memory: 8Gi
      - # Refuse DISCARD on the 7.68T HGST SN200 at b2:00.0. It is vfio-pci
        # today (passed to the k8s-0 VM) and becomes a normal NVMe on metal,
        # so this rule must be in place from first boot.
        |-
        machine:
          udev:
            rules:
              - ACTION=="add|change", SUBSYSTEM=="block", KERNEL=="nvme*", ATTRS{model}=="HUSMR7676BDP3Y1*", ATTR{queue/discard_max_bytes}="0"
  # METAL (hv-1 converted 2026-08-05). Replaced the VM entry of the same
  # name AND absorbed sea1-k8s-cp-1's control-plane role.
  - hostname: sea1-k8s-1
    ipAddress: "10.3.2.11"
    controlPlane: true

    # Pin by WWID, NOT serial -- behind the megaraid_sas HBA Talos reports an
    # EMPTY serial for both SATA SSDs, so a serial selector matches nothing and
    # the install picks a disk itself. Device names are not stable either.
    # This value is PER HOST; verified on hv-1 2026-08-05.
    installDiskSelector:
      wwid: "naa.5001173100a329d8"

    # Non-secureboot image: Secure Boot is off in firmware and enrolling the
    # Sidero key needs a console we do not have. Node-level
    # `machineSpec: {secureboot: false}` is silently ignored -- the controlPlane
    # block's `secureboot: true` wins -- so the URL must be pinned explicitly.
    talosImageURL: factory.talos.dev/metal-installer/7e1f6386358eb4d68cf5a947ce712411b656380140d20539357e4a9a627b76a5

    schematic:
      # Same schematic as sea1-k8s-2 -- same chassis, same extensions.
      customization:
        extraKernelArgs:
          - console=tty0
          - console=ttyS0,115200n8
        systemExtensions:
          officialExtensions:
            - siderolabs/intel-ucode
            - siderolabs/lldpd
            - siderolabs/util-linux-tools
            - siderolabs/nvme-cli
            - siderolabs/mellanox-mstflint

    nodeLabels:
      generalprogramming.org/lan-bridge: "true"

    nodeAnnotations:
      # Rook takes the FIRST NodeInternalIP, which is IPv4 here, while ceph's
      # public_network is 2602:fa6d:10:ffff::/116. Without this a mon binds an
      # address no other mon can reach and hangs in probing.
      network.rook.io/mon-ip: "2602:fa6d:10:ffff::111"

    nameservers:
      - 1.1.1.1
      - 1.0.0.1

    networkInterfaces:
      # LACP bond to the provider's MLAG pair. Members named literally because
      # they were read off the running host: eno1np0 b8:ce:f6:43:f7:be,
      # eno2np1 b8:ce:f6:43:f7:bf, both mlx5_core, OVS bond_mode balance-tcp
      # with lacp_status negotiated (== 802.3ad + layer3+4).
      - interface: bond0
        dhcp: false
        mtu: 9000
        bond:
          interfaces:
            - eno1np0
            - eno2np1
          mode: 802.3ad
          xmitHashPolicy: layer3+4
          lacpRate: slow
          miimon: 100

      # br0 carries the node address and is what Multus/KubeVirt attach LAN
      # guests to. MTU 9000 must appear on the members, the bond and the bridge.
      - interface: br0
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.11/23"
          - "2602:fa6d:10:ffff::111/116"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.3.2.1"
            # Cap only what leaves via the gateway; the on-link LAN route keeps
            # the interface MTU so ceph stays jumbo. Both sites run jumbo and
            # 10.3.2.1 drops oversized DF packets without returning ICMP
            # frag-needed, so PMTU discovery never learns -- HTTPS to our own
            # IPv4 services black-holes. See sea1-core for the full writeup.
            mtu: 1500
          # Declared, not learned. Gateway is the router's administratively
          # chosen global address, not its EUI-64 link-local.
          - network: "::/0"
            gateway: "2602:fa6d:10:ffff::1"
        bridge:
          stp:
            enabled: false
          # NB: bridgePort.master is silently dropped by talhelper v3.1.15 --
          # membership must be declared from this side.
          interfaces:
            - bond0

    # Enabled 2026-08-05 as a deliberate SECOND apply, after the node was Ready
    # and all 7 OSDs were adopted. Held back from first boot because sdb was
    # then the surviving half of the rpool mirror and hv-1's only rollback.
    #
    # READ THIS BEFORE CHANGING diskSelector -- IT IS NOT WHAT PICKS THE DISK.
    #
    # This volume is LIVE ON THE SN200 (nvme7n1p2), not on sdb, and the selector
    # below did not decide that. Talos matches a userVolume by its LOCATOR
    # (volume.partition_label == "u-data") first; diskSelector only chooses
    # where to PROVISION when no existing partition already carries the label.
    # nvme7n1p2 still had the u-data PARTLABEL from when this disk was passed
    # through to the sea1-k8s-1 VM, so Talos adopted it in place -- preserving
    # the old contents, and never looking at sdb. Editing the selector alone
    # will NOT move the volume.
    #
    # Accepted deliberately (2026-08-05): the data came back intact and
    # storage-mariadb-librenms-1 -- a local-path PV pinned by node affinity to
    # this node, backed by /var/mnt/data -- rejoined Galera with no SST.
    #
    # The risk being accepted: this is the drive that latched on hv-2 on
    # 2026-08-04, reset-looping every ~5s and taking that node NotReady with 6
    # OSDs down, DESPITE discard suppression. The udev rule below (which forces
    # discard_max_bytes=0, verified 0 on this host) is the only thing making it
    # survivable. If this node ever goes NotReady with nvme7 resetting, this
    # volume is why.
    #
    # BREAKGLASS -- move the volume to sdb (currently an empty 1.9T GPT):
    #   1. Clear the u-data PARTLABEL on nvme7n1p2, or the locator keeps
    #      winning. With discard_max_bytes=0 a fast wipe falls back to zeroing
    #      head/tail rather than issuing a 7.7T TRIM, so this is safe NOW in a
    #      way it was not before the udev rule existed.
    #   2. Swap the diskSelector below for the sdb WWID and re-apply.
    #   3. Accept that librenms-1's PV comes back empty and Galera SSTs from the
    #      other two members.
    # Pin by WWID, not serial: behind megaraid_sas both SATA SSDs report an
    # EMPTY serial, sda/sdb ordering is not stable, and both are the same
    # SDLF1CRR-019T-1H model.
    #     diskSelector:
    #       match: disk.wwid == "naa.5001173100a7d5cc"   # sdb
    #
    # Rook cannot claim either disk: its deviceFilter is ^nvme[0-6]n1$.
    userVolumes:
      - name: data
        provisioning:
          diskSelector:
            match: disk.wwid == "naa.5001173100a7d5cc"
          minSize: 500GiB
        filesystem:
          type: xfs

    patches:
      - # lldpd is an extension SERVICE, unlike the other extensions above. With
        # no ExtensionServiceConfig it sits in "Waiting for extension service
        # config" forever, blocking the startAllServices boot task -- the node
        # runs fine and reports Ready to Kubernetes while Talos never leaves
        # stage=booting. `talosctl upgrade` gates on stage=running, so this is
        # not cosmetic.
        |-
        apiVersion: v1alpha1
        kind: ExtensionServiceConfig
        name: lldpd
        configFiles:
          - content: |-
              configure lldp portidsubtype ifname
              configure system description "Talos metal node"
            mountPath: /usr/local/etc/lldpd/lldpd.conf
      - # nodeID LUKS, NOT tpm -- even though hv-1's TPM 2.0 works (/dev/tpm0,
        # tpm_version_major 2). Talos seals against PCR 11, the UKI measurement
        # made by systemd-stub, and that only happens under Secure Boot. With
        # Secure Boot off the node fails at boot with "PCR 11 not available" and
        # leaves a HALF-FORMED LUKS header behind, recoverable only via
        # `talosctl reset --system-labels-to-wipe EPHEMERAL`. Do not "fix" this
        # by enabling tpm without also enrolling Secure Boot keys.
        |-
        machine:
          systemDiskEncryption:
            ephemeral:
              provider: luks2
              keys:
                - slot: 0
                  nodeID: {}
            state:
              provider: luks2
              keys:
                - slot: 0
                  nodeID: {}
      - # Combined CP+worker on a box that also hosts KubeVirt guests. Reserve
        # enough that etcd is never starved.
        |-
        machine:
          kubelet:
            extraConfig:
              systemReserved:
                cpu: 2000m
                memory: 4Gi
              kubeReserved:
                cpu: 2000m
                memory: 8Gi
      - # Refuse DISCARD on the 7.68T HGST SN200 at b2:00.0.
        #
        # A large deallocate races the drive's L2P journal flush and drops it
        # into "Post Crash Startup" -- no namespace, kernel reset loop, udevd's
        # queue never drains and KUBELET NEVER STARTS. WD errata
        # OM-6588/6836/6850/7044; see docs/sn200-firmware-re.md.
        #
        # Matched on MODEL, never on kernel name: nvmeN numbering is not stable
        # and a KERNEL=="nvme7n1" rule could land on a ceph OSD after a reorder.
        #
        # This host's SN200 is on KNGND112 with discard_max_bytes at
        # 2199023255040 -- it has been live and unprotected inside the k8s-1 VM
        # all along. It is vfio-pci bound today and becomes a normal NVMe the
        # moment VM 109 is gone, so this rule must be in place from first boot.
        |-
        machine:
          udev:
            rules:
              - ACTION=="add|change", SUBSYSTEM=="block", KERNEL=="nvme*", ATTRS{model}=="HUSMR7676BDP3Y1*", ATTR{queue/discard_max_bytes}="0"
  # METAL (hv-2 converted 2026-08-03). Replaced the VM entry of the same
  # name; identity reuse keeps labels, affinities, NADs and ceph intact.
  - hostname: sea1-k8s-2
    ipAddress: "10.3.2.12"
    controlPlane: true

    # Both SATA SSDs share a model, so the choice is otherwise arbitrary.
    #
    # Pin by WWID, NOT serial: behind the megaraid_sas HBA Talos reports an
    # EMPTY serial for both (`talosctl get disks` SERIAL column is blank), so
    # any serial selector matches nothing and the install falls back to picking
    # a disk itself. The udev-visible ID_SERIAL_SHORT under Proxmox (A0063F20)
    # is not what Talos sees. Device names are not stable either -- this disk
    # is sda under Proxmox and sdb under Talos.
    # This value is PER HOST.
    installDiskSelector:
      wwid: "naa.5001173100a30ce8"

    # Secure Boot is off in firmware on these R640s and enrolling the Sidero key
    # needs a console we do not have, so this must be the NON-secureboot image.
    #
    # `machineSpec: {secureboot: false}` at node level DOES NOT WORK -- verified:
    # talhelper still emitted metal-installer-secureboot because the controlPlane
    # block's `secureboot: true` wins (false is indistinguishable from unset).
    # Pinning the image URL explicitly is the only reliable override. talhelper
    # appends `:v1.13.7` from talosVersion.
    talosImageURL: factory.talos.dev/metal-installer/7e1f6386358eb4d68cf5a947ce712411b656380140d20539357e4a9a627b76a5

    schematic:
      # factory.talos.dev schematic 7e1f6386358eb4d68cf5a947ce712411b656380140d20539357e4a9a627b76a5
      customization:
        extraKernelArgs:
          # There is no console at sea1 today. These make iDRAC Serial-over-LAN
          # give real boot output the moment OOB access exists, and cost nothing
          # if it never does. tty0 first keeps VGA primary.
          - console=tty0
          - console=ttyS0,115200n8
        systemExtensions:
          officialExtensions:
            - siderolabs/intel-ucode        # Xeon Gold 6140 -- Intel, not AMD
            - siderolabs/lldpd              # which switch port am I on
            - siderolabs/util-linux-tools   # lsblk/blkid/wipefs: ceph-volume
                                            # nsenters to HOST binaries in the
                                            # OSD-prepare pod and Talos lacks these
            - siderolabs/nvme-cli           # 8 NVMe per host
            - siderolabs/mellanox-mstflint  # CX4 Lx firmware
          # NOT included: qemu-guest-agent (meaningless on metal), mellanox-ofed
          # (mlx5_core is in-kernel), iscsi-tools, mei.

    nodeLabels:
      generalprogramming.org/lan-bridge: "true"

    nodeAnnotations:
      # Rook takes the FIRST NodeInternalIP, which is IPv4 here, while ceph's
      # public_network is 2602:fa6d:10:ffff::/116. Without this a mon binds an
      # address no other mon can reach and hangs in probing.
      network.rook.io/mon-ip: "2602:fa6d:10:ffff::112"

    # Public resolvers only, deliberately excluding sea1-core: nothing in a node's
    # boot path may depend on a service that runs on the cluster.
    nameservers:
      - 1.1.1.1
      - 1.0.0.1

    networkInterfaces:
      # LACP bond to the provider's MLAG pair (s1-a13-102 / s2-a13-102).
      # Members are named literally because they were read off the running host;
      # a driver: mlx5_core deviceSelector would also match exactly these two,
      # but talhelper's handling of a multi-match selector feeding a bond is
      # unverified -- see the REVIEW note at the bottom.
      - interface: bond0
        dhcp: false
        mtu: 9000
        bond:
          interfaces:
            - eno1np0
            - eno2np1
          mode: 802.3ad
          xmitHashPolicy: layer3+4
          lacpRate: slow
          miimon: 100

      # br0 carries the node address and is what Multus/KubeVirt attach LAN
      # guests to. MTU 9000 must appear on the members, the bond and the bridge --
      # a bridge cannot exceed its members.
      - interface: br0
        dhcp: false
        mtu: 9000
        addresses:
          - "10.3.2.12/23"
          - "2602:fa6d:10:ffff::112/116"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.3.2.1"
            # Cap only what leaves via the gateway; the on-link LAN route keeps
            # the interface MTU so ceph stays jumbo. Both sites run jumbo and
            # 10.3.2.1 drops oversized DF packets without returning ICMP
            # frag-needed, so PMTU discovery never learns -- HTTPS to our own
            # IPv4 services black-holes. See sea1-core for the full writeup.
            mtu: 1500
          # Declared, not learned. RA was only ever working by inherited
          # accept_ra and a later apply reconciled it away, costing all three
          # workers their IPv6 egress. Gateway is the router's administratively
          # chosen global address, not its EUI-64 link-local.
          - network: "::/0"
            gateway: "2602:fa6d:10:ffff::1"
        bridge:
          stp:
            enabled: false
          # NB: bridgePort.master is silently dropped by talhelper v3.1.15 --
          # membership must be declared from this side.
          interfaces:
            - bond0

    # RE-ENABLED 2026-08-03, but ONLY because the no-discard udev rule below is
    # in place. The two belong together -- never enable this volume without it.
    #
    # This selects the 7.68T HGST SN200, which has a firmware bug where a large
    # deallocate races the L2P journal flush and drops the drive into "Post
    # Crash Startup": no namespace, kernel reset loop, udevd's queue never
    # drains, and kubelet never starts. Formatting this volume issues a
    # whole-device TRIM, which is exactly the trigger. WD errata
    # OM-6588/6836/6850/7044; full teardown in docs/sn200-firmware-re.md.
    #
    # Proven on the host before enabling: with discard_max_bytes forced to 0,
    # partitioning + mkfs.xfs + a 512 MiB write + remount + md5 verify all ran
    # with ZERO controller resets. mkfs took 1s instead of wedging the drive.
    #
    # MOVED OFF THE SN200 2026-08-04. This volume now lives on the second SATA
    # SSD (sdb), not the 7.68T HGST.
    #
    # The SN200 latched again and reset-looped every ~5s ("resetting controller
    # due to persistent internal error"), which took the whole node NotReady --
    # container runtime down, 6 OSDs down, 31% of objects degraded. There is no
    # proven way to read data back off a latched SN200, so it is not a place to
    # put a volume at all, discard suppression notwithstanding.
    #
    # Pinned by WWID, matching the install-disk convention above: behind
    # megaraid_sas both SATA SSDs report an EMPTY serial, and sda/sdb ordering
    # is not stable across boots. sdb is the same 1.9T SDLF1CRR-019T-1H model as
    # the system disk, so model alone does not discriminate -- the WWID does.
    #
    # sdb carried hv-2's old Proxmox install (GPT + EFI + a 1.9T ZFS rpool,
    # label 0927ff21a4ca1c70). hv-2 no longer exists; the pool must be wiped
    # before Talos will provision here, and Rook cannot touch it because its
    # deviceFilter is ^nvme[0-6]n1$.
    userVolumes:
      - name: data
        provisioning:
          diskSelector:
            match: disk.wwid == "naa.50011731008dd9ec"
          minSize: 500GiB
        filesystem:
          type: xfs

    patches:
      - # lldpd is an extension SERVICE, unlike every other extension in the
        # schematic above (ucode/util-linux-tools/nvme-cli/mstflint are just
        # files). An extension service with no ExtensionServiceConfig sits in
        # "Waiting for extension service config" forever, which blocks the
        # startAllServices boot task -- so the node runs fine and reports Ready
        # to Kubernetes while Talos itself never leaves stage=booting.
        #
        # That is not cosmetic: `talosctl upgrade` and other operations gate on
        # the machine reaching stage=running. The VM nodes are unaffected
        # because they do not carry this extension.
        |-
        apiVersion: v1alpha1
        kind: ExtensionServiceConfig
        name: lldpd
        configFiles:
          - content: |-
              configure lldp portidsubtype ifname
              configure system description "Talos metal node"
            mountPath: /usr/local/etc/lldpd/lldpd.conf
      - # nodeID LUKS, NOT tpm. hv-2's TPM 2.0 is present and enabled (verified
        # live: /dev/tpm0, iDRAC TrustedModules State=Enabled, fw 1.3.1.0) --
        # but TPM sealing still does not work here.
        #
        # Talos seals against PCR 11, which is the UKI measurement made by
        # systemd-stub, and that measurement only happens under Secure Boot.
        # With Secure Boot off the node fails at boot with "PCR 11 not
        # available" and leaves a HALF-FORMED LUKS header behind -- recovering
        # from that needs `talosctl reset --system-labels-to-wipe EPHEMERAL`.
        # TPM presence is not sufficient; do not "fix" this by re-enabling tpm
        # without also enrolling Secure Boot keys at the console.
        #
        # nodeID derives from node UUID + name: still protects a stolen disk,
        # but gives no measured boot.
        |-
        machine:
          systemDiskEncryption:
            ephemeral:
              provider: luks2
              keys:
                - slot: 0
                  nodeID: {}
            state:
              provider: luks2
              keys:
                - slot: 0
                  nodeID: {}
      - # Combined CP+worker on a 754 GiB / 72-core box that also runs a 384 GiB
        # KubeVirt guest. Reserve enough that etcd is never starved.
        |-
        machine:
          kubelet:
            extraConfig:
              systemReserved:
                cpu: 2000m
                memory: 4Gi
              kubeReserved:
                cpu: 2000m
                memory: 8Gi
      - # Refuse DISCARD on the 7.68T HGST SN200.
        #
        # A large deallocate races the drive's L2P journal flush and drops it
        # into "Post Crash Startup" -- it stops presenting a namespace, the
        # kernel reset-loops it, udevd's queue never drains and KUBELET NEVER
        # STARTS. WD errata OM-6588/6836/6850/7044; see docs/sn200-firmware-re.md.
        #
        # Talos exposes no mkfs flags, so `mkfs.xfs -K` is not reachable from
        # config -- but zeroing discard_max_bytes makes the kernel refuse the
        # discard, and mkfs/fstrim then skip TRIM instead of wedging the drive.
        # This is what makes the `data` userVolume survivable on this disk.
        #
        # Matched on MODEL, never on kernel name: nvmeN numbering is not stable
        # and a KERNEL=="nvme7n1" rule could land on a ceph OSD after a reorder.
        #
        # SCOPE, deliberately: this is a NODE patch, so it protects this host
        # only. sea1-k8s-1 carries the same rule since hv-1 went metal
        # 2026-08-05. That leaves sea1-k8s-0, whose SN200 is still passed
        # through from hv-0 (invisible in the HV's own /sys/class/nvme, which is
        # why it reads as a clean negative), live and with discard_max_bytes at
        # 2199023255040.
        #
        # Leaving it exposed is an accepted decision (2026-08-03), not an
        # oversight: it holds production data, and acting on a working SN200 is
        # itself a risk. Generalise this rule when that data is replicated or
        # evacuated -- see docs/sn200-runbook.md section 0a.
        |-
        machine:
          udev:
            rules:
              - ACTION=="add|change", SUBSYSTEM=="block", KERNEL=="nvme*", ATTRS{model}=="HUSMR7676BDP3Y1*", ATTR{queue/discard_max_bytes}="0"
# sea1-k8s-103-0 (wobscale rack, 10.3.6.3) was decommissioned 2026-08-04. It was
# the only node off the site L2 -- 10.3.6.0/27 and 2620:fc:c000::/64 against
# everyone else's 10.3.2.0/23 and 2602:fa6d:10:ffff::/116 -- which forced the
# cluster onto an overlay CNI. With it gone every node is on one L2 in both
# families, so Cilium can route natively with no encapsulation.
#
# Its no-database / no-lan-vip / no-virt labels were only ever about this node.
# The DoesNotExist selectors that reference them now match everything, so those
# affinity blocks are inert rather than wrong -- left in place deliberately, for
# the next odd node.
