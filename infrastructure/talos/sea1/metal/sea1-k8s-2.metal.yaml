# PROPOSED metal node definition for sea1-k8s-2 (first host: hv-2 -> Talos).
#
# NOT wired into talconfig.yaml yet. The existing `sea1-k8s-2` VM entry must
# stay until the cutover -- two entries cannot share a hostname. At cutover this
# block REPLACES that entry.
#
# Identity is reused deliberately: hostname sea1-k8s-2, 10.3.2.12,
# 2602:fa6d:10:ffff::112. That keeps the lan-bridge label, the KubeVirt node
# affinities, the br0-lan NAD, ceph's public_network membership and the Rook
# mon-ip annotation all working untouched. The retired sea1-k8s-cp-2 identity
# (10.3.2.18 / ::118) disappears -- this node is CP *and* worker.
#
# CRUSH is unaffected: osd_crush_update_on_start=false freezes the existing
# `sea1-hv-2` bucket, so the adopted OSDs stay put regardless of the new
# hostname. Do not re-enable that until all three hosts are converted.
#
# ── VERIFIED ON hv-2, 2026-08-03 ─────────────────────────────────────────────
#   NICs      eno1np0 08:c0:eb:34:76:7e / eno2np1 08:c0:eb:34:76:7f, mlx5_core
#   LAN       OVS bond_mode balance-tcp, lacp_status negotiated, MTU 9000
#             (balance-tcp == 802.3ad + layer3+4 hashing)
#   SATA      sda SDLF1CRR-019T-1HA1 serial A0063F20  <- install target
#             sdb SDLF1CRR-019T-1HA1 serial 202D54E2  <- ZFS mirror half, wipe
#   OSDs      7x INTEL SSDPE2KX020T8 1.8T (nvme0n1..nvme6n1) -- NEVER touch
#   data      HGST Ultrastar SN200 7.68T at b2:00.0, currently vfio-pci
#             (passed through to the VM); becomes a normal NVMe on metal
#   firmware  UEFI, Secure Boot DISABLED
#   TPM       hv-0 and hv-1 HAVE TPM 2.0 (/dev/tpm0, tpm_version_major 2).
#             hv-2 has none: no /sys/class/tpm, no /dev/tpm*. Whether the module
#             is absent or merely disabled in firmware cannot be determined
#             remotely -- these Dells emit NO SMBIOS type 43 record at all, not
#             even on hv-0 where the TPM demonstrably works, so dmidecode is not
#             authoritative here and sysfs is the only usable signal.
#
# DECISION: nodeID LUKS on ALL THREE metal nodes, not just hv-2. FDE stays on;
# only the key source changes. Rationale: hv-2 forces it regardless, and mixed
# encryption across three otherwise-identical nodes is the sort of asymmetry
# that bites during an incident. Keys apply at install and every node is being
# reinstalled anyway, so switching to TPM later is free -- revisit in the same
# BIOS session that enables Secure Boot, once there is a console.
#
# Honest tradeoff: nodeID derives the key from node UUID + name rather than
# sealing to platform state. It still protects a stolen disk, but gives no
# measured boot -- which Secure Boot being disabled already denied us.
# ─────────────────────────────────────────────────────────────────────────────
#
# Cluster-level change this depends on (add to talconfig.yaml):
#   allowSchedulingOnControlPlanes: true
# Without it the node comes up tainted NoSchedule and nothing lands on it.
#
# Also required at cutover: move the cluster-wide TPM `systemDiskEncryption`
# patch and the `EthernetConfig name: ens18` flannel-checksum patch into the
# VM nodes' per-node patches. The TPM one cannot be satisfied here (no TPM) and
# the ens18 one is virtio-specific and matches nothing on metal.

- hostname: sea1-k8s-2
  ipAddress: "10.3.2.12"
  controlPlane: true

  # Both SATA SSDs share a model, so pin by serial or the choice is arbitrary.
  # This value is PER HOST -- hv-0 and hv-1 have different serials.
  installDiskSelector:
    serial: "A0063F20"

  # Secure Boot is off in firmware on these R640s and enrolling the Sidero key
  # needs a console we do not have, so this must be the NON-secureboot image.
  #
  # `machineSpec: {secureboot: false}` at node level DOES NOT WORK -- verified:
  # talhelper still emitted metal-installer-secureboot because the controlPlane
  # block's `secureboot: true` wins (false is indistinguishable from unset).
  # Pinning the image URL explicitly is the only reliable override. talhelper
  # appends `:v1.13.7` from talosVersion.
  talosImageURL: factory.talos.dev/metal-installer/7e1f6386358eb4d68cf5a947ce712411b656380140d20539357e4a9a627b76a5

  schematic:
    # factory.talos.dev schematic 7e1f6386358eb4d68cf5a947ce712411b656380140d20539357e4a9a627b76a5
    customization:
      extraKernelArgs:
        # There is no console at sea1 today. These make iDRAC Serial-over-LAN
        # give real boot output the moment OOB access exists, and cost nothing
        # if it never does. tty0 first keeps VGA primary.
        - console=tty0
        - console=ttyS0,115200n8
      systemExtensions:
        officialExtensions:
          - siderolabs/intel-ucode        # Xeon Gold 6140 -- Intel, not AMD
          - siderolabs/lldpd              # which switch port am I on
          - siderolabs/util-linux-tools   # lsblk/blkid/wipefs: ceph-volume
                                          # nsenters to HOST binaries in the
                                          # OSD-prepare pod and Talos lacks these
          - siderolabs/nvme-cli           # 8 NVMe per host
          - siderolabs/mellanox-mstflint  # CX4 Lx firmware
        # NOT included: qemu-guest-agent (meaningless on metal), mellanox-ofed
        # (mlx5_core is in-kernel), iscsi-tools, mei.

  nodeLabels:
    generalprogramming.org/lan-bridge: "true"

  nodeAnnotations:
    # Rook takes the FIRST NodeInternalIP, which is IPv4 here, while ceph's
    # public_network is 2602:fa6d:10:ffff::/116. Without this a mon binds an
    # address no other mon can reach and hangs in probing.
    network.rook.io/mon-ip: "2602:fa6d:10:ffff::112"

  # Public resolvers only, deliberately excluding sea1-core: nothing in a node's
  # boot path may depend on a service that runs on the cluster.
  nameservers:
    - 1.1.1.1
    - 1.0.0.1

  networkInterfaces:
    # LACP bond to the provider's MLAG pair (s1-a13-102 / s2-a13-102).
    # Members are named literally because they were read off the running host;
    # a driver: mlx5_core deviceSelector would also match exactly these two,
    # but talhelper's handling of a multi-match selector feeding a bond is
    # unverified -- see the REVIEW note at the bottom.
    - interface: bond0
      dhcp: false
      mtu: 9000
      bond:
        interfaces:
          - eno1np0
          - eno2np1
        mode: 802.3ad
        xmitHashPolicy: layer3+4
        lacpRate: slow
        miimon: 100

    # br0 carries the node address and is what Multus/KubeVirt attach LAN
    # guests to. MTU 9000 must appear on the members, the bond and the bridge --
    # a bridge cannot exceed its members.
    - interface: br0
      dhcp: false
      mtu: 9000
      addresses:
        - "10.3.2.12/23"
        - "2602:fa6d:10:ffff::112/116"
      routes:
        - network: "0.0.0.0/0"
          gateway: "10.3.2.1"
        # Declared, not learned. RA was only ever working by inherited
        # accept_ra and a later apply reconciled it away, costing all three
        # workers their IPv6 egress. Gateway is the router's administratively
        # chosen global address, not its EUI-64 link-local.
        - network: "::/0"
          gateway: "2602:fa6d:10:ffff::1"
      bridge:
        stp:
          enabled: false
        # NB: bridgePort.master is silently dropped by talhelper v3.1.15 --
        # membership must be declared from this side.
        interfaces:
          - bond0

  userVolumes:
    - name: data
      provisioning:
        # The size guard is what keeps Talos off the seven 2TB OSD drives.
        # Only the 7.68TB HGST qualifies. disk.size is a uint -- the literal
        # needs the u suffix or talhelper rejects the CEL.
        diskSelector:
          match: disk.transport == "nvme" && disk.size > 5000000000000u
        minSize: 500GiB
      filesystem:
        type: xfs

  patches:
    - # TPM-sealed LUKS. hv-2's TPM 2.0 was present but disabled in firmware;
      # enabled via Redfish 2026-08-03 and verified live (/dev/tpm0, iDRAC
      # TrustedModules State=Enabled, fw 1.3.1.0).
      #
      # CONSTRAINT: Talos defaults to pcrs: [7], and PCR 7 measures the Secure
      # Boot state. This seals against SecureBoot=Disabled. Turning Secure Boot
      # ON later changes PCR 7 and the disk STOPS UNSEALING -- the node will not
      # boot. Secure Boot must stay off for the life of this install; revisit
      # only at a reinstall, which re-seals anyway.
      |-
      machine:
        systemDiskEncryption:
          ephemeral:
            provider: luks2
            keys:
              - slot: 0
                tpm: {}
          state:
            provider: luks2
            keys:
              - slot: 0
                tpm: {}
    - # Combined CP+worker on a 754 GiB / 72-core box that also runs a 384 GiB
      # KubeVirt guest. Reserve enough that etcd is never starved.
      |-
      machine:
        kubelet:
          extraConfig:
            systemReserved:
              cpu: 2000m
              memory: 4Gi
            kubeReserved:
              cpu: 2000m
              memory: 8Gi

# ── ALREADY VERIFIED by test-generating this against a scratch talconfig ─────
# * The BOND SURVIVES and a bond IS a valid bridge member. Generated output:
#     BondConfig  name: bond0  links: [eno1np0, eno2np1]  bondMode: 802.3ad
#                 xmitHashPolicy: layer3+4  lacpRate: slow  miimon: 100  mtu: 9000
#     BridgeConfig name: br0   links: [bond0]  stp.enabled: false  mtu: 9000
#                 addresses 10.3.2.12/23 + 2602:fa6d:10:ffff::112/116, both routes
#   This was the single biggest unknown and it is now closed.
# * type: controlplane, install.diskSelector.serial A0063F20,
#   systemDiskEncryption keyed by nodeID on both state and ephemeral,
#   UserVolumeConfig `data` with the size-guarded selector, systemReserved.
# * The cluster-wide TPM patch MUST move to the VM nodes first -- with both
#   present talhelper hard-fails: `partition "STATE": encryption key slot 0 is
#   already in use`. This is a blocking prerequisite, not tidy-up.
# * The `EthernetConfig name: ens18` patch still lands on this node. It matches
#   nothing on metal (harmless) but should move per-node with the TPM patch.
#
# ── STILL UNVERIFIED, CHECK ON FIRST BOOT ────────────────────────────────────
# 1. lacpRate: the switch side is a provider-run Arista MLAG. slow (30s) is the
#    Arista default; a mismatch is legal but noisy. Confirm via lldpd once up.
# 2. Whether the HGST enumerates as expected once vfio-pci releases it.
#    `talosctl get disks` on first boot, before trusting the data userVolume.
# 3. `grubUseUKICmdline: true` is still emitted; believed inert with sd-boot on
#    UEFI, but worth a glance if the first boot misbehaves.
# 4. etcd on SATA: EPHEMERAL lands on the SanDisk SSD. Alarm on
#    etcd_disk_wal_fsync_duration_seconds p99 from day one.
# 5. Delete the local-path PVs pinned to sea1-k8s-2 BEFORE this node returns --
#    a fresh node of the same name has an empty /var/mnt/data and the old PVs
#    would bind to empty directories. Silent, and worse than a failure.
