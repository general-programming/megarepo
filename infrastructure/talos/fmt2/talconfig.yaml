  patches:
    - # Audit policy -- identical to sea1's on purpose; keep them in step.
      # Talos ships `rules: [{level: Metadata}]`, i.e. log everything at every
      # stage, onto the ephemeral partition with nothing collecting it.
      # Measured on sea1 over 14000 events: the RequestReceived duplicate is
      # 47.8% of all events, and of what remains, leases are 38.9%, the argocd
      # app-controller 10.9%, and system:nodes/apiserver reads 15.5%. Dropping
      # those leaves ~17% of the volume and keeps the security signal.
      # See docs/k8s-security-review-2026-08.md.
      #
      # Rule order matters -- first match wins. Keep rules come first so a
      # later blanket `None` cannot swallow them: system:nodes does watch
      # secrets, and that must stay logged even though its other reads do not.
      |-
      cluster:
        apiServer:
          auditPolicy:
            apiVersion: audit.k8s.io/v1
            kind: Policy
            omitStages:
              - RequestReceived
              - ResponseStarted
            rules:
              # -- keep: security-relevant, regardless of who does it --
              - level: Metadata
                resources:
                  - group: ""
                    resources: ["secrets", "serviceaccounts/token"]
                  - group: "rbac.authorization.k8s.io"
                  - group: "authentication.k8s.io"
                  - group: "certificates.k8s.io"
              - level: Metadata
                resources:
                  - group: ""
                    resources: ["pods/exec", "pods/attach", "pods/portforward"]
              # -- drop: high-volume, no security value --
              - level: None
                resources:
                  - group: "coordination.k8s.io"
                    resources: ["leases"]
              - level: None
                users: ["system:serviceaccount:argocd:argocd-application-controller"]
                verbs: ["update", "patch"]
                resources:
                  - group: "argoproj.io"
                    resources: ["applications"]
              - level: None
                userGroups: ["system:nodes"]
                verbs: ["get", "list", "watch"]
              - level: None
                users: ["system:apiserver"]
                verbs: ["get", "list", "watch"]
              # -- everything else --
              - level: Metadata
patches:
  - # DO NOT REMOVE. Cilium is the CNI (argocd/apps/infra/cilium/fmt2);
    # dropping this reinstalls flannel under a running Cilium cluster.
    # Cilium also replaces kube-proxy, reaching the API via KubePrism.
    |-
    cluster:
      network:
        cni:
          name: none
      proxy:
        disabled: true
  # Deliberately NOT carried over: machine.registries.config:
  # The live config holds credentials for registry.generalprogramming.org. They
  # are dropped on the next apply, on purpose. Verified 2026-08-08: zero running
  # pods and zero workload specs reference that registry, there are no
  # dockerconfigjson secrets, the `registry` namespace is empty, and the endpoint
  # does not respond. If it is ever revived, the credential belongs in
  # talsecret.sops.yaml, not in plaintext here.
  - # Encrypt system disk with TPM
    |-
    machine:
      systemDiskEncryption:
        ephemeral:
          provider: luks2
          keys:
            - slot: 0
              nodeID: {}
        state:
          provider: luks2
          keys:
            - slot: 0
              nodeID: {}
  # IPv6 / dual-stack — STAGED, NOT ACTIVE:
  # Activated in phase D of docs/fmt2-talos-k8s-update.md. Deliberately inert
  # until then so the sizing below is reviewed on its own terms.
  #
  # The previous values were fc00:cafe:cafe:1::/64 and fc00:cafe:cafe:2::/64.
  # BOTH WERE UNUSABLE, which is why this never reached a control plane:
  #   - a /64 service CIDR is REJECTED by kube-apiserver, which caps the IPv6
  #     Service range at /108. Applying it to a control plane means the API
  #     server does not come back.
  #   - a /64 pod CIDR yields exactly ONE node allocation, because
  #     --node-cidr-mask-size-ipv6 defaults to 64. Seven of eight nodes get none.
  #   - fc00::/8 is the unassigned half of ULA; fd00::/8 is the half defined for
  #     locally-generated prefixes. Renumbered while resizing.
  # Sizes follow sea1 (fd40:10:244::/56 pod, /108 service).
  #
  # NOTE: the workers currently carry the old /64 pair and the control planes
  # carry none -- a split-brain that is inert only because kube-controller-manager
  # runs on the control planes. Phase D resolves it.
  #
  # - |-
  #   cluster:
  #     network:
  #       podSubnets:
  #           - 10.244.0.0/16
  #           - fd00:cafe:cafe:1::/56
  #       serviceSubnets:
  #           - 10.96.0.0/12
  #           - fd00:cafe:cafe:2::/108
  - # KubePrism: a node-local load-balanced endpoint for the API server on
    # localhost:7445. Required before Cilium can replace kube-proxy -- without
    # kube-proxy the agent cannot resolve the kubernetes Service to reach the
    # API server. Absent from this cluster until now; sea1 already had it.
    #
    # hostDNS.forwardKubeDNSToHost stays true (the default), matching what sea1
    # actually runs. With the stock Corefile forwarding '.' to the node
    # resolver, pinning this false would break all external DNS on the cluster.
    |-
    machine:
      features:
        # Pinned explicitly, not because the defaults differ, but because the
        # generated config omits them and a silent rbac:false would be a
        # security regression nobody would notice in a diff full of omissions.
        # stableHostname is NOT set here: Talos moved it to its own
        # HostnameConfig document (auto: stable), and setting both is a
        # genconfig error.
        rbac: true
        apidCheckExtKeyUsage: true
        kubePrism:
          enabled: true
          port: 7445
        hostDNS:
          enabled: true
          forwardKubeDNSToHost: true
  - # Disable NIC tx checksum offload — works around the flannel VXLAN bad-UDP-checksum
    # bug (virtio_net + kernel offload corrupts inner checksums on encapsulated traffic,
    # silently dropping cross-node UDP/DNS). ref: flannel-io/flannel#1279, siderolabs/talos#8873
    # Confirmed 2026-08-08: ens18 is the only up ether device on all 8 nodes, and
    # this patch has never actually been applied (no ethernetspecs on any node).
    |-
    apiVersion: v1alpha1
    kind: EthernetConfig
    name: ens18
    features:
      tx-checksum-ip-generic: false

  # Ingress firewall — same shape as sea1's; semantics and rollout live in
  # .claude/skills/talos-ingress-firewall. The nodes carry only private IPv4,
  # but 79.110.170.65 routes public traffic onto them, and nothing filtered
  # host services (apid, etcd, kubelet, consul serf) from the rest of 10/8.
  #
  # Talos auto-allows the pod/service subnets, lo, and established/related, so
  # pod->node and node egress need no rules. Chain sits at -140, ahead of DNAT.
  - |-
    apiVersion: v1alpha1
    kind: NetworkRuleConfig
    name: control-plane-apis
    portSelector:
      ports:
        - 6443          # kube-apiserver
        - 50000         # apid -- the talosctl path; losing it loses the cluster
        - 50001         # trustd, node-to-node cert issuance
        - 2379-2380     # etcd peer + client
        - 10250         # kubelet
      protocol: tcp
    ingress:
      - subnet: 10.0.0.0/8
      - subnet: 172.16.0.0/12
      - subnet: 192.168.0.0/16
      - subnet: 100.64.0.0/10
      - subnet: fd00::/8
  - |-
    apiVersion: v1alpha1
    kind: NetworkRuleConfig
    name: cluster-services-tcp
    portSelector:
      ports:
        - 179           # frr-k8s BGP; leaves .34/.35 and external peer .36 may re-open inbound
        - 4240          # cilium health
        - 4244          # hubble peer
        - 8301-8302     # consul client serf
        - 9100          # node-exporter
        - 9962-9965     # cilium agent/operator/envoy metrics (unauthenticated)
        - 6667          # znc on the internal MetalLB VIP; pre-DNAT dport, see PR notes
        - 6697          # znc TLS, same VIP
      protocol: tcp
    ingress:
      - subnet: 10.0.0.0/8
      - subnet: 172.16.0.0/12
      - subnet: 192.168.0.0/16
      - subnet: 100.64.0.0/10
      - subnet: fd00::/8
  - |-
    apiVersion: v1alpha1
    kind: NetworkRuleConfig
    name: cluster-services-udp
    portSelector:
      ports:
        - 8301-8302     # consul serf gossip
      protocol: udp
    ingress:
      - subnet: 10.0.0.0/8
      - subnet: 172.16.0.0/12
      - subnet: 192.168.0.0/16
      - subnet: 100.64.0.0/10
      - subnet: fd00::/8
  - # These nodes are DHCP clients (no static networkInterfaces above). A
    # renewal OFFER/ACK from the server does not always match conntrack, so
    # without this a lease expiry silently costs the node its address.
    |-
    apiVersion: v1alpha1
    kind: NetworkRuleConfig
    name: dhcp-client
    portSelector:
      ports:
        - 68
      protocol: udp
    ingress:
      - subnet: 10.0.0.0/8
  - # The public path: traefik + znc-external share 79.110.170.65, which lands
    # on a node pre-DNAT. NodePorts go with it -- a rule never consulted is
    # harmless, a missing one is an outage (see the sea1 rationale).
    |-
    apiVersion: v1alpha1
    kind: NetworkRuleConfig
    name: public-web-ingress
    portSelector:
      ports:
        - 80
        - 443
        - 16969         # znc-external on the shared VIP
        - 30000-32767
      protocol: tcp
    ingress:
      - subnet: 0.0.0.0/0
      - subnet: ::/0
  - |-
    apiVersion: v1alpha1
    kind: NetworkRuleConfig
    name: public-web-ingress-udp
    portSelector:
      ports:
        - 30000-32767
      protocol: udp
    ingress:
      - subnet: 0.0.0.0/0
      - subnet: ::/0
  - # Lifts the hardcoded 5/s ICMPv6 cap for link-local NDP (and ULA, for the
    # staged dual-stack). Full mechanism documented in sea1's talconfig.
    |-
    apiVersion: v1alpha1
    kind: NetworkRuleConfig
    name: icmpv6-ndp-pmtud
    portSelector:
      ports:
        - 1-65535
      protocol: icmpv6
    ingress:
      - subnet: fe80::/10
      - subnet: fd00::/8
  - # Enforcement. Keep LAST -- with it absent the rules above are inert, which
    # is how a change to them is staged. Applied per-node with --mode=try first;
    # rollout order in the PR / skill, never all eight at once.
    |-
    apiVersion: v1alpha1
    kind: NetworkDefaultActionConfig
    ingress: block
