# DRAFT — not wired into argocd. Apply only AFTER the ACL phases in README.md.
#
# Deliberately kept out of argocd/apps/infra/consul/sea1/ so it cannot be swept
# into a commit and auto-deployed by selfHeal ahead of the ACL work.
#
# When ready, merge the `client:` keys below into
# argocd/apps/infra/consul/sea1/consul.yaml (they merge cleanly with the
# resources/GOMAXPROCS block that lives in ../base/application.yaml -- verified
# with `kubectl kustomize argocd/apps/infra/consul/sea1`).

client:
  # hostNetwork puts the agent in the node's netns so it can see the node's
  # global IPv6 (2602:fa6d:10:ffff::407 etc). On the pod network the only v6 is
  # the ULA fd40:10:244:6::/64, which is why the go-sockaddr template below
  # cannot work without this -- it evaluates inside the agent's own netns.
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  # Redundant under hostNetwork, and it is what forces ADVERTISE_IP to the
  # v4 status.hostIP in the first place.
  exposeGossipPorts: false

  extraEnvironmentVars:
    # The chart sets ADVERTISE_IP from a fieldRef earlier in the env list;
    # Kubernetes takes the LAST duplicate, so this wins. Verified by rendering
    # the chart: ADVERTISE_IP appears at env[0] (fieldRef) and again after
    # CONSUL_DISABLE_PERM_MGMT with this value.
    #
    # go-sockaddr classifies the ULA fd00::/8 as private and 2602::/2620:: as
    # public, so this selects the node's routable v6. Consul evaluates the
    # template per-agent; the shell passes {{ }} through untouched.
    ADVERTISE_IP: '{{ GetPublicInterfaces | include "type" "IPv6" | attr "address" }}'

# ---------------------------------------------------------------------------
# Verified before drafting (2026-08-02)
#
#   - inbound v6 UDP hostPort reaches the pod: sending a probe from hv-0 to
#     [2602:fa6d:10:ffff::407]:8301 produced
#     "memberlist: msg type (67) not supported from=[2602:fa6d:10:ffff::101]"
#     in the pod log (67 = ASCII 'C', first byte of the test payload).
#   - pod -> HV over global v6 TCP connects in 0.5ms.
#   - pod -> public v6 works (flannel --ip-masq with EnableIPv6).
#   - consul already binds a dual-stack wildcard despite -bind=0.0.0.0
#     (/proc/net/udp empty, /proc/net/udp6 has [::]:8301), so bind needs no
#     override.
#
# Pre-flight checks 1 and 2 are now CLEARED:
#
#   1. Exactly one global v6 per node -- verified via talosctl on all four.
#      No SLAAC privacy/temporary addresses, so the template cannot return a
#      multi-value result and refuse to start.
#   2. sea1-k8s-103-0 is FINE. TCP to [2620:fc:c000:0:be24:11ff:fe63:ec8e]:8301
#      connects in 1.2ms from hv-0. The earlier ENETUNREACH was a bash
#      /dev/tcp parsing quirk with that address form, not a network fact.
#      No nodeSelector split needed -- all four nodes can do v6 gossip.
#
# BLOCKED ON 3: node v6 comes from DHCPv6 and is actively churning. Two of
# three nodes changed address within one hour (::407 -> ::40f, ::405 -> ::40c)
# because Talos mints a new DUID-LLT every boot. Advertising a moving address
# would trade the current flap for an address-churn flap. See dhcpv6-blocker.md
# -- recommended fix is static v6 in talconfig using the addresses NetBox
# already reserves (::110/::111/::112).
# ---------------------------------------------------------------------------
