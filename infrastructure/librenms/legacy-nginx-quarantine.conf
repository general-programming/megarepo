# Temporary PHP quarantine for the legacy LibreNMS on fmt2-core-0.
# Install as /etc/nginx/sites-enabled/librenms.conf and reload nginx.
server {
    listen 80;
    listen [::]:80;
    server_name nms.as208590.net;
    return 503;
}

server {
    listen 443 ssl;
    server_name nms.as208590.net;
    ssl_certificate /etc/letsencrypt/live/nms.as208590.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nms.as208590.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 503;
}
