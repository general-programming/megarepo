[tool.uv.workspace]
members = ["scripts"]

[tool.ty.src]
include = ["nix", "scripts"]
# Not ty-clean yet; drop these from the exclude list as they get fixed.
# scripts/twilio imports a `create_twilio` that common.py does not define.
exclude = ["scripts/twilio"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]
